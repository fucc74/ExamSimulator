<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#01a982">
    <title>Exam Simulator</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
/*{{CSS}}*/
    </style>
    <script>
    // Apply the saved theme before first paint (avoids a flash)
    (function () {
        var theme = null;
        try {
            var raw = localStorage.getItem('examsim:v2');
            if (raw) theme = (JSON.parse(raw).prefs || {}).theme;
            if (!theme) theme = localStorage.getItem('exam_theme');
        } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
            theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
    })();
    </script>
    <script src="exams.js" onerror="void 0"></script>
</head>
<body>
<a class="skip-link" href="#main" id="skip-link">Skip to content</a>
<header>
    <div class="header-container">
        <div class="logo-area">
            <div class="hpe-element"></div>
            <div class="logo-text"><span id="logo-exam-code">EXAM</span> <span id="logo-simulator">SIMULATOR</span> <span id="logo-version" style="font-size:0.7rem;color:var(--gray);font-weight:400;"></span></div>
        </div>
        <div class="header-controls">
            <div id="runtime-timer-box" class="q-number hidden"><span id="timer-label"></span> <span id="runtime-clock-string" style="color: var(--dark); font-weight: 600;">--:--</span></div>
            <button type="button" id="lang-btn" class="icon-btn">EN</button>
            <button type="button" id="theme-btn" class="icon-btn">☾</button>
        </div>
    </div>
</header>

<main id="main" class="main-wrapper" tabindex="-1">
    <section id="view-picker" class="card hidden"></section>
    <section id="view-dashboard" class="card hidden"></section>
    <section id="view-runtime" class="hidden"></section>
    <section id="view-review" class="card hidden"></section>
    <section id="view-summary" class="card hidden"></section>
    <section id="view-stats" class="card hidden"></section>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="import-file" accept=".json,application/json" class="hidden">

</html>
