            }
            if (ch === '{') { i++; const r = seq('}'); i++; return r; }
            if (/[0-9.]/.test(ch)) { let n = ''; while (i < src.length && /[0-9.,]/.test(src[i]) && !(src[i] === ',' && !/[0-9]/.test(src[i + 1] || ''))) n += src[i++]; return { t: 'mn', v: n }; }
            if (/[A-Za-z]/.test(ch)) { i++; return { t: 'mi', v: ch }; }
            i++;
            return { t: 'mo', v: ch };
        }
        function scripts(base) {
            for (;;) {
                skipWs();
                if (peek() === '^') { i++; const s = group(); skipWs(); if (peek() === '_') { i++; const b = group(); base = { t: 'msubsup', base, sub: b, sup: s }; } else base = { t: 'msup', base, sup: s }; }
                else if (peek() === '_') { i++; const b = group(); skipWs(); if (peek() === '^') { i++; const s = group(); base = { t: 'msubsup', base, sub: b, sup: s }; } else base = { t: 'msub', base, sub: b }; }
                else return base;
            }
        }
        function seq(stop) {
            const items = [];
            for (;;) {
                skipWs();
                if (i >= src.length || (stop && peek() === stop)) break;
                const a = atom();
                if (!a) break;
                items.push(scripts(a));
            }
            return { t: 'mrow', c: items };
        }
        return seq(null);
    }

    // ------------------------------------------------------------------ inline
    function inline(text) {
        const out = [];
        let buf = '';
        const flush = () => { if (buf) { out.push({ t: 'text', v: buf }); buf = ''; } };
        let i = 0;
        while (i < text.length) {
            const rest = text.slice(i);
            let m;
            if (text[i] === '\n') { flush(); out.push({ t: 'br' }); i++; continue; }
            if (text[i] === '\\' && /[*`$\[\]!\\]/.test(text[i + 1] || '')) { buf += text[i + 1]; i += 2; continue; }
            if ((m = rest.match(/^`([^`\n]+)`/))) { flush(); out.push({ t: 'code', v: m[1] }); i += m[0].length; continue; }
            if ((m = rest.match(/^!\[([^\]\n]*)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/))) {
                flush();
                if (SAFE_IMG.test(m[2])) out.push({ t: 'img', src: m[2], alt: m[1] }); else out.push({ t: 'text', v: m[1] || '[image]' });
                i += m[0].length; continue;
            }
            if ((m = rest.match(/^\[([^\]\n]+)\]\(([^)\s]+)\)/))) {
                flush();
                if (SAFE_LINK.test(m[2])) out.push({ t: 'a', href: m[2], c: inline(m[1]) }); else out.push({ t: 'text', v: m[1] });
                i += m[0].length; continue;
            }
            if ((m = rest.match(/^\*\*([^*\n]+?)\*\*/))) { flush(); out.push({ t: 'b', c: inline(m[1]) }); i += m[0].length; continue; }
            if ((m = rest.match(/^\*([^*\s][^*\n]*?)\*(?![*\w])/)) && (i === 0 || !/\w/.test(text[i - 1]))) { flush(); out.push({ t: 'i', c: inline(m[1]) }); i += m[0].length; continue; }
            if ((m = rest.match(/^\$([^$\n]+)\$/)) && MATH_HINT.test(m[1]) && !/^\s|\s$/.test(m[1])) { flush(); out.push({ t: 'math', m: parseMath(m[1]), block: false }); i += m[0].length; continue; }
            buf += text[i]; i++;
        }
        flush();
        return out;
    }

    // ------------------------------------------------------------------ blocks
    const isTableSep = l => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l) && l.includes('-');
    const splitRow = l => l.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());

    function parse(text) {
        text = String(text === undefined || text === null ? '' : text).replace(/\r\n?/g, '\n');
        const lines = text.split('\n');
        const blocks = [];
        let para = [];
        const flushPara = () => { if (para.length) { blocks.push({ t: 'p', c: inline(para.join('\n')) }); para = []; } };
        for (let i = 0; i < lines.length; i++) {
            const l = lines[i];
            let m;
            if ((m = l.match(/^\s*```(\w*)\s*$/))) {
                flushPara();
                const code = [];
                i++;
                while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) code.push(lines[i++]);
                blocks.push({ t: 'codeblock', lang: m[1], v: code.join('\n') });
                continue;
            }
            if ((m = l.match(/^\s*\$\$(.+)\$\$\s*$/)) && MATH_HINT.test(m[1])) { flushPara(); blocks.push({ t: 'math', m: parseMath(m[1]), block: true }); continue; }
            if (/^\s*([-*_])\1{2,}\s*$/.test(l) && !para.length) { blocks.push({ t: 'hr' }); continue; }
            if (/^\s*>\s?/.test(l)) {
                flushPara();
                const q = [];
                while (i < lines.length && /^\s*>\s?/.test(lines[i])) q.push(lines[i++].replace(/^\s*>\s?/, ''));
                i--;
                blocks.push({ t: 'quote', c: inline(q.join('\n')) });
                continue;
            }
            if (l.includes('|') && i + 1 < lines.length && isTableSep(lines[i + 1])) {
                flushPara();
                const head = splitRow(l);
                i += 2;
                const rows = [];
                while (i < lines.length && lines[i].includes('|') && lines[i].trim()) rows.push(splitRow(lines[i++]));
                i--;
                blocks.push({ t: 'table', head: head.map(inline), rows: rows.map(r => r.map(inline)) });
                continue;
            }
            if (/^\s*[-*•]\s+\S/.test(l) || /^\s*\d{1,2}[.)]\s+\S/.test(l)) {
                const ordered = /^\s*\d/.test(l);
                const re = ordered ? /^\s*\d{1,2}[.)]\s+(.*)$/ : /^\s*[-*•]\s+(.*)$/;
                // a list needs 2+ consecutive items, otherwise it is just text that starts with "1." or "-"
                let j = i, items = [];
                while (j < lines.length && re.test(lines[j])) { items.push(lines[j].match(re)[1]); j++; }
                if (items.length >= 2 || (items.length === 1 && !para.length && !ordered)) {
                    flushPara();
                    blocks.push({ t: ordered ? 'ol' : 'ul', items: items.map(inline) });
                    i = j - 1;
                    continue;
                }
            }
            if (!l.trim()) { flushPara(); continue; }
            para.push(l);
        }
        flushPara();
        return blocks;
    }

    // ------------------------------------------------------------------ plain text (search, labels)
    function plain(text) {
        return String(text === undefined || text === null ? '' : text)
            .replace(/```\w*\n?([\s\S]*?)```/g, '$1')
            .replace(/!\[([^\]]*)\]\([^)]*\)/g, '$1')
            .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
            .replace(/\$\$?([^$]+)\$\$?/g, (all, m) => MATH_HINT.test(m) ? m : all)
            .replace(/\*\*([^*]+)\*\*/g, '$1').replace(/`([^`]+)`/g, '$1').replace(/\\([*`$\[\]!\\])/g, '$1');
    }
    // true when the text has no markup at all (fast path: a plain text node)
    const isPlain = t => !/[`*$\[\]\n|>\-•]|\d[.)]\s|!\[/.test(String(t));

    // ------------------------------------------------------------------ DOM
    const MATHNS = 'http://www.w3.org/1998/Math/MathML';
    function mathDom(n) {
        const mk = (tag, txt) => { const e = document.createElementNS(MATHNS, tag); if (txt !== undefined) e.textContent = txt; return e; };
        const wrap = (tag, ...kids) => { const e = mk(tag); kids.forEach(k => e.appendChild(mathDom(k))); return e; };
        switch (n.t) {
            case 'mrow': { const e = mk('mrow'); n.c.forEach(c => e.appendChild(mathDom(c))); return e; }
            case 'mi': case 'mn': case 'mo': case 'mtext': return mk(n.t, n.v);
            case 'msup': return wrap('msup', n.base, n.sup);
            case 'msub': return wrap('msub', n.base, n.sub);
            case 'msubsup': return wrap('msubsup', n.base, n.sub, n.sup);
            case 'mfrac': return wrap('mfrac', n.a, n.b);
            case 'msqrt': return wrap('msqrt', n.a);
            default: return mk('mrow');
        }
    }
    function inlineDom(nodes, parent) {
        const { el } = App.util;
        nodes.forEach(n => {
            switch (n.t) {
                case 'text': parent.appendChild(document.createTextNode(n.v)); break;
                case 'br': parent.appendChild(document.createElement('br')); break;
                case 'code': parent.appendChild(el('code', { class: 'rich-code', text: n.v })); break;
                case 'b': { const e = document.createElement('strong'); inlineDom(n.c, e); parent.appendChild(e); break; }
                case 'i': { const e = document.createElement('em'); inlineDom(n.c, e); parent.appendChild(e); break; }
                case 'a': { const e = el('a', { href: n.href, target: '_blank', rel: 'noopener noreferrer' }); inlineDom(n.c, e); parent.appendChild(e); break; }
                case 'img': {
                    const img = el('img', { class: 'rich-img', src: n.src, alt: n.alt || '', loading: 'lazy', tabIndex: 0, role: 'button' });
                    img.addEventListener('click', () => App.rich.zoom(n.src, n.alt));
                    img.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); App.rich.zoom(n.src, n.alt); } });
                    parent.appendChild(img); break;
                }
                case 'math': { const m = document.createElementNS(MATHNS, 'math'); if (n.block) m.setAttribute('display', 'block'); m.appendChild(mathDom(n.m)); parent.appendChild(m); break; }
            }
        });
        return parent;
    }
    function blocksDom(blocks, parent) {
        const { el } = App.util;
        blocks.forEach(b => {
            switch (b.t) {
                case 'p': parent.appendChild(inlineDom(b.c, el('p'))); break;
                case 'codeblock': parent.appendChild(el('pre', { class: 'rich-pre' }, el('code', { text: b.v, class: b.lang ? 'lang-' + b.lang : '' }))); break;
                case 'ul': case 'ol': { const l = el(b.t); b.items.forEach(it => l.appendChild(inlineDom(it, el('li')))); parent.appendChild(l); break; }
                case 'quote': parent.appendChild(inlineDom(b.c, el('blockquote'))); break;
                case 'hr': parent.appendChild(el('hr')); break;
                case 'math': { const m = document.createElementNS(MATHNS, 'math'); m.setAttribute('display', 'block'); m.appendChild(mathDom(b.m)); parent.appendChild(el('div', { class: 'rich-math', tabIndex: 0, role: 'group', 'aria-label': App.t('formulaLabel') }, m)); break; }
                case 'table': {
                    const t = el('table', { class: 'rich-table' });
                    const th = el('tr'); b.head.forEach(h => th.appendChild(inlineDom(h, el('th')))); t.appendChild(el('thead', {}, th));
                    const tb = el('tbody'); b.rows.forEach(r => { const tr = el('tr'); r.forEach(c => tr.appendChild(inlineDom(c, el('td')))); tb.appendChild(tr); }); t.appendChild(tb);
                    parent.appendChild(el('div', { class: 'rich-table-wrap' }, t)); break;
                }
            }
        });
        return parent;
    }

    App.rich = {
        parse, parseMath, plain, isPlain, SAFE_IMG,
        // Block rendering (question text, explanations): returns a <div class="rich">
        node(text) {
            const { el } = App.util;
            const t = String(text === undefined || text === null ? '' : text);
            const box = el('div', { class: 'rich' });
            if (isPlain(t)) { if (t) box.appendChild(el('p', { text: t })); return box; }
            return blocksDom(parse(t), box);
        },
        // Inline rendering (options, list items, table cells): returns a <span class="rich-inline">
        inline(text) {
            const { el } = App.util;
            const t = String(text === undefined || text === null ? '' : text);
            const box = el('span', { class: 'rich-inline' });
            if (isPlain(t)) { box.textContent = t; return box; }
            return inlineDom(inline(t), box);
        },
        // Click-to-zoom for images
        zoom(src, alt) {
            const { el } = App.util;
            const close = () => { dlg.remove(); document.removeEventListener('keydown', onKey); };
            const onKey = e => { if (e.key === 'Escape') close(); };
            const dlg = el('div', { class: 'lightbox', role: 'dialog', aria: { modal: 'true', label: alt || 'Image' }, onclick: close },
                el('img', { src, alt: alt || '' }), el('button', { type: 'button', class: 'lightbox-close', text: '✕', aria: { label: 'Close' }, onclick: close }));
            document.body.appendChild(dlg);
            document.addEventListener('keydown', onKey);
            dlg.querySelector('button').focus();
        }
    };
})();

/* Question types. Each handler implements:
     prepare(def, ctx)            -> runtime item (shuffles, normalizes the answer)
     hasAnswer(item, value)       -> bool
     isCorrect(item, value)       -> bool
     render(ctx)                  -> DOM node; ctx = {item, value, onChange(value,{silent}), locked, reveal, uid}
     renderReview(item, value)    -> DOM node (answers with correct/wrong marks)
     validateDef(def, path, rep)  -> adds problems with rep.error(path, msg) / rep.warn(path, msg)
   Custom types can be added with App.registerType(name, handler). */
(function () {
    const { el, shuffle, sameSet, isObj } = App.util;
    const LETTERS = ['A', 'B', 'C', 'D', 'E', 'F'];

    App.util.isLoc = v => typeof v === 'string' ? v.trim().length > 0
        : (isObj(v) && Object.keys(v).length > 0 && Object.values(v).every(x => typeof x === 'string' && x.trim().length > 0));

    App.questionType = function (def) {
        if (def.type) return def.type;
        if (Array.isArray(def.parts)) return 'scenario';
        if (Array.isArray(def.pairs)) return 'matching';
        if (Array.isArray(def.items)) return 'ordering';
        if (typeof def.answer === 'boolean') return 'truefalse';
        if (isObj(def.answer) && 'value' in def.answer) return 'numeric';
        const a = Array.isArray(def.answer) ? def.answer : [def.answer];
        return a.length > 1 ? 'multiple' : 'single';
    };

    const textOf = d => d.text !== undefined ? d.text : d.question;

    function baseItem(def, ctx) {
        return {
            uid: def.uid !== undefined ? String(def.uid) : String(def.id),
            id: def.id, topic: def.topic, text: textOf(def), explanation: def.explanation,
            difficulty: def.difficulty, tags: def.tags, source: def.source, estimatedSec: def.estimatedSec,
            points: def.points, mandatory: !!def.mandatory, rev: def.rev
        };
    }

    function prepareAny(def, ctx) {
        const type = App.questionType(def);
        const h = App.types[type];
        if (!h) throw new Error('Unknown question type "' + type + '"');
        const item = h.prepare(def, ctx || {});
        item.kind = item.kind || type;
        return item;
    }
    App.prepareQuestion = prepareAny;
    // Fraction of credit (0..1) for an answer; handlers without fraction() are all-or-nothing.
    App.fractionOf = function (item, value, cfg) {
        const h = App.types[item.kind];
        if (!h.hasAnswer(item, value)) return 0;
        if (h.fraction) return h.fraction(item, value, cfg || {});
        return h.isCorrect(item, value) ? 1 : 0;
    };
    App.typeHandler = item => App.types[item.kind];

    // ---- single / multiple / truefalse ---------------------------------------------------
    function choicePrepare(def, ctx, multi) {
        const item = baseItem(def, ctx);
        const identity = def.options.map((_, i) => i);
        const keep = def.shuffle === false || ctx.shuffleOptions === false;
        const order = keep ? identity : shuffle(identity);
        const answers = (Array.isArray(def.answer) ? def.answer : [def.answer]);
        item.options = order.map(i => def.options[i]);
        item.origin = order;     // shown position -> position in the exam file (used for per-option statistics)
        item.answer = answers.map(a => order.indexOf(a)).sort((a, b) => a - b);
        item.kind = multi ? 'multiple' : 'single';
        return item;
    }

    function choiceRender(multi) {
        return function (ctx) {
            const { item, value, onChange, locked, reveal, uid } = ctx;
            let current = multi ? (Array.isArray(value) ? [...value] : []) : value;
            const isPicked = i => multi ? current.includes(i) : current === i;
            const group = el('div', { class: 'options-list', role: multi ? 'group' : 'radiogroup' });
            const labels = [];

            const paint = () => labels.forEach((lab, i) => {
                let cls = 'option-card' + (isPicked(i) ? ' selected' : '');
                if (reveal && item.answer.includes(i)) cls += ' correct-reveal';
                else if (reveal && isPicked(i)) cls += ' incorrect-reveal';
                lab.className = cls;
                lab.querySelector('input').checked = isPicked(i);
            });

            item.options.forEach((opt, i) => {
                const input = el('input', { type: multi ? 'checkbox' : 'radio', name: 'opt-' + uid, class: 'option-input', disabled: !!locked, checked: isPicked(i) });
                input.addEventListener('change', () => {
                    if (multi) {
                        current = current.includes(i) ? current.filter(x => x !== i) : [...current, i].sort((a, b) => a - b);
                        onChange(current, { silent: true });
                    } else {
                        current = i;
                        onChange(i, { silent: true });
                    }
                    paint();
                });
                const lab = el('label', { class: 'option-card', dataset: { index: i } },
                    input,
                    el('span', { class: 'option-marker', text: LETTERS[i] }),
                    el('span', { class: 'option-text' }, App.rich.inline(App.loc(opt))));
                labels.push(lab);
                group.appendChild(lab);
            });
            paint();
            return group;
        };
    }

    function choiceReview(item, value) {
        const chosen = Array.isArray(value) ? value : (value === undefined ? [] : [value]);
        const box = el('div', { class: 'review-options' });
        item.options.forEach((opt, k) => {
            let cls = 'review-option';
            if (item.answer.includes(k)) cls += ' review-correct';
            else if (chosen.includes(k)) cls += ' review-wrong';
            box.appendChild(el('p', { class: cls }, el('strong', { text: LETTERS[k] + ': ' }), App.rich.inline(App.loc(opt))));
        });
        return box;
    }

    function choiceValidate(multi) {
        return function (def, path, rep) {
            if (!Array.isArray(def.options) || def.options.length < 2 || def.options.length > 6) {
                rep.error(path + '.options', 'must be a list of 2 to 6 options'); return;
            }
            def.options.forEach((o, i) => { if (!App.util.isLoc(o)) rep.error(path + '.options[' + i + ']', 'must be a non-empty string or {en,it} object'); });
            const a = Array.isArray(def.answer) ? def.answer : [def.answer];
            if (!a.length || a.some(x => !Number.isInteger(x))) { rep.error(path + '.answer', 'must be a list of option indexes (0-based)'); return; }
            a.forEach(x => { if (x < 0 || x >= def.options.length) rep.error(path + '.answer', 'index ' + x + ' is out of range (' + def.options.length + ' options)'); });
            if (new Set(a).size !== a.length) rep.error(path + '.answer', 'contains duplicate indexes');
            if (multi && a.length < 2) rep.error(path + '.answer', 'type "multiple" needs at least 2 correct answers');
            if (!multi && a.length !== 1) rep.error(path + '.answer', 'type "single" needs exactly 1 correct answer (use "multiple" otherwise)');
            if (multi) {
                const txt = App.loc(textOf(def)) + ' ' + (isObj(textOf(def)) ? Object.values(textOf(def)).join(' ') : '');
                if (!/select|choose|seleziona|scegli|\b(two|three|four|five|due|tre|quattro|cinque|[2-5])\b/i.test(txt)) rep.warn(path + '.text', 'multiple-answer question should say how many answers to select');
            }
        };
    }

    App.registerType('single', {
        prepare: (d, c) => choicePrepare(d, c, false),
        hasAnswer: (it, v) => v !== undefined,
        isCorrect: (it, v) => v !== undefined && it.answer.includes(v) && it.answer.length === 1,
        render: choiceRender(false), renderReview: choiceReview, validateDef: choiceValidate(false)
    });
    App.registerType('multiple', {
        prepare: (d, c) => choicePrepare(d, c, true),
        hasAnswer: (it, v) => Array.isArray(v) && v.length > 0,
        isCorrect: (it, v) => Array.isArray(v) && sameSet(v, it.answer),
        fraction(it, v, cfg) {
            if (!Array.isArray(v) || !v.length) return 0;
            if (sameSet(v, it.answer)) return 1;
            if (!cfg || !cfg.partialCredit) return 0;
            const good = v.filter(x => it.answer.includes(x)).length, bad = v.length - good;
            return Math.max(0, (good - bad) / it.answer.length);
        },
        render: choiceRender(true), renderReview: choiceReview, validateDef: choiceValidate(true)
    });
    App.registerType('truefalse', {
        prepare(def, ctx) {
            const d = Object.assign({}, def, {
                options: def.options || [{ en: 'True', it: 'Vero' }, { en: 'False', it: 'Falso' }],
                answer: typeof def.answer === 'boolean' ? [def.answer ? 0 : 1] : def.answer,
                shuffle: false
            });
            const item = choicePrepare(d, ctx, false);
            item.kind = 'single';
            return item;
        },
        validateDef(def, path, rep) {
            if (typeof def.answer !== 'boolean' && !(Array.isArray(def.answer) && def.answer.length === 1)) {
                rep.error(path + '.answer', 'true/false questions need answer: true or false');
            }
        }
    });

    // ---- ordering ------------------------------------------------------------------------
    App.registerType('ordering', {
        prepare(def, ctx) {
            const item = baseItem(def, ctx);
            item.items = def.items;
            const n = def.items.length;
            let perm = shuffle([...Array(n).keys()]);
            for (let tries = 0; tries < 10 && perm.every((x, i) => x === i); tries++) perm = shuffle(perm);
            item.shownOrder = perm;
            return item;
        },
        hasAnswer: (it, v) => Array.isArray(v),
        isCorrect: (it, v) => Array.isArray(v) && v.length === it.items.length && v.every((x, i) => x === i),
        fraction(it, v, cfg) {
            if (!Array.isArray(v)) return 0;
            const ok = v.filter((x, i) => x === i).length;
            if (ok === it.items.length) return 1;
            return cfg && cfg.partialCredit ? ok / it.items.length : 0;
        },
        render(ctx) {
            const { item, onChange, locked, reveal } = ctx;
            let order = Array.isArray(ctx.value) ? [...ctx.value] : [...item.shownOrder];
            const wrap = el('div', { class: 'ordering' });
            const hint = el('p', { class: 'type-hint', text: App.t('hintOrdering') });
            const list = el('ol', { class: 'ordering-list' });
            wrap.appendChild(hint);
            wrap.appendChild(list);
            let focusPos = null, focusDir = null;

            function draw() {
                list.textContent = '';
                order.forEach((idx, p) => {
                    let cls = 'ordering-row';
                    if (reveal) cls += idx === p ? ' row-ok' : ' row-bad';
                    const up = el('button', { type: 'button', class: 'mini-btn', text: '↑', disabled: locked || p === 0, aria: { label: App.t('moveUp') } });
                    const down = el('button', { type: 'button', class: 'mini-btn', text: '↓', disabled: locked || p === order.length - 1, aria: { label: App.t('moveDown') } });
                    const move = (to) => {
                        const tmp = order[p]; order[p] = order[to]; order[to] = tmp;
                        focusPos = to; focusDir = to > p ? 'down' : 'up';
                        onChange([...order], { silent: true });
                        draw();
                    };
                    up.addEventListener('click', () => move(p - 1));
                    down.addEventListener('click', () => move(p + 1));
                    list.appendChild(el('li', { class: cls },
                        el('span', { class: 'order-pos', text: String(p + 1) }),
                        el('span', { class: 'order-text' }, App.rich.inline(App.loc(item.items[idx]))),
                        el('span', { class: 'order-btns' }, up, down)));
                });
                if (focusPos !== null) {
                    const row = list.children[focusPos];
                    const btns = row.querySelectorAll('button');
                    const target = (focusDir === 'down' ? btns[1] : btns[0]);
                    (target && !target.disabled ? target : (btns[0].disabled ? btns[1] : btns[0])).focus();
                    focusPos = null;
                }
            }
            draw();

                wrap.appendChild(el('ol', { class: 'ordering-list correct-order' }, ...item.items.map((t, i) =>
                    el('li', { class: 'ordering-row row-ok' }, el('span', { class: 'order-pos', text: String(i + 1) }), el('span', { class: 'order-text' }, App.rich.inline(App.loc(t)))))));
            }
            return wrap;
        },
        renderReview(item, value) {
            const order = Array.isArray(value) ? value : null;
            const box = el('div', { class: 'review-options' });
            box.appendChild(el('p', { class: 'type-hint', text: App.t('yourAnswer') + ':' }));
            if (!order) box.appendChild(el('p', { class: 'review-option review-wrong', text: '—' }));
            else order.forEach((idx, p) => box.appendChild(el('p', { class: 'review-option ' + (idx === p ? 'review-correct' : 'review-wrong') }, el('strong', { text: (p + 1) + '. ' }), App.rich.inline(App.loc(item.items[idx])))));
            box.appendChild(el('p', { class: 'type-hint', text: App.t('correctAnswer') + ':' }));
            item.items.forEach((t, i) => box.appendChild(el('p', { class: 'review-option review-correct' }, el('strong', { text: (i + 1) + '. ' }), App.rich.inline(App.loc(t)))));

        },
        validateDef(def, path, rep) {
            if (!Array.isArray(def.items) || def.items.length < 2 || def.items.length > 10) { rep.error(path + '.items', 'must list 2 to 10 items in the CORRECT order'); return; }
            def.items.forEach((o, i) => { if (!App.util.isLoc(o)) rep.error(path + '.items[' + i + ']', 'must be a non-empty string or {en,it} object'); });
        }
    });

    // ---- matching ------------------------------------------------------------------------
    App.registerType('matching', {
        prepare(def, ctx) {
            const item = baseItem(def, ctx);
            item.lefts = def.pairs.map(p => p.left);
            item.rights = def.pairs.map(p => p.right);
            item.rightOrder = shuffle([...Array(def.pairs.length).keys()]);
            return item;
        },
        hasAnswer: (it, v) => Array.isArray(v) && v.some(x => x >= 0),
        isCorrect: (it, v) => Array.isArray(v) && v.length === it.lefts.length && v.every((x, i) => x === i),
        fraction(it, v, cfg) {
            if (!Array.isArray(v)) return 0;
            const ok = v.filter((x, i) => x === i).length;
            if (ok === it.lefts.length) return 1;
            return cfg && cfg.partialCredit ? ok / it.lefts.length : 0;
        },
        render(ctx) {
            const { item, onChange, locked, reveal } = ctx;
            const val = Array.isArray(ctx.value) ? [...ctx.value] : item.lefts.map(() => -1);
            const wrap = el('div', { class: 'matching' }, el('p', { class: 'type-hint', text: App.t('hintMatching') }));
            item.lefts.forEach((left, i) => {
                const sel = el('select', { class: 'match-select', disabled: !!locked, aria: { label: App.rich.plain(App.loc(left)) } });
                sel.appendChild(el('option', { value: '-1', text: App.t('chooseOne') }));
                item.rightOrder.forEach(r => sel.appendChild(el('option', { value: String(r), text: App.rich.plain(App.loc(item.rights[r])) })));
                sel.value = String(val[i]);
                sel.addEventListener('change', () => { val[i] = parseInt(sel.value, 10); onChange([...val], { silent: true }); });
                let cls = 'match-row';
                if (reveal) cls += val[i] === i ? ' row-ok' : ' row-bad';
                const row = el('div', { class: cls }, el('span', { class: 'match-left' }, App.rich.inline(App.loc(left))), sel);
                if (reveal && val[i] !== i) row.appendChild(el('span', { class: 'match-correct', text: '→ ' + App.rich.plain(App.loc(item.rights[i])) }));
                wrap.appendChild(row);
            });
            return wrap;
        },
        renderReview(item, value) {
            const v = Array.isArray(value) ? value : [];
            const box = el('div', { class: 'review-options' });
            item.lefts.forEach((left, i) => {
                const ok = v[i] === i;
                const chosen = v[i] >= 0 && v[i] !== undefined ? App.rich.plain(App.loc(item.rights[v[i]])) : '—';
                box.appendChild(el('p', { class: 'review-option ' + (ok ? 'review-correct' : 'review-wrong') },
                    el('strong', {}, App.rich.inline(App.loc(left)), ' → '), ok ? chosen : chosen + '  (' + App.t('correctAnswer') + ': ' + App.rich.plain(App.loc(item.rights[i])) + ')'));
            });
            return box;
        },
        validateDef(def, path, rep) {
            if (!Array.isArray(def.pairs) || def.pairs.length < 2 || def.pairs.length > 8) { rep.error(path + '.pairs', 'must be a list of 2 to 8 {left, right} pairs'); return; }
            def.pairs.forEach((p, i) => {
                if (!p || !App.util.isLoc(p.left) || !App.util.isLoc(p.right)) rep.error(path + '.pairs[' + i + ']', 'needs non-empty "left" and "right"');
            });
        }
    });

    // ---- numeric -------------------------------------------------------------------------
    function numAnswer(def) {
        const a = isObj(def.answer) ? def.answer : { value: def.answer };
        return { value: Number(a.value), tolerance: Number(a.tolerance || 0), unit: a.unit || def.unit || '' };
    }
    function parseNum(s) {
        const n = parseFloat(String(s).trim().replace(/\s/g, '').replace(',', '.'));
        return isNaN(n) ? null : n;
    }
    App.registerType('numeric', {
        prepare(def, ctx) { const item = baseItem(def, ctx); item.numeric = numAnswer(def); return item; },
        hasAnswer: (it, v) => typeof v === 'string' && v.trim().length > 0,
        isCorrect(it, v) {
            const n = parseNum(v === undefined ? '' : v);
            return n !== null && Math.abs(n - it.numeric.value) <= it.numeric.tolerance + 1e-12;
        },
        render(ctx) {
            const { item, value, onChange, locked, reveal } = ctx;
            const input = el('input', { type: 'text', class: 'numeric-input', inputMode: 'decimal', autocomplete: 'off', value: value || '', disabled: !!locked, aria: { label: App.t('hintNumeric') } });
            input.addEventListener('input', () => onChange(input.value, { silent: true }));
            const wrap = el('div', { class: 'numeric' }, el('p', { class: 'type-hint', text: App.t('hintNumeric') }),
                el('div', { class: 'numeric-row' }, input, item.numeric.unit ? el('span', { class: 'numeric-unit', text: item.numeric.unit }) : null));
            if (reveal) {
                const ok = App.types.numeric.isCorrect(item, value);
                input.classList.add(ok ? 'row-ok' : 'row-bad');
                wrap.appendChild(el('p', { class: 'review-option review-correct', text: App.t('correctAnswer') + ': ' + item.numeric.value + (item.numeric.tolerance ? ' (±' + item.numeric.tolerance + ')' : '') + (item.numeric.unit ? ' ' + item.numeric.unit : '') }));
            }
            return wrap;
        },
        renderReview(item, value) {
            const ok = App.types.numeric.isCorrect(item, value);
            return el('div', { class: 'review-options' },
                el('p', { class: 'review-option ' + (ok ? 'review-correct' : 'review-wrong'), text: App.t('yourAnswer') + ': ' + (value || '—') }),
                el('p', { class: 'review-option review-correct', text: App.t('correctAnswer') + ': ' + item.numeric.value + (item.numeric.tolerance ? ' (±' + item.numeric.tolerance + ')' : '') + (item.numeric.unit ? ' ' + item.numeric.unit : '') }));
        },
        validateDef(def, path, rep) {
            const a = numAnswer(def);
            if (!isFinite(a.value)) rep.error(path + '.answer', 'must be a number or {value, tolerance, unit}');
            if (!isFinite(a.tolerance) || a.tolerance < 0) rep.error(path + '.answer.tolerance', 'must be a non-negative number');
        }
    });

    // ---- scenario (one context, several sub-questions; correct only if all parts are) ----
    App.registerType('scenario', {
        prepare(def, ctx) {
            const item = baseItem(def, ctx);
            item.context = def.context;
            item.parts = def.parts.map(p => prepareAny(Object.assign({ topic: def.topic, uid: (def.uid !== undefined ? def.uid : def.id) + '#p' }, p), ctx));
            return item;
        },
        hasAnswer: (it, v) => Array.isArray(v) && it.parts.some((p, i) => App.types[p.kind].hasAnswer(p, v[i])),
        isCorrect: (it, v) => Array.isArray(v) && it.parts.every((p, i) => App.types[p.kind].isCorrect(p, v[i])),
        fraction(it, v, cfg) {
            if (!Array.isArray(v)) return 0;
            if (it.parts.every((p, i) => App.types[p.kind].isCorrect(p, v[i]))) return 1;
            if (!cfg || !cfg.partialCredit) return 0;
            const sum = it.parts.reduce((a, p, i) => a + App.fractionOf(p, v[i], cfg), 0);
            return sum / it.parts.length;
        },
        render(ctx) {
            const { item, onChange, locked, reveal, uid } = ctx;
            const val = Array.isArray(ctx.value) ? [...ctx.value] : item.parts.map(() => undefined);
            const wrap = el('div', { class: 'scenario' });
            if (item.context) wrap.appendChild(el('div', { class: 'scenario-context' }, App.rich.node(App.loc(item.context))));
            item.parts.forEach((part, i) => {
                const h = App.types[part.kind];
                const box = el('div', { class: 'scenario-part' },
                    el('h4', { class: 'scenario-part-title' }, App.t('sub', { n: i + 1 }) + ' — ', App.rich.inline(App.loc(part.text))),
                    h.render({
                        item: part, value: val[i], locked, reveal, uid: uid + '-p' + i,
                        onChange: (v, o) => { val[i] = v; onChange([...val], { silent: true }); }
                    }));
                if (reveal && part.explanation) box.appendChild(el('div', { class: 'part-expl' }, App.rich.node(App.loc(part.explanation))));
                wrap.appendChild(box);
            });
            return wrap;
        },
        renderReview(item, value) {
            const v = Array.isArray(value) ? value : [];
            const wrap = el('div', { class: 'scenario' });
            if (item.context) wrap.appendChild(el('div', { class: 'scenario-context' }, App.rich.node(App.loc(item.context))));
            item.parts.forEach((part, i) => {
                wrap.appendChild(el('h4', { class: 'scenario-part-title' }, App.t('sub', { n: i + 1 }) + ' — ', App.rich.inline(App.loc(part.text))));
                wrap.appendChild(App.types[part.kind].renderReview(part, v[i]));
            });
            return wrap;
        },
        validateDef(def, path, rep) {
            if (!Array.isArray(def.parts) || def.parts.length < 2) { rep.error(path + '.parts', 'a scenario needs at least 2 parts'); return; }
            if (def.context !== undefined && !App.util.isLoc(def.context)) rep.error(path + '.context', 'must be a non-empty string or {en,it} object');
            def.parts.forEach((p, i) => {
                const t = App.questionType(p);
                const pp = path + '.parts[' + i + ']';
                if (t === 'scenario') { rep.error(pp, 'scenarios cannot be nested'); return; }
                if (!App.types[t]) { rep.error(pp + '.type', 'unknown question type "' + t + '"'); return; }
                if (!App.util.isLoc(textOf(p))) rep.error(pp + '.text', 'is required');
                if (App.types[t].validateDef) App.types[t].validateDef(p, pp, rep);
            });
        }
    });
})();

/* Exam format v2: validation, legacy conversion, normalization, quality lint. */
(function () {
    const { isObj, isLoc } = App.util;
    const RESERVED_MODES = ['all', 'review', 'mistakes', 'flagged', 'unseen', 'topic', 'difficulty'];
    const SELECTIONS = ['random', 'balanced', 'weighted'];
    const textOf = d => d.text !== undefined ? d.text : d.question;

    function newReport() {
        const r = { errors: [], warnings: [] };
        r.error = (path, message) => r.errors.push({ path, message });
        r.warn = (path, message) => r.warnings.push({ path, message });
        r.ok = () => r.errors.length === 0;
        r.format = () => r.errors.map(e => '  ✗ ' + e.path + ': ' + e.message).concat(r.warnings.map(w => '  ! ' + w.path + ': ' + w.message)).join('\n');

    }

    function stripLetter(s) { return String(s).replace(/^\s*[A-Fa-f][)\.]\s+/, ''); }

    // Legacy shape: { config: {...}, questions: [{id, topic, question, options:["A) ..."], answer:[i], explanation}] }
    function fromLegacy(data, fileId) {
        const c = data.config || {};
        const modes = [];
        const n = (data.questions || []).length;
        if (c.mockStandardCount) modes.push({ id: 'standard', name: { en: 'Standard mock exam', it: 'Simulazione standard' }, selection: 'balanced', count: Math.min(c.mockStandardCount, n) });
        if (c.mockOfficialCount) {
            modes.push({
                id: 'official', name: { en: 'Official exam simulation', it: 'Simulazione esame ufficiale' }, selection: 'weighted', exam: true,
                count: Math.min(c.mockOfficialCount, n), timeSec: c.mockOfficialTimeSec, passThreshold: c.passThresholdMockOfficial,
                groups: (c.macroGroups || []).map(g => ({ topics: g.topics, weight: g.weight }))
            });
        }
        return {
            format: 2, id: fileId || String(c.examCode || 'exam').toLowerCase(), code: c.examCode,
            title: c.examTitle || c.examCode, description: c.subtitle, version: c.version,
            settings: { passThreshold: c.passThresholdDefault, timePerQuestionSec: c.timePerQuestionSec },
            modes,
            questions: (data.questions || []).map(q => {
                const out = { id: q.id, topic: q.topic, text: q.question, options: (q.options || []).map(stripLetter), answer: q.answer, explanation: q.explanation };
                if (q.shuffle === false) out.shuffle = false;
                const a = Array.isArray(q.answer) ? q.answer : [q.answer];
                out.type = a.length > 1 ? 'multiple' : 'single';
                return out;

    // Warns about images that will not be shown (unsafe source) or that make the file very large.
    function eachString(v, fn, path) {
        if (typeof v === 'string') fn(v, path);
        else if (Array.isArray(v)) v.forEach((x, i) => eachString(x, fn, path + '[' + i + ']'));
        else if (isObj(v)) Object.keys(v).forEach(k => eachString(v[k], fn, path + '.' + k));
    }
    function richCheck(q, label, rep) {
        const fields = { text: q.text !== undefined ? q.text : q.question, options: q.options, explanation: q.explanation, context: q.context, items: q.items, pairs: q.pairs, parts: q.parts };
        eachString(fields, (str, path) => {
            const re = /!\[[^\]\n]*\]\(([^)\s]+)/g;
            let m;
            while ((m = re.exec(str))) {
                if (!App.rich.SAFE_IMG.test(m[1])) rep.warn(label + '.' + path, 'image source is not allowed and will not be shown (use data:image/…;base64, https:// or a relative .png/.jpg/.webp/.gif/.svg path)');
                else if (m[1].length > 400000) rep.warn(label + '.' + path, 'embedded image is very large (' + Math.round(m[1].length / 1024) + ' KB) — consider shrinking it');

                    if (m.timeSec !== undefined && !(m.timeSec >= 0)) rep.error(p + '.timeSec', 'must be >= 0');

                    checkScoring(m.scoring, p + '.scoring', rep);

    }

        Object.keys(exam.settings).forEach(k => { if (exam.settings[k] === undefined) delete exam.settings[k]; });

        });
        exam.retiredQuestions = exam.questions.filter(q => q.retired);
        exam.questions = exam.questions.filter(q => !q.retired);
        exam.topicList = [];
        exam.questions.forEach(q => { if (!exam.topicList.includes(q.topic)) exam.topicList.push(q.topic); });
        exam.hasDifficulty = exam.questions.some(q => q.difficulty);
        if (!Array.isArray(exam.modes) || !exam.modes.length) {
            exam.modes = [{ id: 'standard', name: { en: 'Standard mock exam', it: 'Simulazione standard' }, selection: 'balanced', count: Math.min(20, exam.questions.length) }];
        }
        exam.modes.forEach(m => { m.selection = m.selection || 'random'; });
        return exam;
    }

    // Accepts v2 or legacy data. Returns {exam, report}; exam is null when invalid.
    function prepare(data, fileId) {
        let raw = data;
        if (isObj(data) && data.format === undefined && (data.config || data.questions)) raw = fromLegacy(data, fileId);
        if (isObj(raw) && raw.id === undefined && fileId) raw = Object.assign({}, raw, { id: fileId });
        const report = validate(raw);
        return { exam: report.ok() ? normalize(raw, fileId) : null, report };
    }

    // Content-quality hints for single-answer questions (used by the validator CLI).
    function lint(exam) {
        const out = [];
        const singles = exam.questions.filter(q => App.questionType(q) === 'single' && Array.isArray(q.options));
        if (singles.length >= 10) {
            const pos = [0, 0, 0, 0, 0, 0];
            let longest = 0;
            singles.forEach(q => {
                const a = Array.isArray(q.answer) ? q.answer[0] : q.answer;
                pos[a]++;
                const lens = q.options.map(o => App.loc(o).length);
                if (lens[a] === Math.max(...lens) && lens.filter(l => l === lens[a]).length === 1) longest++;
            });
            const n = singles.length;
            const worst = Math.max(...pos);
            if (worst / n > 0.4) out.push('correct answer is always in position ' + 'ABCDEF'[pos.indexOf(worst)] + ' (' + Math.round(100 * worst / n) + '%) — fine if options are shuffled at runtime');
            if (longest / n > 0.45) out.push('the correct answer is the single longest option in ' + Math.round(100 * longest / n) + '% of single-answer questions');
        }
        return out;
    }

    App.schema = { validate, fromLegacy, normalize, prepare, lint, newReport };
})();

/* Scoring rules: partial credit, negative marking, mandatory questions.
   Rules can be set per exam (settings.scoring), per mode (modes[].scoring) and, for practice modes, in the options page. */
App.scoring = (function () {
    const DEFAULTS = { partialCredit: false, wrongPenalty: 0, unansweredPenalty: 0 };

    function clean(c) {
        const out = {};
        if (!c) return out;
        if (typeof c.partialCredit === 'boolean') out.partialCredit = c.partialCredit;
        if (typeof c.wrongPenalty === 'number' && c.wrongPenalty >= 0) out.wrongPenalty = c.wrongPenalty;
        if (typeof c.unansweredPenalty === 'number' && c.unansweredPenalty >= 0) out.unansweredPenalty = c.unansweredPenalty;
        return out;
    }

    // Effective rules: built-in defaults < user preference (practice modes only) < exam settings < mode.
    function resolve(exam, modeDef, userPref) {
        const examLevel = clean(exam && exam.settings && exam.settings.scoring);
        const modeLevel = clean(modeDef && modeDef.scoring);
        const explicit = Object.keys(examLevel).length || Object.keys(modeLevel).length;
        const useUser = !(modeDef && modeDef.exam) && !explicit;      // exam-defined exam modes keep the exam's own rules
        return Object.assign({}, DEFAULTS, useUser ? clean(userPref) : {}, examLevel, modeLevel);
    }

    // Scores a list of {item, value} pairs.
    function score(items, values, cfg) {
        cfg = Object.assign({}, DEFAULTS, cfg || {});
        let got = 0, max = 0, fully = 0, partial = 0, wrong = 0, unanswered = 0;
        const mandatoryFailed = [];
        const details = items.map((item, i) => {
            const pts = typeof item.points === 'number' && item.points > 0 ? item.points : 1;
            max += pts;
            const answered = App.types[item.kind].hasAnswer(item, values[i]);
            const frac = answered ? App.fractionOf(item, values[i], cfg) : 0;
            let delta = pts * frac;
            if (!answered) { unanswered++; delta -= cfg.unansweredPenalty * pts; }
            else if (frac >= 1) fully++;
            else if (frac > 0) partial++;
            else { wrong++; delta -= cfg.wrongPenalty * pts; }
            got += delta;
            if (item.mandatory && frac < 1) mandatoryFailed.push(i);
            return { frac, points: pts, delta, answered };
        });
        const total = Math.max(0, got);
        return {
            score: Math.round(total * 100) / 100, max, pct: max ? Math.round(100 * total / max) : 0,
            fully, partial, wrong, unanswered, mandatoryFailed, details, cfg,
            custom: cfg.partialCredit || cfg.wrongPenalty > 0 || cfg.unansweredPenalty > 0 || items.some(it => typeof it.points === 'number' && it.points !== 1)
        };
    }

    return { DEFAULTS, clean, resolve, score };
})();

/* Exam-taking rules: how many pauses are allowed and whether the clock keeps running while you are away.
   Free navigation between questions is never restricted. */
App.examRules = {
    resolve(exam, modeDef, userPref) {
        const isExam = !!(modeDef && modeDef.exam);
        if (!isExam) return { pauses: null, strictTime: false };
        const pick = (k, dflt) => modeDef[k] !== undefined ? modeDef[k] : (exam.settings && exam.settings[k] !== undefined ? exam.settings[k] : (userPref && userPref[k] !== undefined ? userPref[k] : dflt));
        const pauses = pick('pauses', null);
        return { pauses: (pauses === null || pauses === undefined || pauses === '') ? null : Number(pauses), strictTime: !!pick('strictTime', false) };
    }
};

/* Versioned local storage: preferences, in-progress sessions, attempt history, per-question stats.
   Everything lives under one key ("examsim:v2") so it can be exported/imported as a single file. */
App.memoryBackend = function () {
    const m = {};
    return { getItem: k => (k in m ? m[k] : null), setItem: (k, v) => { m[k] = String(v); }, removeItem: k => { delete m[k]; } };
};

App.defaultBackend = function () {
    try {
        const ls = window.localStorage;
        const k = '__examsim_probe__';
        ls.setItem(k, '1'); ls.removeItem(k);
        return ls;
    } catch (e) { return App.memoryBackend(); }
};

App.createStorage = function (backend, opts) {
    opts = opts || {};
    const KEY = opts.key || 'examsim:v2';
    const MAX_ATTEMPTS = 500, MAX_SESSIONS = 10;
    let db = null;

    const empty = () => ({ v: 2, prefs: {}, exams: {} });

    function migrate(data) {
        if (!data || typeof data !== 'object') return empty();
        // Future versions: add `if (data.v < 3) {...}` steps here.
        if (!data.prefs) data.prefs = {};
        if (!data.exams) data.exams = {};
        data.v = 2;
        return data;
    }

    function load() {
        let raw = null;
        try { raw = backend.getItem(KEY); } catch (e) { raw = null; }
        try { db = migrate(raw ? JSON.parse(raw) : null); } catch (e) { db = empty(); }
        return db;
    }
    function ensure() { return db || load(); }

    function save() {
        try { backend.setItem(KEY, JSON.stringify(ensure())); return true; }
        catch (e) { App.events.emit('storageError', e); return false; }
    }

    function bucket(examId) {
        const d = ensure();
        if (!d.exams[examId]) d.exams[examId] = { attempts: [], sessions: {}, qstats: {} };
        return d.exams[examId];
    }

    const api = {
        key: KEY,
        reload: load,
        raw: () => ensure(),

        // ---- preferences (falls back to the keys used by earlier versions) ----
        getPref(k) {
            const v = ensure().prefs[k];
            if (v !== undefined) return v;
            try { const old = backend.getItem('exam_' + k); return old === null ? undefined : old; } catch (e) { return undefined; }
        },
        setPref(k, v) { ensure().prefs[k] = v; const r = save(); if (backend && backend.flush) backend.flush(); return r; },

        // ---- sessions in progress ----
        saveSession(examId, session) {
            const b = bucket(examId);
            session.updatedAt = Date.now();
            b.sessions[session.id] = session;
            const ids = Object.keys(b.sessions).sort((x, y) => b.sessions[y].updatedAt - b.sessions[x].updatedAt);
            ids.slice(MAX_SESSIONS).forEach(id => delete b.sessions[id]);
            return save();
        },
        getSession(examId, id) { return bucket(examId).sessions[id] || null; },
        listSessions(examId) {
            const s = bucket(examId).sessions;
            return Object.keys(s).map(k => s[k]).sort((a, b) => b.updatedAt - a.updatedAt);
        },
        deleteSession(examId, id) { delete bucket(examId).sessions[id]; return save(); },

        // ---- attempts ----
        addAttempt(examId, attempt) {
            const b = bucket(examId);
            b.attempts.push(attempt);
            if (b.attempts.length > MAX_ATTEMPTS) b.attempts.splice(0, b.attempts.length - MAX_ATTEMPTS);
            return save();
        },
        listAttempts(examId) { return bucket(examId).attempts.slice(); },

        // ---- per-question stats / flags / notes ----
        getQStat(examId, uid) { return bucket(examId).qstats[uid] || null; },
        allQStats(examId) { return bucket(examId).qstats; },
        patchQStat(examId, uid, fn) {
            const b = bucket(examId);
            const cur = b.qstats[uid] || { seen: 0, correct: 0, wrong: 0, box: 0, due: 0, last: 0, lastOk: null, time: 0, flag: false, note: '' };
            const next = fn(cur) || cur;
            b.qstats[uid] = next;
            return save();
        },

        // ---- wrong-question reports and small per-exam metadata (seen version…) ----
        addReport(examId, report) {
            const b = bucket(examId);
            b.reports = b.reports || [];
            b.reports.push(Object.assign({ id: App.util.uid(), ts: Date.now() }, report));
            return save();
        },
        listReports(examId) { return (bucket(examId).reports || []).slice(); },
        removeReport(examId, id) { const b = bucket(examId); b.reports = (b.reports || []).filter(r => r.id !== id); return save(); },
        getMeta(examId, k) { return (bucket(examId).meta || {})[k]; },
        setMeta(examId, k, v) { const b = bucket(examId); b.meta = b.meta || {}; b.meta[k] = v; return save(); },

        // ---- maintenance ----
        clearExam(examId) { delete ensure().exams[examId]; return save(); },
        examIds() { return Object.keys(ensure().exams); },

        exportData(examIds) {
            const d = ensure();
            const out = { app: 'examsim', v: 2, exportedAt: new Date().toISOString(), prefs: d.prefs, exams: {} };
            (examIds || Object.keys(d.exams)).forEach(id => { if (d.exams[id]) out.exams[id] = d.exams[id]; });
            return out;
        },

        // Merges an exported file into the current data. Returns {attempts, qstats} counts or throws.
        importData(obj) {
            if (!obj || obj.app !== 'examsim' || typeof obj.exams !== 'object') throw new Error('not an ExamSim export file');
            if (obj.v > 2) throw new Error('export was made by a newer version (v' + obj.v + ')');
            let attempts = 0, qstats = 0;
            Object.keys(obj.exams).forEach(id => {
                const src = obj.exams[id] || {};
                const b = bucket(id);
                const known = new Set(b.attempts.map(a => a.id));
                (src.attempts || []).forEach(a => { if (a && a.id && !known.has(a.id)) { b.attempts.push(a); attempts++; } });
                b.attempts.sort((x, y) => x.ts - y.ts);
                Object.keys(src.qstats || {}).forEach(uid => {
                    const inc = src.qstats[uid], cur = b.qstats[uid];
                    if (!cur || (inc.last || 0) > (cur.last || 0)) {
                        // keep user-authored data if the winner lacks it
                        const merged = Object.assign({}, inc);
                        if (cur) { merged.note = inc.note || cur.note || ''; merged.flag = inc.flag || cur.flag || false; }
                        b.qstats[uid] = merged; qstats++;
                    } else if (inc.note && !cur.note) { cur.note = inc.note; }
                });
                Object.keys(src.sessions || {}).forEach(sid => { if (!b.sessions[sid]) b.sessions[sid] = src.sessions[sid]; });
                if (Array.isArray(src.reports)) {
                    b.reports = b.reports || [];
                    const have = new Set(b.reports.map(r => r.id));
                    src.reports.forEach(r => { if (r && r.id && !have.has(r.id)) b.reports.push(r); });
                }
                if (src.meta && typeof src.meta === 'object') { b.meta = b.meta || {}; Object.keys(src.meta).forEach(k => { if (b.meta[k] === undefined) b.meta[k] = src.meta[k]; }); }
            });
            save();
            return { attempts, qstats };
        }
    };
    return api;
};

App.storage = App.createStorage(App.defaultBackend());
App.storageKind = 'memory';

/* IndexedDB storage backend: far larger quota than localStorage.
   The whole key/value set is loaded into memory at start-up, so the storage API stays synchronous;
   writes are sent to IndexedDB in the background right after each change (and again when the page is hidden). */
App.createIdbBackend = function (dbName) {
    dbName = dbName || 'examsim';
    const mem = new Map();
    const dirty = new Map();           // key -> string | null (null = delete)
    let db = null, timer = null, flushing = Promise.resolve();

    function open() {
        return new Promise((resolve, reject) => {
            if (typeof indexedDB === 'undefined') { reject(new Error('IndexedDB is not available')); return; }
            const req = indexedDB.open(dbName, 1);
            req.onupgradeneeded = () => { req.result.createObjectStore('kv'); };
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error || new Error('IndexedDB error'));
            req.onblocked = () => reject(new Error('IndexedDB blocked'));
        });
    }
    function tx(mode) { return db.transaction('kv', mode).objectStore('kv'); }

    function loadAll() {
        return new Promise((resolve, reject) => {
            const out = [];
            const req = tx('readonly').openCursor();
            req.onsuccess = () => { const c = req.result; if (c) { out.push([c.key, c.value]); c.continue(); } else resolve(out); };
            req.onerror = () => reject(req.error);
        });
    }

    function flush() {
        clearTimeout(timer); timer = null;
        if (!db || !dirty.size) return flushing;
        const batch = Array.from(dirty.entries());
        dirty.clear();
        flushing = flushing.then(() => new Promise(resolve => {
            try {
                const t = db.transaction('kv', 'readwrite');
                const st = t.objectStore('kv');
                batch.forEach(([k, v]) => { if (v === null) st.delete(k); else st.put(v, k); });
                t.oncomplete = () => resolve();
                t.onerror = t.onabort = () => { batch.forEach(([k, v]) => { if (!dirty.has(k)) dirty.set(k, v); }); App.events.emit('storageError', t.error); resolve(); };
            } catch (e) { App.events.emit('storageError', e); resolve(); }
        }));
        return flushing;
    }
    // writes are coalesced within the same tick and sent to IndexedDB immediately (no delay that a closing tab could cut)
    let queued = false;
    const schedule = () => { if (queued) return; queued = true; Promise.resolve().then(() => { queued = false; flush(); }); };

    const backend = {
        kind: 'indexeddb',
        getItem: k => (mem.has(k) ? mem.get(k) : null),
        setItem(k, v) { mem.set(k, String(v)); dirty.set(k, String(v)); schedule(); },
        removeItem(k) { mem.delete(k); dirty.set(k, null); schedule(); },
        keys: () => Array.from(mem.keys()),
        flush,
        // Opens the database, loads everything and imports data left in localStorage by earlier versions (once).
        async init() {
            db = await open();
            (await loadAll()).forEach(([k, v]) => mem.set(k, v));
            if (!mem.has('__migrated')) {
                try {
                    const ls = window.localStorage;
                    for (let i = 0; i < ls.length; i++) {
                        const k = ls.key(i);
                        if (/^(examsim:|exam_)/.test(k) && !mem.has(k)) { mem.set(k, ls.getItem(k)); dirty.set(k, ls.getItem(k)); }
                    }
                } catch (e) { /* localStorage unavailable: nothing to migrate */ }
                mem.set('__migrated', '1'); dirty.set('__migrated', '1');
                await flush();
            }
            const hide = () => { flush(); };
            document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') hide(); });
            window.addEventListener('pagehide', hide);
            return backend;
        },
        // Removes every stored key (used by "delete all data")
        async clear() {
            mem.clear(); dirty.clear(); clearTimeout(timer); timer = null;
            await flushing;
            await new Promise(resolve => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').clear(); t.oncomplete = t.onerror = t.onabort = () => resolve(); });
            mem.set('__migrated', '1'); dirty.set('__migrated', '1');
            await flush();
        }
    };
    return backend;
};

/* Chooses the best available backend: IndexedDB, then localStorage, then memory. */
App.initStorage = async function () {
    let backend = null;
    try {
        backend = await Promise.race([App.createIdbBackend().init(), new Promise((_, rej) => setTimeout(() => rej(new Error('IndexedDB timeout')), 4000))]);
        App.storageKind = 'indexeddb';
    } catch (e) {
        backend = App.defaultBackend();
        App.storageKind = backend === (typeof window !== 'undefined' && window.localStorage) ? 'localStorage' : 'memory';
    }
    App.backend = backend;
    App.profiles.use(App.profiles.current());
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* optional */ }
    return backend;
};

App.storageUsage = async function () {
    try { if (navigator.storage && navigator.storage.estimate) { const e = await navigator.storage.estimate(); return { used: e.usage || 0, quota: e.quota || 0 }; } } catch (e) { /* ignore */ }
    return null;
};

// Wipes everything (all profiles). Used by "delete all data" and by tests.
App.wipeAll = async function () {
    if (App.backend && App.backend.clear) await App.backend.clear();
    else if (App.backend) { ['examsim:profiles'].concat(App.profiles.list().map(p => App.profiles.keyOf(p.id))).forEach(k => App.backend.removeItem(k)); }
    try { Object.keys(localStorage).filter(k => /^(examsim:|exam_)/.test(k)).forEach(k => localStorage.removeItem(k)); } catch (e) { /* ignore */ }
    App.profiles.reset();
};

/* Profiles: several people (or goals) on one device, each with separate progress.
   "default" keeps the original storage key so existing data is untouched. */
App.profiles = (function () {
    const META = 'examsim:profiles';
    const backend = () => App.backend || App.defaultBackend();

    function read() {
        let m = null;
        try { m = JSON.parse(backend().getItem(META)); } catch (e) { m = null; }
        if (!m || !Array.isArray(m.list) || !m.list.length) m = { v: 1, current: 'default', list: [{ id: 'default', name: 'Default', created: Date.now() }] };
        if (!m.list.some(p => p.id === m.current)) m.current = m.list[0].id;
        return m;
    }
    function write(m) { try { backend().setItem(META, JSON.stringify(m)); if (backend().flush) backend().flush(); } catch (e) { App.events.emit('storageError', e); } }

    const keyOf = id => id === 'default' ? 'examsim:v2' : 'examsim:v2:p:' + id;

    const api = {
        keyOf,
        list: () => read().list,
        current: () => read().current,
        currentProfile: () => { const m = read(); return m.list.find(p => p.id === m.current); },
        // Points App.storage at a profile's data.
        use(id) {
            const m = read();
            if (!m.list.some(p => p.id === id)) id = m.current;
            m.current = id; write(m);
            App.storage = App.createStorage(backend(), { key: keyOf(id) });
            App.events.emit('profileChange', { id });
            return App.storage;
        },
        create(name) {
            const m = read();
            name = String(name || '').trim().slice(0, 40) || ('Profile ' + (m.list.length + 1));
            const id = 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
            m.list.push({ id, name, created: Date.now() });
            write(m);
            return id;
        },
        rename(id, name) {
            const m = read(); const p = m.list.find(x => x.id === id);
            if (p) { p.name = String(name || '').trim().slice(0, 40) || p.name; write(m); }
        },
        remove(id) {
            const m = read();
            if (m.list.length <= 1) return false;
            m.list = m.list.filter(p => p.id !== id);
            try { backend().removeItem(keyOf(id)); } catch (e) { /* ignore */ }
            if (m.current === id) m.current = m.list[0].id;
            write(m);
            if (App.storage.key === keyOf(id)) App.profiles.use(m.current);
            return true;
        },
        reset() { try { backend().removeItem(META); } catch (e) { /* ignore */ } App.profiles.use('default'); }
    };
    return api;
})();

/* Backup and sync: snapshots, transfer codes, backup reminder, auto-backup file, private GitHub Gist sync.
   Everything here is opt-in; nothing leaves the device unless the user starts it. */
App.backup = (function () {
    const GIST_FILE = 'examsim-backup.json';
    const GIST_KEY = 'examsim:gist';
    const PORTABLE_PREFS = ['scoring', 'examRules', 'backupRemindDays'];
    const rawBackend = () => App.backend || App.defaultBackend();

    // ---- snapshot of the current profile (+ optionally the local exam library) ----
    function snapshot(opts) {
        opts = opts || {};
        const data = App.storage.exportData(opts.examIds);
        const prefs = {};
        PORTABLE_PREFS.forEach(k => { if (data.prefs && data.prefs[k] !== undefined) prefs[k] = data.prefs[k]; });
        data.prefs = prefs;
        if (opts.library && App.library) data.library = App.library.exportAll();
        if (opts.sessions === false) Object.keys(data.exams).forEach(id => { data.exams[id] = Object.assign({}, data.exams[id], { sessions: {} }); });
        return data;
    }

    // Merges a snapshot into the current profile. Returns counts.
    function apply(obj) {
        const r = App.storage.importData(obj);
        r.library = 0;
        if (obj.library && App.library) r.library = App.library.importAll(obj.library);
        const prefs = obj.prefs || {};
        PORTABLE_PREFS.forEach(k => { if (prefs[k] !== undefined && App.storage.getPref(k) === undefined) App.storage.setPref(k, prefs[k]); });
        return r;
    }

    // ---- transfer code: gzip + base64url, safe to paste into a chat or a note ----
    function toB64(bytes) {
        let s = '';
        for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
        return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }
    function fromB64(str) {
        const s = atob(str.replace(/-/g, '+').replace(/_/g, '/'));
        const out = new Uint8Array(s.length);
        for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
        return out;
    }
    async function pipe(bytes, stream) {
        const body = new Blob([bytes]).stream().pipeThrough(stream);
        return new Uint8Array(await new Response(body).arrayBuffer());
    }
    const canGzip = () => typeof CompressionStream !== 'undefined' && typeof DecompressionStream !== 'undefined';

    async function encode(obj) {
        const bytes = new TextEncoder().encode(JSON.stringify(obj));
        if (canGzip()) return 'ES1.' + toB64(await pipe(bytes, new CompressionStream('gzip')));
        return 'ES0.' + toB64(bytes);
    }
    async function decode(code) {
        const m = String(code || '').trim().replace(/\s+/g, '').match(/^(ES[01])\.([\w\-]+)$/);
        if (!m) throw new Error('not an ExamSim transfer code');
        let bytes = fromB64(m[2]);
        if (m[1] === 'ES1') {
            if (!canGzip()) throw new Error('this browser cannot read compressed codes');
            try { bytes = await pipe(bytes, new DecompressionStream('gzip')); } catch (e) { throw new Error('the code is damaged or incomplete'); }
        }
        let obj;
        try { obj = JSON.parse(new TextDecoder().decode(bytes)); } catch (e) { throw new Error('the code is damaged or incomplete'); }
        return obj;
    }

    // ---- backup reminder ----
    function markBackup(now) { App.storage.setPref('lastBackup', now || Date.now()); }
    function lastBackup() { return Number(App.storage.getPref('lastBackup')) || 0; }
    function remindDays() { const d = App.storage.getPref('backupRemindDays'); return d === undefined || d === '' ? 14 : Number(d); }
    // True when there is progress worth protecting and no backup was made for `remindDays` days.
    function due(now) {
        now = now || Date.now();
        const days = remindDays();
        if (!(days > 0)) return false;
        if ((Number(App.storage.getPref('backupSnooze')) || 0) > now) return false;
        let oldest = Infinity, any = false;
        App.storage.examIds().forEach(id => App.storage.listAttempts(id).forEach(a => { any = true; oldest = Math.min(oldest, a.ts); }));
        if (!any) return false;
        const base = lastBackup() || oldest;
        return now - base > days * 86400000;
    }
    function snooze(days, now) { App.storage.setPref('backupSnooze', (now || Date.now()) + (days || 3) * 86400000); }

    // ---- GitHub Gist sync (private gist, token stays on this device, never exported) ----
    function gistConfig() { try { return JSON.parse(rawBackend().getItem(GIST_KEY)) || {}; } catch (e) { return {}; } }
    function setGistConfig(c) { rawBackend().setItem(GIST_KEY, JSON.stringify(c || {})); if (rawBackend().flush) rawBackend().flush(); }
    async function gistFetch(method, path, token, body) {
        let resp;
        try {
            resp = await fetch('https://api.github.com' + path, {
                method, headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
                body: body ? JSON.stringify(body) : undefined
            });
        } catch (e) { throw new Error('network error'); }
        if (resp.status === 401) throw new Error('GitHub refused the token (401)');
        if (resp.status === 404) throw new Error('gist not found (404) — check the id and that the token has the "gist" permission');
        if (!resp.ok) throw new Error('GitHub answered ' + resp.status);
        return resp.json();
    }
    async function gistPull(cfg) {
        const g = await gistFetch('GET', '/gists/' + encodeURIComponent(cfg.id), cfg.token);
        const f = g.files && g.files[GIST_FILE];
        if (!f) throw new Error('the gist has no ' + GIST_FILE);
        let content = f.content;
        if (f.truncated && f.raw_url) { const r = await fetch(f.raw_url); content = await r.text(); }
        try { return JSON.parse(content); } catch (e) { throw new Error('the gist content is not valid JSON'); }
    }
    async function gistPush(cfg, data) {
        const files = {}; files[GIST_FILE] = { content: JSON.stringify(data) };
        if (cfg.id) { await gistFetch('PATCH', '/gists/' + encodeURIComponent(cfg.id), cfg.token, { files }); return cfg.id; }
        const g = await gistFetch('POST', '/gists', cfg.token, { description: 'ExamSim backup', public: false, files });
        return g.id;
    }
    // Pull (merge) then push. Returns {pulled, pushed, id}.
    async function syncGist(opts) {
        const cfg = Object.assign({}, gistConfig());
        if (!cfg.token) throw new Error('no GitHub token configured');
        let pulled = null;
        if (cfg.id) pulled = apply(await gistPull(cfg));
        cfg.id = await gistPush(cfg, snapshot({ library: !opts || opts.library !== false, sessions: false }));
        cfg.last = Date.now();
        setGistConfig(cfg);
        markBackup();
        return { pulled, id: cfg.id };
    }

    // ---- auto-backup to a file chosen by the user (File System Access API, Chromium browsers) ----
    const fsSupported = () => typeof window !== 'undefined' && typeof window.showSaveFilePicker === 'function';
    function fsDb() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open('examsim-fs', 1);
            req.onupgradeneeded = () => req.result.createObjectStore('h');
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });
    }
    async function fsGet() { try { const db = await fsDb(); return await new Promise(r => { const q = db.transaction('h').objectStore('h').get('file'); q.onsuccess = () => r(q.result || null); q.onerror = () => r(null); }); } catch (e) { return null; } }
    async function fsPut(h) { const db = await fsDb(); await new Promise((res, rej) => { const t = db.transaction('h', 'readwrite'); if (h) t.objectStore('h').put(h, 'file'); else t.objectStore('h').delete('file'); t.oncomplete = res; t.onerror = rej; }); }
    async function chooseAutoFile() {
        const h = await window.showSaveFilePicker({ suggestedName: 'examsim-backup.json', types: [{ description: 'ExamSim backup', accept: { 'application/json': ['.json'] } }] });
        await fsPut(h);
        await writeAuto();
        return h.name;
    }
    async function autoFileName() { const h = await fsGet(); return h ? h.name : null; }
    async function disableAutoFile() { await fsPut(null); }
    // Writes the backup if a file was chosen and permission is still granted. Never prompts.
    async function writeAuto() {
        if (!fsSupported()) return false;
        const h = await fsGet();
        if (!h) return false;
        try {
            if (h.queryPermission && (await h.queryPermission({ mode: 'readwrite' })) !== 'granted') return false;
            const w = await h.createWritable();
            await w.write(JSON.stringify(snapshot({ library: true, sessions: false })));
            await w.close();
            markBackup();
            return true;
        } catch (e) { return false; }
    }

    return { snapshot, apply, encode, decode, canGzip, markBackup, lastBackup, remindDays, due, snooze, gistConfig, setGistConfig, syncGist, gistPull, gistPush, fsSupported, chooseAutoFile, autoFileName, disableAutoFile, writeAuto, PORTABLE_PREFS };
})();

/* Local exam library: exams created with the wizard/editor or imported from a file live in the browser storage
   and appear next to the bundled exams. They are shared by all profiles. */
App.library = (function () {
    const INDEX = 'examsim:lib:index';
    const keyOf = id => 'examsim:lib:' + id;
    const be = () => App.backend || App.defaultBackend();
    const flush = () => { const b = be(); if (b && b.flush) b.flush(); };

    function readIndex() { try { const x = JSON.parse(be().getItem(INDEX)); return Array.isArray(x) ? x : []; } catch (e) { return []; } }
    function writeIndex(list) { be().setItem(INDEX, JSON.stringify(list)); }

    function summary(raw) {
        const topics = new Set((raw.questions || []).map(q => q.topic));
        return { id: raw.id, title: raw.title, description: raw.description, code: raw.code, version: raw.version,
            questionCount: (raw.questions || []).length, topicCount: topics.size, updated: Date.now() };
    }

    const api = {
        // Catalog entries in the same shape as the bundled catalog.
        list() { return readIndex().map(s => Object.assign({}, s, { file: 'local:' + s.id, local: true })); },
        has: id => readIndex().some(s => s.id === id),
        get(id) { try { return JSON.parse(be().getItem(keyOf(id))); } catch (e) { return null; } },
        // A free id: appends -2, -3… when taken by a bundled or local exam.
        freeId(wanted, takenByCatalog) {
            let base = String(wanted || 'my-exam').toLowerCase().replace(/[^\w.\-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'my-exam', id = base, n = 2;
            const taken = new Set((takenByCatalog || []).concat(readIndex().map(s => s.id)));
            while (taken.has(id)) id = base + '-' + (n++);
            return id;
        },
        // Validates and stores an exam (raw format-2 object). Returns {ok, report, id}.
        save(raw) {
            const prepared = App.schema.prepare(raw, raw && raw.id);
            if (!prepared.exam) return { ok: false, report: prepared.report };
            const clean = App.util.clone(raw);
            clean.format = App.FORMAT_VERSION;
            try { be().setItem(keyOf(clean.id), JSON.stringify(clean)); } catch (e) { App.events.emit('storageError', e); return { ok: false, report: prepared.report, error: e }; }
            const idx = readIndex().filter(s => s.id !== clean.id);
            idx.push(summary(clean));
            writeIndex(idx);
            flush();
            App.events.emit('libraryChange', { id: clean.id });
            return { ok: true, report: prepared.report, id: clean.id };
        },
        remove(id) {
            be().removeItem(keyOf(id));
            writeIndex(readIndex().filter(s => s.id !== id));
            flush();
            App.events.emit('libraryChange', { id });
        },
        exportAll() { const out = {}; readIndex().forEach(s => { const e = api.get(s.id); if (e) out[s.id] = e; }); return out; },
        // Adds exams from a snapshot without overwriting newer local copies. Returns how many were added/updated.
        importAll(map) {
            let n = 0;
            Object.keys(map || {}).forEach(id => {
                const inc = map[id];
                if (!inc || typeof inc !== 'object') return;
                const cur = api.get(id);
                const better = !cur || (String(inc.version || '') > String(cur.version || '')) || (inc.questions || []).length > (cur.questions || []).length;
                if (better && api.save(Object.assign({}, inc, { id })).ok) n++;
            });
            return n;
        },
        // Serializes a raw exam as a .exam file
        toFileText(raw) { return 'ExamSim.register(' + JSON.stringify(raw, null, 1) + ');\n'; }
    };
    return api;
})();

/* Conversions between exams and text formats: free-text/Markdown parser (import wizard), Markdown, CSV and Anki export.
   Pure functions, no DOM. Question types supported in text: single, multiple, truefalse, numeric.
   CSV also carries ordering and matching. Scenario questions are exported to JSON/Anki only. */
App.convert = (function () {
    const LETTERS = 'ABCDEFGH';
    const loc = (v, lang) => (v === undefined || v === null) ? '' : (typeof v === 'string' || typeof v === 'number') ? String(v) : (v[lang] || v.en || Object.values(v)[0] || '');
    const slug = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 30) || 'general';

    // ---------------------------------------------------------------- text parser
    const RE = {
        qWord: /^\s*(?:#{1,6}\s*)?(?:Question|Domanda|Quesito|Q\.?)\s*(\d{1,4})\s*(?:[.):\-]\s*|\s+|$)(.*)$/i,
        qNum: /^\s*(?:#{1,6}\s*)?(\d{1,4})\s*[.):]\s+(.*)$/,
        checkbox: /^\s*[-*+]\s*\[( |x|X)\]\s*(?:\(?([A-Ha-h])[.)]\s+)?(.+)$/,
        letter: /^\s*\(?([A-Ha-h])[.)]\s+(.+)$/,
        bullet: /^\s*[-*•]\s+(.+)$/,
        answer: /^\s*(?:\*\*)?(?:Correct\s+answers?|Right\s+answers?|Answers?|Ans|Rispost[ae](?:\s+corrett[ae]|\s+esatta)?|Soluzione|Correct|Corretta|Giusta)(?:\*\*)?\s*[:=\-]\s*(?:\*\*)?(.+?)\s*$/i,
        expl: /^\s*(?:\*\*)?(?:Explanation|Spiegazione|Rationale|Motivazione|Why|Commento)(?:\*\*)?\s*[:\-]\s*(?:\*\*)?(.*)$/i,
        header: /^\s*(?:(#{1,6})\s+(.+?)\s*#*|(?:Topic|Section|Sezione|Argomento|Domain|Dominio|Chapter|Capitolo)\s*[:\-]\s*(.+)|={3,}\s*(.+?)\s*=*|-{3,}\s*(.+?)\s*-{3,})\s*$/i,
        mark: /\s*(?:✓|✔|\(correct\)|\(corretta\)|\[correct\]|\[corretta\])\s*$/i
    };

    function parseAnswerValue(v, optCount) {
        let s = String(v).replace(/^\*+|\*+$/g, '').trim().replace(/[.;]$/, '');
        const word = optCount > 0 ? /^(true|vero)$/i : /^(true|vero|v|t)$/i, wordF = optCount > 0 ? /^(false|falso)$/i : /^(false|falso|f)$/i;
        if (word.test(s)) return { bool: true };
        if (wordF.test(s)) return { bool: false };
        const num = s.match(/^(-?\d+(?:[.,]\d+)?)\s*(?:(?:±|\+\/-)\s*(\d+(?:[.,]\d+)?))?\s*(.*)$/);
        const lets = s.match(/^([A-Ha-h](?:\s*(?:,|;|&|\/|\+|and|e|ed)\s*[A-Ha-h])*)\s*(?:[.):]|$)/);
        if (lets) return { letters: (lets[1].toUpperCase().match(/[A-H]/g) || []).map(c => LETTERS.indexOf(c)) };
        if (/^[A-Ha-h]{2,6}$/.test(s)) return { letters: s.toUpperCase().split('').map(c => LETTERS.indexOf(c)) };
        if (num) {
            const out = { number: Number(num[1].replace(',', '.')) };
            if (num[2]) out.tolerance = Number(num[2].replace(',', '.'));
            if (num[3] && num[3].trim()) out.unit = num[3].trim();
            return out;
        }
        return { text: s };
    }

    function parseText(input) {
        const lines = String(input || '').replace(/^﻿/, '').replace(/\r\n?/g, '\n').split('\n');
        const meta = {}, topics = {}, warnings = [], qs = [];
        let cur = null, field = null, topicKey = 'general', lastNum = 0;
        const addTopic = name => { const k = slug(name); topics[k] = name.trim(); return k; };

        function finish() {
            if (!cur) return;
            const q = cur; cur = null;
            q.text = q.text.trim(); if (q.explanation !== undefined) q.explanation = q.explanation.trim();
            const issues = [];
            const opts = q.options.map(o => o.trim());
