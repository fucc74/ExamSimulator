<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Exam Simulator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>

        :root {
            --primary: #01a982;
            --primary-hover: #018566;
            --primary-light: #e0f5ef;
            --dark: #111111;
            --dark-gray: #444444;
            --gray: #888888;
            --light-gray: #f4f6f8;
            --border: #e2e8f0;
            --white: #ffffff;
            --success: #10b981;
            --success-light: #d1fae5;
            --error: #ef4444;
            --error-light: #fee2e2;
            --warning: #f59e0b;
            --on-accent: #ffffff;
            --shadow: rgba(0,0,0,0.05);
            --reveal-ok-bg: #d1fae5; --reveal-ok-fg: #065f46;
            --reveal-bad-bg: #fee2e2; --reveal-bad-fg: #991b1b;
        }

        :root[data-theme="dark"] {
            --primary: #10c79a;
            --primary-hover: #0ea982;
            --primary-light: #0f3a30;
            --dark: #e8edf2;
            --dark-gray: #c3ccd6;
            --gray: #94a3b8;
            --light-gray: #0e1216;
            --border: #2b333c;
            --white: #181d23;
            --success: #34d399;
            --success-light: #123d2e;
            --error: #f87171;
            --error-light: #4a1f1f;
            --warning: #fbbf24;
            --on-accent: #06251d;
            --shadow: rgba(0,0,0,0.4);
            --reveal-ok-bg: #123d2e; --reveal-ok-fg: #a7f3d0;
            --reveal-bad-bg: #4a1f1f; --reveal-bad-fg: #fecaca;
        }
        html { color-scheme: light; }
        :root[data-theme="dark"] { color-scheme: dark; }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--light-gray);
            color: var(--dark);
            line-height: 1.5;
            padding-bottom: 40px;
        }

        header {
            background-color: var(--white);
            border-bottom: 1px solid var(--border);
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 10;
            box-shadow: 0 2px 4px var(--shadow);
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .hpe-element {
            width: 40px;
            height: 16px;
            border: 4px solid var(--primary);
            border-radius: 2px;
        }

        .logo-text {
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: -0.5px;
        }

        .logo-text span {
            color: var(--primary);
        }

        .main-wrapper {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background-color: var(--white);
            border-radius: 8px;
            border: 1px solid var(--border);
            padding: 30px;
            box-shadow: 0 4px 6px var(--shadow);
            margin-bottom: 25px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--dark);
        }

        p.subtitle {
            color: var(--gray);
            font-size: 1rem;
            margin-bottom: 25px;
        }

        .grid-dashboard {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;
        }

        @media (max-width: 900px) {
            .grid-dashboard {
                grid-template-columns: 1fr;
            }
        }

        .topic-list {
            margin-top: 15px;
        }

        .topic-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid var(--border);
            font-size: 0.95rem;
        }

        .topic-item:last-child {
            border-bottom: none;
        }

        .topic-name {
            font-weight: 500;
            color: var(--dark-gray);
            max-width: 75%;
        }

        .topic-count {
            background-color: var(--light-gray);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--gray);
        }

        .setup-box {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--dark-gray);
        }

        select, input {
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-size: 0.95rem;
            outline: none;
            width: 100%;
            background-color: var(--white);
        }

        select:focus, input:focus {
            border-color: var(--primary);
        }

        .btn {
            background-color: var(--primary);
            color: var(--on-accent);
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
            display: inline-block;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: var(--light-gray);
            color: var(--dark-gray);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background-color: var(--border);
        }

        .hidden {
            display: none !important;
        }

        /* Runtime Styles */
        .runtime-layout {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 25px;
        }

        @media (max-width: 900px) {
            .runtime-layout {
                grid-template-columns: 1fr;
            }
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }

        .tag-topic {
            background-color: var(--primary-light);
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .q-number {
            font-weight: 600;
            color: var(--gray);
            font-size: 0.95rem;
        }

        .question-text { white-space: pre-line;
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 25px;
            color: var(--dark);
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .option-card {
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 15px 20px;
            cursor: pointer;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            transition: all 0.2s;
        }

        .option-card:hover {
            border-color: var(--primary);
            background-color: rgba(1, 169, 130, 0.01);
        }

        .option-card.selected {
            border-color: var(--primary);
            background-color: var(--primary-light);
        }

        .option-marker {
            width: 22px;
            height: 22px;
            border: 2px solid var(--border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--gray);
            background-color: var(--white);
            flex-shrink: 0;
            margin-top: 1px;
        }

        .option-card.selected .option-marker {
            border-color: var(--primary);
            background-color: var(--primary);
            color: var(--on-accent);
        }

        .option-text {
            font-size: 0.95rem;
            color: var(--dark-gray);
            font-weight: 400;
        }

        .option-card.selected .option-text {
            color: var(--dark);
            font-weight: 500;
        }

        .nav-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Sidebar Grid Navigation */
        .sidebar-box {
            background-color: var(--white);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            height: fit-content;
        }

        .sidebar-title {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 15px;
            color: var(--dark);
        }

        .grid-navigation {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .nav-grid-btn {
            height: 40px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background-color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-grid-btn:hover {
            border-color: var(--dark);
        }

        .nav-grid-btn.active {
            border-color: var(--primary);
            background-color: var(--primary-light);
            color: var(--primary);
        }

        .nav-grid-btn.answered {
            background-color: var(--dark);
            color: var(--white);
            border-color: var(--dark);
        }

        .nav-grid-btn.answered.active {
            box-shadow: 0 0 0 2px var(--primary);
        }

        .nav-grid-btn.answered-correct {
            background-color: var(--success);
            color: var(--on-accent);
            border-color: var(--success);
        }

        .nav-grid-btn.answered-wrong {
            background-color: var(--error);
            color: var(--on-accent);
            border-color: var(--error);
        }

        .nav-grid-btn.answered-correct.active,
        .nav-grid-btn.answered-wrong.active {
            box-shadow: 0 0 0 3px rgba(0,0,0,0.25);
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        /* Summary Dashboard Metrics */
        .metrics-summary-box {
            display: flex;
            align-items: center;
            gap: 30px;
            margin-bottom: 30px;
            padding-bottom: 25px;
            border-bottom: 1px solid var(--border);
        }

        @media (max-width: 600px) {
            .metrics-summary-box {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
            }
        }

        .score-circle {
            width: 100px;
            height: 100px;
            border: 8px solid var(--border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .review-item-card {
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 20px;
            background-color: var(--white);
        }

        .review-item-card.is-correct {
            border-left: 5px solid var(--success);
        }

        .review-item-card.is-incorrect {
            border-left: 5px solid var(--error);
        }

        .review-status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .is-correct .review-status-badge {
            background-color: var(--success-light);
            color: var(--success);
        }

        .is-incorrect .review-status-badge {
            background-color: var(--error-light);
            color: var(--error);
        }

        .explanation-box {
            background-color: var(--light-gray);
            border-radius: 4px;
            padding: 15px;
            border-left: 3px solid var(--gray);
        }
    
        .option-marker input[type='checkbox']{ width:18px; height:18px; transform:translateY(-1px);}

        #validate-btn {
            background-color: var(--dark); color: var(--white);
            border: 2px solid var(--dark); padding: 12px 20px;
            border-radius: 6px; font-size: 1rem; font-weight: 600;
            cursor: pointer; transition: all 0.2s ease; margin-right: 12px;
        }
        #validate-btn:hover { opacity: 0.85; }
        #validate-btn:disabled { opacity: 0.5; cursor: default; }
        .correct-reveal  { background-color: var(--reveal-ok-bg) !important; border: 2px solid var(--success) !important; color: var(--reveal-ok-fg) !important; }
        .correct-reveal .option-text, .incorrect-reveal .option-text { color: inherit; }
        .incorrect-reveal{ background-color: var(--reveal-bad-bg) !important; border: 2px solid var(--error) !important; color: var(--reveal-bad-fg) !important; }
        .dynamic-explanation-box {
            background-color: var(--light-gray); border-left: 4px solid var(--primary);
            padding: 16px; margin-top: 20px; margin-bottom: 20px;
            border-radius: 0 8px 8px 0; box-shadow: 0 1px 3px var(--shadow);
        }
        .dynamic-explanation-box h4 { font-size: 1rem; color: var(--dark); margin-bottom: 6px; font-weight: 700; }
        .dynamic-explanation-box p { font-size: 0.92rem; color: var(--dark-gray); line-height: 1.5; margin: 0; }
        .btn-final { background-color: var(--dark) !important; color: var(--white) !important; }
        .btn-danger-outline { width: 100%; border-color: var(--error); color: var(--error); }
        .question-text { white-space: pre-line; }

        .header-controls { display: flex; align-items: center; gap: 10px; }
        .icon-btn {
            min-width: 40px; height: 36px; padding: 0 10px; border-radius: 6px;
            border: 1px solid var(--border); background: var(--white); color: var(--dark);
            font-size: 0.85rem; font-weight: 700; cursor: pointer;
        }
        .icon-btn:hover { border-color: var(--primary); color: var(--primary); }

        .exam-card {
            display: block; padding: 14px 16px; margin-bottom: 10px;
            border: 1px solid var(--border); border-radius: 8px;
            text-decoration: none; color: var(--dark); background: var(--white);
        }
        .exam-card:hover, .exam-card.current { border-color: var(--primary); }
        .exam-card-title { font-weight: 700; color: var(--primary); }
        .exam-card-desc { font-size: 0.9rem; color: var(--gray); margin-top: 4px; }
        .exam-switcher { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
        .exam-switcher-label { font-weight: 600; font-size: 0.9rem; color: var(--gray); }
        .exam-chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .exam-chip {
            padding: 6px 14px; border-radius: 999px; font-size: 0.85rem; font-weight: 600;
            border: 1px solid var(--border); color: var(--dark-gray); text-decoration: none; background: var(--white);
        }
        .exam-chip:hover { border-color: var(--primary); color: var(--primary); }
        .exam-chip.current { background: var(--primary); border-color: var(--primary); color: var(--on-accent); }

        .topic-total { background-color: var(--primary-light); border-radius: 6px; border-bottom: none; margin-bottom: 10px; }
        .review-option { margin: 6px 0; }
        .review-correct { color: var(--success); font-weight: 600; background-color: var(--success-light); border-radius: 4px; padding: 2px 6px; }
        .review-wrong { color: var(--error); font-weight: 600; background-color: var(--error-light); border-radius: 4px; padding: 2px 6px; }
    </style>
    <script src="exams.js"></script>
    <script>
    // Theme applied before first paint to avoid a flash
    (function () {
        var theme = null;
        try { theme = localStorage.getItem('exam_theme'); } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
            theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
    })();
    // Exam content: ?content=name loads name.exam
    (function() {
        var c = new URLSearchParams(window.location.search).get('content');
        if (c && /^[\w.\-]+$/.test(c)) { document.write('<scr' + 'ipt src="' + c + '.exam"></scr' + 'ipt>'); }
    })();
    </script>
</head>
<body>
<header>
    <div class="header-container">
        <div class="logo-area">
            <div class="hpe-element"></div>
            <div class="logo-text"><span id="logo-exam-code">EXAM</span> <span id="logo-simulator" data-i18n="simulator">SIMULATOR</span> <span id="logo-version" style="font-size:0.7rem;color:var(--gray);font-weight:400;"></span></div>
        </div>
        <div class="header-controls">
            <div id="runtime-timer-box" class="q-number hidden"><span data-i18n="timeRemaining">Time remaining:</span> <span id="runtime-clock-string" style="color: var(--dark); font-weight: 600;">--:--</span></div>
            <button type="button" id="lang-btn" class="icon-btn" title="Language / Lingua">EN</button>
            <button type="button" id="theme-btn" class="icon-btn" title="Theme / Tema">☾</button>
        </div>
    </div>
</header>

<div class="main-wrapper">
    <!-- EXAM PICKER (no exam loaded) -->
    <div id="no-content-message" class="card hidden" style="text-align:center; padding:50px 30px;">
        <div id="no-content-body">
            <h1 style="font-size:1.5rem; margin-bottom:12px;" data-i18n="noExamTitle">Choose an exam</h1>
            <p style="color:var(--gray);" data-i18n="noExamText">Select one of the available exams below to start practicing.</p>
        </div>
        <div id="exam-list" style="margin-top:25px; text-align:left;"></div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="main-dashboard" class="card hidden">
        <h1 id="dashboard-title">Exam Practice</h1>
        <p id="dashboard-subtitle" class="subtitle"></p>

        <div class="exam-switcher">
            <span class="exam-switcher-label" data-i18n="switchExam">Exams:</span>
            <div id="dash-exam-list" class="exam-chips"></div>
        </div>

        <div class="grid-dashboard">
            <div>
                <h3 style="font-size: 1.1rem; font-weight: 600; margin-bottom: 10px;" data-i18n="distribution">Question distribution</h3>
                <div id="distribution-payload-box" class="topic-list"></div>
            </div>

            <div class="sidebar-box" style="margin-top: 15px;">
                <h3 class="sidebar-title" data-i18n="sessionConfig">Session setup</h3>
                <div class="setup-box">
                    <div class="form-group">
                        <label for="config-selection-mode" data-i18n="selectMode">Select mode</label>
                        <select id="config-selection-mode"></select>
                    </div>
                    <button id="start-btn" class="btn" type="button" data-i18n="startSession">Start session</button>
                </div>
            </div>
        </div>
    </div>

    <!-- RUNTIME ENGINE INTERFACE -->
    <div id="runtime-interface" class="hidden">
        <div class="runtime-layout">
            <div class="card" style="margin-bottom: 0;">
                <div class="question-header">
                    <span id="runtime-topic-tag" class="tag-topic">TOPIC</span>
                    <span id="runtime-position-string" class="q-number"></span>
                </div>

                <div id="runtime-question-text" class="question-text"></div>

                <div id="runtime-options-box" class="options-list"></div>

                <div class="nav-controls">
                    <button id="prev-btn" class="btn btn-secondary" type="button" data-i18n="previous">Previous</button>
                    <button id="validate-btn" type="button" data-i18n="validate">Check answer</button>
                    <button id="session-action-trigger" class="btn" type="button"></button>
                </div>
            </div>

            <div class="sidebar-box">
                <h3 class="sidebar-title" data-i18n="progress">Progress</h3>
                <div id="runtime-matrix-grid" class="grid-navigation"></div>
                <button id="submit-btn" class="btn btn-secondary btn-danger-outline" type="button" data-i18n="endScore">End and score</button>
            </div>
        </div>
    </div>

    <!-- SUMMARY RESULTS DASHBOARD -->
    <div id="summary-dashboard" class="card hidden">
        <h1 data-i18n="resultsTitle">Results</h1>
        <p class="subtitle" data-i18n="resultsSubtitle">Review each question and its explanation below.</p>

        <div class="metrics-summary-box">
            <div id="metric-percentage" class="score-circle">--%</div>
            <div>
                <h2 id="metric-raw-string" style="font-size: 1.3rem; font-weight: 600; margin-bottom: 4px;"></h2>
            </div>
        </div>

        <div style="margin-bottom: 25px; display: flex; gap: 15px;">
            <button id="return-btn" class="btn" type="button" data-i18n="backToMenu">Back to main menu</button>
        </div>

        <div id="review-payload-box"></div>
    </div>
</div>

<script>
(function () {
    'use strict';

    // ── Translations (UI only; exam content keeps its own language) ─────────
    const I18N = {
        en: {
            simulator: 'SIMULATOR', timeRemaining: 'Time remaining:',
            noExamTitle: 'Choose an exam', noExamText: 'Select one of the available exams below to start practicing.',
            availableExams: 'Available exams', switchExam: 'Exams:',
            loadFailedTitle: 'Failed to load exam file',
            loadFailedText: 'Could not load "{name}". Choose an exam from the list below.',
            distribution: 'Question distribution',
            totalQuestions: 'Total questions', nQuestions: '{n} questions',
            sessionConfig: 'Session setup', selectMode: 'Select mode', startSession: 'Start session',
            modeMock20: 'Standard mock exam ({n} random questions)',
            modeMock40: 'Official exam simulation ({n} questions · {m} min · pass {p}%)',
            modeAll: 'Full bank (all {n} questions)', modeTopics: 'Practice by topic',
            questionOf: 'Question {i} of {n}', previous: 'Previous', validate: 'Check answer',
            next: 'Next question', finish: 'Finish exam', progress: 'Progress', endScore: 'End and score',
            explanation: 'Explanation', noExplanation: 'No explanation available.',
            selectFirst: 'Select an answer before checking!',
            resultsTitle: 'Results', resultsSubtitle: 'Review each question and its explanation below.',
            scoreLine: 'You answered {c} out of {n} questions correctly.',
            pass: '✅ PASS — {t}% threshold reached', fail: '❌ FAIL — {t}% threshold not reached',
            correct: 'Correct', incorrect: 'Incorrect', questionN: 'Question {n}: {q}',
            backToMenu: 'Back to main menu',
            resume: 'An unfinished session was found. Do you want to resume it?',
            langTitle: 'Switch language', themeTitle: 'Switch light/dark theme'
        },
        it: {
            simulator: 'SIMULATORE', timeRemaining: 'Tempo rimanente:',
            noExamTitle: 'Scegli un esame', noExamText: 'Seleziona uno degli esami disponibili qui sotto per iniziare.',
            availableExams: 'Esami disponibili', switchExam: 'Esami:',
            loadFailedTitle: "Impossibile caricare l'esame",
            loadFailedText: 'Impossibile caricare "{name}". Scegli un esame dall\'elenco qui sotto.',
            distribution: 'Distribuzione delle domande',
            totalQuestions: 'Domande totali', nQuestions: '{n} domande',
            sessionConfig: 'Configurazione sessione', selectMode: 'Seleziona la modalità', startSession: 'Avvia sessione',
            modeMock20: 'Simulazione standard ({n} domande casuali)',
            modeMock40: 'Simulazione esame ufficiale ({n} domande · {m} min · soglia {p}%)',
            modeAll: 'Intero archivio (tutte le {n} domande)', modeTopics: 'Esercitazione per argomento',
            questionOf: 'Domanda {i} di {n}', previous: 'Precedente', validate: 'Verifica risposta',
            next: 'Domanda successiva', finish: "Termina l'esame", progress: 'Avanzamento', endScore: 'Termina e valuta',
            explanation: 'Spiegazione', noExplanation: 'Nessuna spiegazione disponibile.',
            selectFirst: 'Seleziona una risposta prima di verificare!',
            resultsTitle: 'Risultati', resultsSubtitle: 'Rivedi ogni domanda e la relativa spiegazione qui sotto.',
            scoreLine: 'Hai risposto correttamente a {c} domande su {n}.',
            pass: '✅ SUPERATO — soglia del {t}% raggiunta', fail: '❌ NON SUPERATO — soglia del {t}% non raggiunta',
            correct: 'Corretta', incorrect: 'Errata', questionN: 'Domanda {n}: {q}',
            backToMenu: 'Torna al menu principale',
            resume: 'È stata trovata una sessione precedente non completata. Vuoi riprenderla?',
            langTitle: 'Cambia lingua', themeTitle: 'Cambia tema chiaro/scuro'
        }
    };

    // ── Helpers ─────────────────────────────────────────────────────────────
    const $ = id => document.getElementById(id);
    const LETTERS = ['A', 'B', 'C', 'D', 'E', 'F'];

    function readPref(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
    function writePref(key, value) { try { localStorage.setItem(key, value); } catch (e) { /* ignore */ } }

    let lang = readPref('exam_lang');
    if (lang !== 'en' && lang !== 'it') lang = 'en';

    function t(key, params) {
        let s = (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key;
        Object.keys(params || {}).forEach(k => { s = s.split('{' + k + '}').join(params[k]); });
        return s;
    }

    // Builds a DOM element; text always goes through textContent (no innerHTML).
    function el(tag, props, ...children) {
        const node = document.createElement(tag);
        Object.entries(props || {}).forEach(([k, v]) => {
            if (k === 'text') node.textContent = v;
            else if (k === 'style') node.style.cssText = v;
            else if (k === 'class') node.className = v;
            else node[k] = v;
        });
        children.forEach(c => c && node.appendChild(c));
        return node;
    }

    function shuffle(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    const sameSet = (a, b) => {
        const x = [...a].sort((p, q) => p - q), y = [...b].sort((p, q) => p - q);
        return x.length === y.length && x.every((v, i) => v === y[i]);
    };

    const data = () => window.ExamData;
    const cfg = () => window.ExamData.config;
    const loc = v => (v && typeof v === 'object') ? (v[lang] || v.en || '') : (v || '');

    // ── Question preparation ────────────────────────────────────────────────
    // Letters are rendered by the engine, type derives from answer count, options are shuffled.
    function normalizeQuestions() {
        const stripLetter = s => String(s).replace(/^\s*[A-Fa-f][)\.]\s+/, '');
        data().questions.forEach(q => {
            if (!Array.isArray(q.options)) return;
            if (!Array.isArray(q.answer)) q.answer = [q.answer];
            q.type = q.answer.length > 1 ? 'multiple' : 'single';

            // shuffle:false keeps the option order (e.g. "All of the above")
            const identity = q.options.map((_, i) => i);
            const order = q.shuffle === false ? identity : shuffle(identity);
            const opts = q.options.map(stripLetter);
            q.options = order.map(i => opts[i]);
            q.answer = q.answer.map(old => order.indexOf(old)).sort((a, b) => a - b);
        });
    }

    // ── State ───────────────────────────────────────────────────────────────
    const state = {
        screen: 'picker',   // picker | dashboard | runtime | summary
        items: [], index: 0, selections: {}, validated: {}, mode: null,
        secondsLeft: 0, timer: null, examFile: null
    };

    const storeKey = () => 'exam_session_' + cfg().examCode;

    function saveSession() {
        writePref(storeKey(), JSON.stringify({
            items: state.items, index: state.index, selections: state.selections,
            validated: state.validated, mode: state.mode, secondsLeft: state.secondsLeft
        }));
    }
    function clearSession() { try { localStorage.removeItem(storeKey()); } catch (e) { /* ignore */ } }

    function isCorrect(i) {
        const sel = state.selections[i];
        if (sel === undefined) return false;
        return sameSet(Array.isArray(sel) ? sel : [sel], state.items[i].answer);
    }

    // ── Screens ─────────────────────────────────────────────────────────────
    function show(screen) {
        state.screen = screen;
        $('no-content-message').classList.toggle('hidden', screen !== 'picker');
        $('main-dashboard').classList.toggle('hidden', screen !== 'dashboard');
        $('runtime-interface').classList.toggle('hidden', screen !== 'runtime');
        $('summary-dashboard').classList.toggle('hidden', screen !== 'summary');
    }

    function applyStaticText() {
        document.documentElement.lang = lang;
        document.querySelectorAll('[data-i18n]').forEach(node => { node.textContent = t(node.getAttribute('data-i18n')); });
        $('lang-btn').textContent = lang.toUpperCase();
        $('lang-btn').title = t('langTitle');
        $('theme-btn').title = t('themeTitle');
    }

    function renderTheme() {
        const dark = document.documentElement.getAttribute('data-theme') === 'dark';
        $('theme-btn').textContent = dark ? '☀' : '☾';
    }

    // Exam catalog (from exams.js)
    function catalog() { return Array.isArray(window.ExamCatalog) ? window.ExamCatalog : []; }

    function renderExamLists() {
        const picker = $('exam-list');
        picker.textContent = '';
        if (catalog().length) {
            picker.appendChild(el('h3', { style: 'font-size:1.05rem;font-weight:600;margin-bottom:10px;text-align:center;', text: t('availableExams') }));
        }
        catalog().forEach(item => {
            const current = item.file === state.examFile;
            picker.appendChild(el('a', { href: '?content=' + encodeURIComponent(item.file), class: 'exam-card' + (current ? ' current' : '') },
                el('div', { class: 'exam-card-title', text: loc(item.title) || item.file }),
                el('div', { class: 'exam-card-desc', text: loc(item.description) })));
        });

        const chips = $('dash-exam-list');
        chips.textContent = '';
        catalog().forEach(item => {
            const current = item.file === state.examFile;
            chips.appendChild(el('a', { href: '?content=' + encodeURIComponent(item.file), class: 'exam-chip' + (current ? ' current' : ''), text: loc(item.title) || item.file, title: loc(item.description) }));
        });
    }

    function renderDashboard() {
        const questions = data().questions;
        const counts = {};
        questions.forEach(q => { counts[q.topic] = (counts[q.topic] || 0) + 1; });

        $('dashboard-title').textContent = cfg().examTitle || cfg().examCode || 'Exam';
        $('dashboard-subtitle').textContent = loc(cfg().subtitle);

        const select = $('config-selection-mode');
        const previous = select.value;
        select.textContent = '';
        const addOpt = (parent, value, label) => parent.appendChild(el('option', { value: value, text: label }));
        addOpt(select, 'mock20', t('modeMock20', { n: cfg().mockStandardCount }));
        addOpt(select, 'mock40', t('modeMock40', { n: cfg().mockOfficialCount, m: Math.floor(cfg().mockOfficialTimeSec / 60), p: cfg().passThresholdMockOfficial }));
        addOpt(select, 'all', t('modeAll', { n: questions.length }));
        const group = el('optgroup', { label: t('modeTopics') });
        select.appendChild(group);

        const box = $('distribution-payload-box');
        box.textContent = '';
        box.appendChild(el('div', { class: 'topic-item topic-total' },
            el('span', { class: 'topic-name', style: 'color: var(--primary); font-weight: 700;', text: t('totalQuestions') }),
            el('span', { class: 'topic-count', style: 'background-color: var(--primary); color: var(--on-accent);', text: t('nQuestions', { n: questions.length }) })));
        Object.keys(counts).forEach(topic => {
            box.appendChild(el('div', { class: 'topic-item' },
                el('span', { class: 'topic-name', text: topic }),
                el('span', { class: 'topic-count', text: t('nQuestions', { n: counts[topic] }) })));
            addOpt(group, topic, `${topic} (${t('nQuestions', { n: counts[topic] })})`);
        });
        if (previous) select.value = previous;
        renderExamLists();
    }

    // ── Question selection ──────────────────────────────────────────────────
    function pickItems(mode) {
        const questions = data().questions;
        const byTopic = {};
        questions.forEach(q => (byTopic[q.topic] = byTopic[q.topic] || []).push(q));

        if (mode === 'mock20') {
            const pool = Object.keys(byTopic).map(k => shuffle(byTopic[k])[0]);
            const used = new Set(pool.map(q => q.id));
            const rest = shuffle(questions.filter(q => !used.has(q.id)));
            pool.push(...rest.slice(0, Math.max(0, cfg().mockStandardCount - pool.length)));
            return shuffle(pool).slice(0, cfg().mockStandardCount);
        }
        if (mode === 'mock40') {
            const pool = [];
            const used = new Set();
            cfg().macroGroups.forEach(group => {
                let remaining = group.weight;
                for (let round = 0; remaining > 0 && round < 50; round++) {
                    for (const topic of shuffle(group.topics)) {
                        if (remaining <= 0) break;
                        const q = shuffle((byTopic[topic] || []).filter(x => !used.has(x.id)))[0];
                        if (!q) continue;
                        used.add(q.id);
                        pool.push(q);
                        remaining--;
                    }
                }
            });
            if (pool.length < cfg().mockOfficialCount) {
                const rest = shuffle(questions.filter(q => !used.has(q.id)));
                pool.push(...rest.slice(0, cfg().mockOfficialCount - pool.length));
            }
            return shuffle(pool).slice(0, cfg().mockOfficialCount);
        }
        if (mode === 'all') return [...questions];
        return questions.filter(q => q.topic === mode);
    }

    // ── Session ─────────────────────────────────────────────────────────────
    function startExam() {
        state.mode = $('config-selection-mode').value;
        state.items = pickItems(state.mode);
        state.index = 0;
        state.selections = {};
        state.validated = {};
        const seconds = state.mode === 'mock40' ? cfg().mockOfficialTimeSec : state.items.length * cfg().timePerQuestionSec;
        beginSession(seconds);
    }

    function beginSession(seconds) {
        show('runtime');
        startClock(seconds);
        renderQuestion();
        renderMatrix();
        saveSession();
    }

    function startClock(seconds) {
        clearInterval(state.timer);
        state.secondsLeft = seconds;
        $('runtime-timer-box').classList.remove('hidden');
        const tick = () => {
            if (state.secondsLeft <= 0) { submitExam(); return; }
            state.secondsLeft--;
            const m = String(Math.floor(state.secondsLeft / 60)).padStart(2, '0');
            const s = String(state.secondsLeft % 60).padStart(2, '0');
            $('runtime-clock-string').textContent = `${m}:${s}`;
        };
        tick();
        state.timer = setInterval(tick, 1000);
    }

    function renderQuestion() {
        const q = state.items[state.index];
        const multiple = q.type === 'multiple';
        const sel = state.selections[state.index];
        const chosen = multiple ? (Array.isArray(sel) ? sel : []) : [sel];
        const validated = state.validated[state.index] !== undefined;

        $('runtime-topic-tag').textContent = q.topic;
        $('runtime-position-string').textContent = t('questionOf', { i: state.index + 1, n: state.items.length });
        $('runtime-question-text').textContent = q.question;

        const box = $('runtime-options-box');
        box.textContent = '';
        q.options.forEach((text, i) => {
            const picked = chosen.includes(i);
            let cls = 'option-card' + (picked ? ' selected' : '');
            if (validated && q.answer.includes(i)) cls += ' correct-reveal';
            else if (validated && picked) cls += ' incorrect-reveal';

            const marker = el('div', { class: 'option-marker' });
            if (multiple) marker.appendChild(el('input', { type: 'checkbox', disabled: true, checked: picked }));
            else marker.textContent = LETTERS[i];

            const card = el('div', { class: cls }, marker, el('div', { class: 'option-text', text: text }));
            card.addEventListener('click', () => selectOption(i));
            box.appendChild(card);
        });

        const oldExp = document.querySelector('.dynamic-explanation-box');
        if (oldExp) oldExp.remove();
        if (validated) {
            box.parentNode.insertBefore(el('div', { class: 'dynamic-explanation-box' },
                el('h4', { text: t('explanation') }),
                el('p', { text: q.explanation || t('noExplanation') })), box.nextSibling);
        }

        $('validate-btn').disabled = validated;
        const last = state.index === state.items.length - 1;
        const next = $('session-action-trigger');
        next.textContent = last ? t('finish') : t('next');
        next.classList.toggle('btn-final', last);
    }

    function renderMatrix() {
        const box = $('runtime-matrix-grid');
        box.textContent = '';
        state.items.forEach((_, i) => {
            let cls = 'nav-grid-btn' + (i === state.index ? ' active' : '');
            if (state.validated[i] === true) cls += ' answered-correct';
            else if (state.validated[i] === false) cls += ' answered-wrong';
            else if (state.selections[i] !== undefined) cls += ' answered';
            const btn = el('div', { class: cls, text: String(i + 1) });
            btn.addEventListener('click', () => goTo(i));
            box.appendChild(btn);
        });
    }

    function selectOption(i) {
        if (state.validated[state.index] !== undefined) return; // locked after checking
        const q = state.items[state.index];
        if (q.type === 'multiple') {
            const cur = Array.isArray(state.selections[state.index]) ? state.selections[state.index] : [];
            state.selections[state.index] = cur.includes(i) ? cur.filter(x => x !== i) : [...cur, i].sort((a, b) => a - b);
        } else {
            state.selections[state.index] = i;
        }
        renderQuestion();
        renderMatrix();
        saveSession();
    }

    function validateAnswer() {
        const idx = state.index;
        if (state.validated[idx] !== undefined) return;
        const sel = state.selections[idx];
        if (sel === undefined || (Array.isArray(sel) && sel.length === 0)) { alert(t('selectFirst')); return; }
        state.validated[idx] = isCorrect(idx);
        renderQuestion();
        renderMatrix();
        saveSession();
    }

    function goTo(i) {
        if (i < 0 || i >= state.items.length) return;
        state.index = i;
        renderQuestion();
        renderMatrix();
        saveSession();
    }

    function nextQuestion() {
        if (state.index === state.items.length - 1) submitExam();
        else goTo(state.index + 1);
    }

    // ── Results ─────────────────────────────────────────────────────────────
    function submitExam() {
        clearInterval(state.timer);
        clearSession();
        $('runtime-timer-box').classList.add('hidden');
        show('summary');
        renderSummary();
    }

    function renderSummary() {
        const review = $('review-payload-box');
        review.textContent = '';
        let correctCount = 0;

        state.items.forEach((q, i) => {
            const ok = isCorrect(i);
            if (ok) correctCount++;
            const sel = state.selections[i];
            const chosen = Array.isArray(sel) ? sel : (sel === undefined ? [] : [sel]);

            const optionsBox = el('div', { style: 'margin-bottom:15px; font-size:0.95rem;' });
            q.options.forEach((opt, k) => {
                let cls = 'review-option';
                if (q.answer.includes(k)) cls += ' review-correct';
                else if (chosen.includes(k)) cls += ' review-wrong';
                optionsBox.appendChild(el('p', { class: cls }, el('strong', { text: LETTERS[k] + ': ' }), document.createTextNode(opt)));
            });

            review.appendChild(el('div', { class: 'review-item-card ' + (ok ? 'is-correct' : 'is-incorrect') },
                el('span', { class: 'review-status-badge', text: ok ? t('correct') : t('incorrect') }),
                el('h3', { style: 'font-size:1.05rem; margin-bottom:10px;', text: t('questionN', { n: i + 1, q: q.question }) }),
                optionsBox,
                el('div', { class: 'explanation-box', style: 'margin-top:15px;' },
                    el('h4', { style: 'font-size:0.95rem;', text: t('explanation') }),
                    el('p', { style: 'font-size:0.9rem;', text: q.explanation || '' }))));
        });

        const pct = Math.round((correctCount / state.items.length) * 100);
        const threshold = state.mode === 'mock40' ? cfg().passThresholdMockOfficial : cfg().passThresholdDefault;
        const passed = pct >= threshold;
        const color = passed ? 'var(--success)' : 'var(--error)';

        const score = $('metric-percentage');
        score.textContent = pct + '%';
        score.style.borderColor = color;
        score.style.color = color;

        const oldBadge = $('exam-result-badge');
        if (oldBadge) oldBadge.remove();
        score.parentNode.appendChild(el('p', {
            id: 'exam-result-badge',
            style: 'font-size:1rem;font-weight:700;margin-top:8px;color:' + color,
            text: t(passed ? 'pass' : 'fail', { t: threshold })
        }));
        $('metric-raw-string').textContent = t('scoreLine', { c: correctCount, n: state.items.length });
    }

    function returnToMainMenu() {
        const badge = $('exam-result-badge');
        if (badge) badge.remove();
        show('dashboard');
        window.scrollTo(0, 0);
        renderDashboard();
    }

    // ── Resume an interrupted session ───────────────────────────────────────
    function offerResume() {
        let saved;
        try { saved = JSON.parse(localStorage.getItem(storeKey())); } catch (e) { return; }
        if (!saved || !Array.isArray(saved.items) || !saved.items.length) return;
        if (!confirm(t('resume'))) { clearSession(); return; }
        state.items = saved.items;
        state.index = Math.min(saved.index || 0, saved.items.length - 1);
        state.selections = saved.selections || {};
        state.validated = saved.validated || {};
        state.mode = saved.mode;
        beginSession(saved.secondsLeft > 0 ? saved.secondsLeft : saved.items.length * cfg().timePerQuestionSec);
    }

    // ── Loading ─────────────────────────────────────────────────────────────
    function validExamData(d) {
        return !!(d && d.config && Array.isArray(d.questions) && d.questions.length > 0 &&
            d.questions.every(q => q && q.topic && q.question && Array.isArray(q.options) && q.answer !== undefined));
    }

    function startApp(file) {
        state.examFile = file;
        normalizeQuestions();
        document.title = cfg().examTitle || 'Exam Simulator';
        $('logo-exam-code').textContent = cfg().examCode || 'EXAM';
        $('logo-version').textContent = cfg().version || '';
        show('dashboard');
        renderDashboard();
        offerResume();
    }

    function showPicker(failedName) {
        document.title = 'Exam Simulator';
        $('logo-exam-code').textContent = 'EXAM';
        $('logo-version').textContent = '';
        const body = $('no-content-body');
        body.textContent = '';
        if (failedName) {
            body.appendChild(el('h1', { style: 'font-size:1.5rem;margin-bottom:12px;color:var(--error);', text: t('loadFailedTitle') }));
            body.appendChild(el('p', { style: 'color:var(--gray);', text: t('loadFailedText', { name: failedName + '.exam' }) }));
        } else {
            body.appendChild(el('h1', { style: 'font-size:1.5rem;margin-bottom:12px;', text: t('noExamTitle') }));
            body.appendChild(el('p', { style: 'color:var(--gray);', text: t('noExamText') }));
        }
        show('picker');
        renderExamLists();
    }

    // ── Language / theme ────────────────────────────────────────────────────
    function rerender() {
        applyStaticText();
        renderTheme();
        if (state.screen === 'picker') showPicker(state.failedName);
        else if (state.screen === 'dashboard') renderDashboard();
        else if (state.screen === 'runtime') { renderQuestion(); renderMatrix(); }
        else if (state.screen === 'summary') renderSummary();
    }

    function bindControls() {
        $('start-btn').addEventListener('click', startExam);
        $('prev-btn').addEventListener('click', () => goTo(state.index - 1));
        $('session-action-trigger').addEventListener('click', nextQuestion);
        $('validate-btn').addEventListener('click', validateAnswer);
        $('submit-btn').addEventListener('click', submitExam);
        $('return-btn').addEventListener('click', returnToMainMenu);
        $('lang-btn').addEventListener('click', () => {
            lang = lang === 'en' ? 'it' : 'en';
            writePref('exam_lang', lang);
            rerender();
        });
        $('theme-btn').addEventListener('click', () => {
            const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            writePref('exam_theme', next);
            renderTheme();
        });
    }

    // ── Boot ────────────────────────────────────────────────────────────────
    bindControls();
    applyStaticText();
    renderTheme();
    const contentName = new URLSearchParams(window.location.search).get('content');
    if (validExamData(window.ExamData)) startApp(contentName);
    else { state.failedName = contentName && /^[\w.\-]+$/.test(contentName) ? contentName : null; showPicker(state.failedName); }
})();
</script>
</body>
</html>
