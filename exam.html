<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#01a982">
    <title>Exam Simulator</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #01a982;
            --primary-hover: #018566;
            --primary-light: #e0f5ef;
            --dark: #111111;
            --dark-gray: #444444;
            --gray: #888888;
            --light-gray: #f4f6f8;
            --border: #e2e8f0;
            --white: #ffffff;
            --success: #10b981;
            --success-light: #d1fae5;
            --error: #ef4444;
            --error-light: #fee2e2;
            --warning: #f59e0b;
            --on-accent: #ffffff;
            --shadow: rgba(0,0,0,0.05);
            --reveal-ok-bg: #d1fae5; --reveal-ok-fg: #065f46;
            --reveal-bad-bg: #fee2e2; --reveal-bad-fg: #991b1b;
        }

        :root[data-theme="dark"] {
            --primary: #10c79a;
            --primary-hover: #0ea982;
            --primary-light: #0f3a30;
            --dark: #e8edf2;
            --dark-gray: #c3ccd6;
            --gray: #94a3b8;
            --light-gray: #0e1216;
            --border: #2b333c;
            --white: #181d23;
            --success: #34d399;
            --success-light: #123d2e;
            --error: #f87171;
            --error-light: #4a1f1f;
            --warning: #fbbf24;
            --on-accent: #06251d;
            --shadow: rgba(0,0,0,0.4);
            --reveal-ok-bg: #123d2e; --reveal-ok-fg: #a7f3d0;
            --reveal-bad-bg: #4a1f1f; --reveal-bad-fg: #fecaca;
        }
        html { color-scheme: light; }
        :root[data-theme="dark"] { color-scheme: dark; }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--light-gray);
            color: var(--dark);
            line-height: 1.5;
            padding-bottom: 40px;
        }

        header {
            background-color: var(--white);
            border-bottom: 1px solid var(--border);
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 10;
            box-shadow: 0 2px 4px var(--shadow);
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .hpe-element {
            width: 40px;
            height: 16px;
            border: 4px solid var(--primary);
            border-radius: 2px;
        }

        .logo-text {
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: -0.5px;
        }

        .logo-text span {
            color: var(--primary);
        }

        .main-wrapper {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background-color: var(--white);
            border-radius: 8px;
            border: 1px solid var(--border);
            padding: 30px;
            box-shadow: 0 4px 6px var(--shadow);
            margin-bottom: 25px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--dark);
        }

        p.subtitle {
            color: var(--gray);
            font-size: 1rem;
            margin-bottom: 25px;
        }

        .grid-dashboard {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;
        }

        @media (max-width: 900px) {
            .grid-dashboard {
                grid-template-columns: 1fr;
            }
        }

        .topic-list {
            margin-top: 15px;
        }

        .topic-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid var(--border);
            font-size: 0.95rem;
        }

        .topic-item:last-child {
            border-bottom: none;
        }

        .topic-name {
            font-weight: 500;
            color: var(--dark-gray);
            max-width: 75%;
        }

        .topic-count {
            background-color: var(--light-gray);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--gray);
        }

        .setup-box {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--dark-gray);
        }

        select, input {
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-size: 0.95rem;
            outline: none;
            width: 100%;
            background-color: var(--white);
        }

        select:focus, input:focus {
            border-color: var(--primary);
        }

        .btn {
            background-color: var(--primary);
            color: var(--on-accent);
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
            display: inline-block;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: var(--light-gray);
            color: var(--dark-gray);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background-color: var(--border);
        }

        .hidden {
            display: none !important;
        }

        /* Runtime Styles */
        .runtime-layout {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 25px;
        }

        @media (max-width: 900px) {
            .runtime-layout {
                grid-template-columns: 1fr;
            }
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }

        .tag-topic {
            background-color: var(--primary-light);
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .q-number {
            font-weight: 600;
            color: var(--gray);
            font-size: 0.95rem;
        }

        .question-text { white-space: pre-line;
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 25px;
            color: var(--dark);
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .option-card {
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 15px 20px;
            cursor: pointer;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            transition: all 0.2s;
        }

        .option-card:hover {
            border-color: var(--primary);
            background-color: rgba(1, 169, 130, 0.01);
        }

        .option-card.selected {
            border-color: var(--primary);
            background-color: var(--primary-light);
        }

        .option-marker {
            width: 22px;
            height: 22px;
            border: 2px solid var(--border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--gray);
            background-color: var(--white);
            flex-shrink: 0;
            margin-top: 1px;
        }

        .option-card.selected .option-marker {
            border-color: var(--primary);
            background-color: var(--primary);
            color: var(--on-accent);
        }

        .option-text {
            font-size: 0.95rem;
            color: var(--dark-gray);
            font-weight: 400;
        }

        .option-card.selected .option-text {
            color: var(--dark);
            font-weight: 500;
        }

        .nav-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Sidebar Grid Navigation */
        .sidebar-box {
            background-color: var(--white);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            height: fit-content;
        }

        .sidebar-title {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 15px;
            color: var(--dark);
        }

        .grid-navigation {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .nav-grid-btn {
            height: 40px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background-color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-grid-btn:hover {
            border-color: var(--dark);
        }

        .nav-grid-btn.active {
            border-color: var(--primary);
            background-color: var(--primary-light);
            color: var(--primary);
        }

        .nav-grid-btn.answered {
            background-color: var(--dark);
            color: var(--white);
            border-color: var(--dark);
        }

        .nav-grid-btn.answered.active {
            box-shadow: 0 0 0 2px var(--primary);
        }

        .nav-grid-btn.answered-correct {
            background-color: var(--success);
            color: var(--on-accent);
            border-color: var(--success);
        }

        .nav-grid-btn.answered-wrong {
            background-color: var(--error);
            color: var(--on-accent);
            border-color: var(--error);
        }

        .nav-grid-btn.answered-correct.active,
        .nav-grid-btn.answered-wrong.active {
            box-shadow: 0 0 0 3px rgba(0,0,0,0.25);
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        /* Summary Dashboard Metrics */
        .metrics-summary-box {
            display: flex;
            align-items: center;
            gap: 30px;
            margin-bottom: 30px;
            padding-bottom: 25px;
            border-bottom: 1px solid var(--border);
        }

        @media (max-width: 600px) {
            .metrics-summary-box {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
            }
        }

        .score-circle {
            width: 100px;
            height: 100px;
            border: 8px solid var(--border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .review-item-card {
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 20px;
            background-color: var(--white);
        }

        .review-item-card.is-correct {
            border-left: 5px solid var(--success);
        }

        .review-item-card.is-incorrect {
            border-left: 5px solid var(--error);
        }

        .review-status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .is-correct .review-status-badge {
            background-color: var(--success-light);
            color: var(--success);
        }

        .is-incorrect .review-status-badge {
            background-color: var(--error-light);
            color: var(--error);
        }

        .explanation-box {
            background-color: var(--light-gray);
            border-radius: 4px;
            padding: 15px;
            border-left: 3px solid var(--gray);
        }
    
        .option-marker input[type='checkbox']{ width:18px; height:18px; transform:translateY(-1px);}

        #validate-btn {
            background-color: var(--dark); color: var(--white);
            border: 2px solid var(--dark); padding: 12px 20px;
            border-radius: 6px; font-size: 1rem; font-weight: 600;
            cursor: pointer; transition: all 0.2s ease; margin-right: 12px;
        }
        #validate-btn:hover { opacity: 0.85; }
        #validate-btn:disabled { opacity: 0.5; cursor: default; }
        .correct-reveal  { background-color: var(--reveal-ok-bg) !important; border: 2px solid var(--success) !important; color: var(--reveal-ok-fg) !important; }
        .correct-reveal .option-text, .incorrect-reveal .option-text { color: inherit; }
        .incorrect-reveal{ background-color: var(--reveal-bad-bg) !important; border: 2px solid var(--error) !important; color: var(--reveal-bad-fg) !important; }
        .dynamic-explanation-box {
            background-color: var(--light-gray); border-left: 4px solid var(--primary);
            padding: 16px; margin-top: 20px; margin-bottom: 20px;
            border-radius: 0 8px 8px 0; box-shadow: 0 1px 3px var(--shadow);
        }
        .dynamic-explanation-box h4 { font-size: 1rem; color: var(--dark); margin-bottom: 6px; font-weight: 700; }
        .dynamic-explanation-box p { font-size: 0.92rem; color: var(--dark-gray); line-height: 1.5; margin: 0; }
        .btn-final { background-color: var(--dark) !important; color: var(--white) !important; }
        .btn-danger-outline { width: 100%; border-color: var(--error); color: var(--error); }
        .question-text { white-space: pre-line; }

        .header-controls { display: flex; align-items: center; gap: 10px; }
        .icon-btn {
            min-width: 40px; height: 36px; padding: 0 10px; border-radius: 6px;
            border: 1px solid var(--border); background: var(--white); color: var(--dark);
            font-size: 0.85rem; font-weight: 700; cursor: pointer;
        }
        .icon-btn:hover { border-color: var(--primary); color: var(--primary); }

        .exam-card {
            display: block; padding: 14px 16px; margin-bottom: 10px;
            border: 1px solid var(--border); border-radius: 8px;
            text-decoration: none; color: var(--dark); background: var(--white);
        }
        .exam-card:hover, .exam-card.current { border-color: var(--primary); }
        .exam-card-title { font-weight: 700; color: var(--primary); }
        .exam-card-desc { font-size: 0.9rem; color: var(--gray); margin-top: 4px; }
        .exam-switcher { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
        .exam-switcher-label { font-weight: 600; font-size: 0.9rem; color: var(--gray); }
        .exam-chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .exam-chip {
            padding: 6px 14px; border-radius: 999px; font-size: 0.85rem; font-weight: 600;
            border: 1px solid var(--border); color: var(--dark-gray); text-decoration: none; background: var(--white);
        }
        .exam-chip:hover { border-color: var(--primary); color: var(--primary); }
        .exam-chip.current { background: var(--primary); border-color: var(--primary); color: var(--on-accent); }

        .topic-total { background-color: var(--primary-light); border-radius: 6px; border-bottom: none; margin-bottom: 10px; }
        .review-option { margin: 6px 0; }
        .review-correct { color: var(--success); font-weight: 600; background-color: var(--success-light); border-radius: 4px; padding: 2px 6px; }
        .review-wrong { color: var(--error); font-weight: 600; background-color: var(--error-light); border-radius: 4px; padding: 2px 6px; }
    


/* ===== Engine v2 components ===== */
.skip-link { position: absolute; left: -999px; top: 8px; background: var(--primary); color: var(--on-accent); padding: 8px 14px; border-radius: 6px; z-index: 100; }
.skip-link:focus { left: 8px; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
button { font-family: inherit; }

/* Real inputs inside option cards: visually hidden, still focusable */
.option-input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; padding: 0; border: 0; }
.option-card { position: relative; }
.option-card:focus-within { outline: 3px solid var(--primary); outline-offset: 2px; }
.option-card.selected .option-text { color: var(--dark); }
.nav-grid-btn { padding: 0; font-family: inherit; color: var(--dark); background-color: var(--white); position: relative; }
.nav-grid-btn.flagged::after { content: "⚑"; position: absolute; top: -6px; right: -4px; font-size: 0.72rem; color: var(--warning); }
.nav-grid-btn.unanswered-hint { border-style: dashed; }

.card-title-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 16px; }
.btn-small { padding: 7px 14px; font-size: 0.85rem; border-radius: 6px; }
.btn-ghost { background: transparent; color: var(--primary); border: 1px solid var(--primary); font-weight: 600; cursor: pointer; }
.btn-ghost:hover { background: var(--primary-light); }
.btn:disabled { opacity: 0.5; cursor: default; }
.sessions-box { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-bottom: 18px; background: var(--white); }
.sessions-box h3 { font-size: 1rem; margin-bottom: 8px; }
.session-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--border); flex-wrap: wrap; }
.session-row:first-of-type { border-top: 0; }
.session-info { font-size: 0.9rem; color: var(--dark-gray); }
.checkbox-row { display: flex; align-items: center; gap: 8px; margin: 10px 0; }
.checkbox-row input { width: 18px; height: 18px; padding: 0; }
.checkbox-row label { margin: 0; font-weight: 500; }
.hint { font-size: 0.82rem; color: var(--gray); margin: 4px 0 10px; }
.mini-acc { display: inline-block; min-width: 46px; text-align: right; font-size: 0.78rem; color: var(--gray); margin-left: 8px; }
.topic-count-wrap { display: flex; align-items: center; }

/* Question area */
.question-actions { display: flex; align-items: center; gap: 8px; }
.flag-btn { border: 1px solid var(--border); background: var(--white); color: var(--gray); border-radius: 6px; padding: 4px 10px; font-size: 0.82rem; font-weight: 600; cursor: pointer; }
.flag-btn[aria-pressed="true"] { border-color: var(--warning); color: var(--warning); }
.note-box { margin: 0 0 18px; }
.note-box summary { cursor: pointer; font-size: 0.85rem; font-weight: 600; color: var(--gray); }
.note-box textarea { width: 100%; min-height: 70px; margin-top: 8px; padding: 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--white); color: var(--dark); font-size: 0.9rem; resize: vertical; }
.nav-controls { gap: 10px; flex-wrap: wrap; }
.nav-controls .spacer { flex: 1; }
.kbd-help { font-size: 0.78rem; color: var(--gray); margin-top: 14px; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 0.75rem; color: var(--gray); margin-bottom: 14px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; background: var(--white); border: 1px solid var(--border); }
.legend .lg-answered::before { background: var(--dark); border-color: var(--dark); }
.legend .lg-flagged::before { content: "⚑"; width: auto; height: auto; border: 0; background: none; color: var(--warning); }
.type-hint { font-size: 0.85rem; color: var(--gray); margin-bottom: 10px; }

/* Ordering / matching / numeric / scenario */
.ordering-list { list-style: none; display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
.ordering-row { display: flex; align-items: center; gap: 12px; border: 1px solid var(--border); border-radius: 6px; padding: 10px 14px; background: var(--white); }
.order-pos { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--border); display: inline-flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; color: var(--gray); flex-shrink: 0; }
.order-text { flex: 1; font-size: 0.95rem; }
.order-btns { display: flex; gap: 6px; }
.mini-btn { width: 32px; height: 32px; border: 1px solid var(--border); border-radius: 6px; background: var(--white); color: var(--dark); cursor: pointer; font-size: 1rem; }
.mini-btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
.mini-btn:disabled { opacity: 0.35; cursor: default; }
.row-ok { border-color: var(--success) !important; background: var(--success-light); }
.row-bad { border-color: var(--error) !important; background: var(--error-light); }
.match-row { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 8px; flex-wrap: wrap; background: var(--white); }
.match-left { flex: 1 1 200px; font-weight: 600; font-size: 0.95rem; }
.match-select { flex: 1 1 220px; width: auto; }
.match-correct { flex-basis: 100%; font-size: 0.85rem; color: var(--success); font-weight: 600; }
.numeric-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.numeric-input { max-width: 220px; font-size: 1.1rem; }
.numeric-unit { color: var(--gray); font-weight: 600; }
.scenario-context { background: var(--light-gray); border-left: 4px solid var(--primary); padding: 14px 16px; border-radius: 0 8px 8px 0; margin-bottom: 18px; white-space: pre-line; font-size: 0.95rem; }
.scenario-part { margin-bottom: 22px; }
.scenario-part-title { font-size: 1rem; margin-bottom: 10px; white-space: pre-line; }
.part-expl { font-size: 0.88rem; color: var(--dark-gray); margin-top: 6px; }
.review-options .type-hint { margin: 8px 0 2px; }

/* Review before finishing */
.review-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 8px; margin: 16px 0; }
.review-block { margin: 14px 0; }
.review-block h3 { font-size: 1rem; margin-bottom: 8px; }
.pill-list { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { border: 1px solid var(--border); background: var(--white); color: var(--dark); border-radius: 999px; padding: 4px 12px; font-size: 0.82rem; font-weight: 600; cursor: pointer; }
.pill:hover { border-color: var(--primary); color: var(--primary); }
.review-item-card .meta { font-size: 0.78rem; color: var(--gray); margin-bottom: 6px; }
.review-item-card.is-unanswered { border-left: 5px solid var(--warning); }
.is-unanswered .review-status-badge { background-color: var(--light-gray); color: var(--warning); }

/* Statistics */

App.util.shuffle = function (arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
};

App.util.sameSet = function (a, b) {
    const x = [...a].sort((p, q) => p - q), y = [...b].sort((p, q) => p - q);
    return x.length === y.length && x.every((v, i) => v === y[i]);
};

App.util.clone = o => JSON.parse(JSON.stringify(o));
App.util.uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
App.util.clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));
App.util.isObj = v => v !== null && typeof v === 'object' && !Array.isArray(v);

// Builds a DOM element. Text always goes through textContent (never innerHTML).
App.util.el = function (tag, props, ...children) {
    const node = document.createElement(tag);
    Object.entries(props || {}).forEach(([k, v]) => {
        if (v === undefined || v === null) return;
        if (k === 'text') node.textContent = v;
        else if (k === 'style') node.style.cssText = v;
        else if (k === 'class') node.className = v;
        else if (k === 'dataset') Object.entries(v).forEach(([dk, dv]) => { node.dataset[dk] = dv; });
        else if (k === 'aria') Object.entries(v).forEach(([ak, av]) => node.setAttribute('aria-' + ak, av));
        else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
        else node[k] = v;
    });
    children.flat().forEach(c => { if (c) node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return node;
};

// Tiny event bus: App.events.on('answer', fn) ... App.events.emit('answer', payload)
App.events = (function () {
    const handlers = {};
    return {
        on(name, fn) { (handlers[name] = handlers[name] || []).push(fn); return () => this.off(name, fn); },
        off(name, fn) { handlers[name] = (handlers[name] || []).filter(h => h !== fn); },
        emit(name, payload) {
            (handlers[name] || []).slice().forEach(fn => {
                try { fn(payload); } catch (e) { if (typeof console !== 'undefined') console.error('[ExamSim] handler error for "' + name + '":', e); }
            });
        }
    };
