        },
        validateDef(def, path, rep) {
            if (!Array.isArray(def.items) || def.items.length < 2 || def.items.length > 10) { rep.error(path + '.items', 'must list 2 to 10 items in the CORRECT order'); return; }
            def.items.forEach((o, i) => { if (!App.util.isLoc(o)) rep.error(path + '.items[' + i + ']', 'must be a non-empty string or {en,it} object'); });
        }
    });

    // ---- matching ------------------------------------------------------------------------
    App.registerType('matching', {
        prepare(def, ctx) {
            const item = baseItem(def, ctx);
            item.lefts = def.pairs.map(p => p.left);
            item.rights = def.pairs.map(p => p.right);
            item.rightOrder = shuffle([...Array(def.pairs.length).keys()]);
            return item;
        },
        hasAnswer: (it, v) => Array.isArray(v) && v.some(x => x >= 0),
        isCorrect: (it, v) => Array.isArray(v) && v.length === it.lefts.length && v.every((x, i) => x === i),
        fraction(it, v, cfg) {
            if (!Array.isArray(v)) return 0;
            const ok = v.filter((x, i) => x === i).length;
            if (ok === it.lefts.length) return 1;
            return cfg && cfg.partialCredit ? ok / it.lefts.length : 0;
        },
        render(ctx) {
            const { item, onChange, locked, reveal } = ctx;
            const val = Array.isArray(ctx.value) ? [...ctx.value] : item.lefts.map(() => -1);
            const wrap = el('div', { class: 'matching' }, el('p', { class: 'type-hint', text: App.t('hintMatching') }));
            item.lefts.forEach((left, i) => {
                const sel = el('select', { class: 'match-select', disabled: !!locked, aria: { label: App.rich.plain(App.loc(left)) } });
                sel.appendChild(el('option', { value: '-1', text: App.t('chooseOne') }));
                item.rightOrder.forEach(r => sel.appendChild(el('option', { value: String(r), text: App.rich.plain(App.loc(item.rights[r])) })));
                sel.value = String(val[i]);
                sel.addEventListener('change', () => { val[i] = parseInt(sel.value, 10); onChange([...val], { silent: true }); });
                let cls = 'match-row';
                if (reveal) cls += val[i] === i ? ' row-ok' : ' row-bad';
                const row = el('div', { class: cls }, el('span', { class: 'match-left' }, App.rich.inline(App.loc(left))), sel);
                if (reveal && val[i] !== i) row.appendChild(el('span', { class: 'match-correct', text: '→ ' + App.rich.plain(App.loc(item.rights[i])) }));
                wrap.appendChild(row);
            });
            return wrap;
        },
        renderReview(item, value) {
            const v = Array.isArray(value) ? value : [];
            const box = el('div', { class: 'review-options' });
            item.lefts.forEach((left, i) => {
                const ok = v[i] === i;
                const chosen = v[i] >= 0 && v[i] !== undefined ? App.rich.plain(App.loc(item.rights[v[i]])) : '—';
                box.appendChild(el('p', { class: 'review-option ' + (ok ? 'review-correct' : 'review-wrong') },
                    el('strong', {}, App.rich.inline(App.loc(left)), ' → '), ok ? chosen : chosen + '  (' + App.t('correctAnswer') + ': ' + App.rich.plain(App.loc(item.rights[i])) + ')'));
            });
            return box;
        },
        validateDef(def, path, rep) {
            if (!Array.isArray(def.pairs) || def.pairs.length < 2 || def.pairs.length > 8) { rep.error(path + '.pairs', 'must be a list of 2 to 8 {left, right} pairs'); return; }
            def.pairs.forEach((p, i) => {
                if (!p || !App.util.isLoc(p.left) || !App.util.isLoc(p.right)) rep.error(path + '.pairs[' + i + ']', 'needs non-empty "left" and "right"');
            });
        }
    });

    // ---- numeric -------------------------------------------------------------------------
    function numAnswer(def) {
        const a = isObj(def.answer) ? def.answer : { value: def.answer };
        return { value: Number(a.value), tolerance: Number(a.tolerance || 0), unit: a.unit || def.unit || '' };
    }
    function parseNum(s) {
        const n = parseFloat(String(s).trim().replace(/\s/g, '').replace(',', '.'));
        return isNaN(n) ? null : n;
    }
    App.registerType('numeric', {
        prepare(def, ctx) { const item = baseItem(def, ctx); item.numeric = numAnswer(def); return item; },
        hasAnswer: (it, v) => typeof v === 'string' && v.trim().length > 0,
        isCorrect(it, v) {
            const n = parseNum(v === undefined ? '' : v);
            return n !== null && Math.abs(n - it.numeric.value) <= it.numeric.tolerance + 1e-12;
        },
        render(ctx) {
            const { item, value, onChange, locked, reveal } = ctx;
            const input = el('input', { type: 'text', class: 'numeric-input', inputMode: 'decimal', autocomplete: 'off', value: value || '', disabled: !!locked, aria: { label: App.t('hintNumeric') } });
            input.addEventListener('input', () => onChange(input.value, { silent: true }));
            const wrap = el('div', { class: 'numeric' }, el('p', { class: 'type-hint', text: App.t('hintNumeric') }),
                el('div', { class: 'numeric-row' }, input, item.numeric.unit ? el('span', { class: 'numeric-unit', text: item.numeric.unit }) : null));
            if (reveal) {
                const ok = App.types.numeric.isCorrect(item, value);
                input.classList.add(ok ? 'row-ok' : 'row-bad');
                wrap.appendChild(el('p', { class: 'review-option review-correct', text: App.t('correctAnswer') + ': ' + item.numeric.value + (item.numeric.tolerance ? ' (±' + item.numeric.tolerance + ')' : '') + (item.numeric.unit ? ' ' + item.numeric.unit : '') }));
            }
            return wrap;
        },
        renderReview(item, value) {
            const ok = App.types.numeric.isCorrect(item, value);
            return el('div', { class: 'review-options' },
                el('p', { class: 'review-option ' + (ok ? 'review-correct' : 'review-wrong'), text: App.t('yourAnswer') + ': ' + (value || '—') }),
                el('p', { class: 'review-option review-correct', text: App.t('correctAnswer') + ': ' + item.numeric.value + (item.numeric.tolerance ? ' (±' + item.numeric.tolerance + ')' : '') + (item.numeric.unit ? ' ' + item.numeric.unit : '') }));
        },
        validateDef(def, path, rep) {
            const a = numAnswer(def);
            if (!isFinite(a.value)) rep.error(path + '.answer', 'must be a number or {value, tolerance, unit}');
            if (!isFinite(a.tolerance) || a.tolerance < 0) rep.error(path + '.answer.tolerance', 'must be a non-negative number');
        }
    });

    // ---- scenario (one context, several sub-questions; correct only if all parts are) ----
    App.registerType('scenario', {
        prepare(def, ctx) {
            const item = baseItem(def, ctx);
            item.context = def.context;
            item.parts = def.parts.map(p => prepareAny(Object.assign({ topic: def.topic, uid: (def.uid !== undefined ? def.uid : def.id) + '#p' }, p), ctx));
            return item;
        },
        hasAnswer: (it, v) => Array.isArray(v) && it.parts.some((p, i) => App.types[p.kind].hasAnswer(p, v[i])),
        isCorrect: (it, v) => Array.isArray(v) && it.parts.every((p, i) => App.types[p.kind].isCorrect(p, v[i])),
        fraction(it, v, cfg) {
            if (!Array.isArray(v)) return 0;
            if (it.parts.every((p, i) => App.types[p.kind].isCorrect(p, v[i]))) return 1;
            if (!cfg || !cfg.partialCredit) return 0;
            const sum = it.parts.reduce((a, p, i) => a + App.fractionOf(p, v[i], cfg), 0);
            return sum / it.parts.length;
        },
        render(ctx) {
            const { item, onChange, locked, reveal, uid } = ctx;
            const val = Array.isArray(ctx.value) ? [...ctx.value] : item.parts.map(() => undefined);
            const wrap = el('div', { class: 'scenario' });
            if (item.context) wrap.appendChild(el('div', { class: 'scenario-context' }, App.rich.node(App.loc(item.context))));
            item.parts.forEach((part, i) => {
                const h = App.types[part.kind];
                const box = el('div', { class: 'scenario-part' },
                    el('h4', { class: 'scenario-part-title' }, App.t('sub', { n: i + 1 }) + ' — ', App.rich.inline(App.loc(part.text))),
                    h.render({
                        item: part, value: val[i], locked, reveal, uid: uid + '-p' + i,
                        onChange: (v, o) => { val[i] = v; onChange([...val], { silent: true }); }
                    }));
                if (reveal && part.explanation) box.appendChild(el('div', { class: 'part-expl' }, App.rich.node(App.loc(part.explanation))));
                wrap.appendChild(box);
            });
            return wrap;
        },
        renderReview(item, value) {
            const v = Array.isArray(value) ? value : [];
            const wrap = el('div', { class: 'scenario' });
            if (item.context) wrap.appendChild(el('div', { class: 'scenario-context' }, App.rich.node(App.loc(item.context))));
            item.parts.forEach((part, i) => {
                wrap.appendChild(el('h4', { class: 'scenario-part-title' }, App.t('sub', { n: i + 1 }) + ' — ', App.rich.inline(App.loc(part.text))));
                wrap.appendChild(App.types[part.kind].renderReview(part, v[i]));
            });
            return wrap;
        },
        validateDef(def, path, rep) {
            if (!Array.isArray(def.parts) || def.parts.length < 2) { rep.error(path + '.parts', 'a scenario needs at least 2 parts'); return; }
            if (def.context !== undefined && !App.util.isLoc(def.context)) rep.error(path + '.context', 'must be a non-empty string or {en,it} object');
            def.parts.forEach((p, i) => {
                const t = App.questionType(p);
                const pp = path + '.parts[' + i + ']';
                if (t === 'scenario') { rep.error(pp, 'scenarios cannot be nested'); return; }
                if (!App.types[t]) { rep.error(pp + '.type', 'unknown question type "' + t + '"'); return; }
                if (!App.util.isLoc(textOf(p))) rep.error(pp + '.text', 'is required');
                if (App.types[t].validateDef) App.types[t].validateDef(p, pp, rep);
            });
        }
    });
})();

/* Exam format v2: validation, legacy conversion, normalization, quality lint. */
(function () {
    const { isObj, isLoc } = App.util;
    const RESERVED_MODES = ['all', 'review', 'mistakes', 'flagged', 'unseen', 'topic', 'difficulty'];
    const SELECTIONS = ['random', 'balanced', 'weighted'];
    const textOf = d => d.text !== undefined ? d.text : d.question;

    function newReport() {
        const r = { errors: [], warnings: [] };
        r.error = (path, message) => r.errors.push({ path, message });
        r.warn = (path, message) => r.warnings.push({ path, message });
        r.ok = () => r.errors.length === 0;
        r.format = () => r.errors.map(e => '  ✗ ' + e.path + ': ' + e.message).concat(r.warnings.map(w => '  ! ' + w.path + ': ' + w.message)).join('\n');
        return r;
    }

    function stripLetter(s) { return String(s).replace(/^\s*[A-Fa-f][)\.]\s+/, ''); }

    // Legacy shape: { config: {...}, questions: [{id, topic, question, options:["A) ..."], answer:[i], explanation}] }
    function fromLegacy(data, fileId) {
        const c = data.config || {};
        const modes = [];
        const n = (data.questions || []).length;
        if (c.mockStandardCount) modes.push({ id: 'standard', name: { en: 'Standard mock exam', it: 'Simulazione standard' }, selection: 'balanced', count: Math.min(c.mockStandardCount, n) });
        if (c.mockOfficialCount) {
            modes.push({
                id: 'official', name: { en: 'Official exam simulation', it: 'Simulazione esame ufficiale' }, selection: 'weighted', exam: true,
                count: Math.min(c.mockOfficialCount, n), timeSec: c.mockOfficialTimeSec, passThreshold: c.passThresholdMockOfficial,
                groups: (c.macroGroups || []).map(g => ({ topics: g.topics, weight: g.weight }))
            });
        }
        return {
            format: 2, id: fileId || String(c.examCode || 'exam').toLowerCase(), code: c.examCode,
            title: c.examTitle || c.examCode, description: c.subtitle, version: c.version,
            settings: { passThreshold: c.passThresholdDefault, timePerQuestionSec: c.timePerQuestionSec },
            modes,
            questions: (data.questions || []).map(q => {
                const out = { id: q.id, topic: q.topic, text: q.question, options: (q.options || []).map(stripLetter), answer: q.answer, explanation: q.explanation };
                if (q.shuffle === false) out.shuffle = false;
                const a = Array.isArray(q.answer) ? q.answer : [q.answer];
                out.type = a.length > 1 ? 'multiple' : 'single';
                return out;
            })
        };
    }

    // Warns about images that will not be shown (unsafe source) or that make the file very large.
    function eachString(v, fn, path) {
        if (typeof v === 'string') fn(v, path);
        else if (Array.isArray(v)) v.forEach((x, i) => eachString(x, fn, path + '[' + i + ']'));
        else if (isObj(v)) Object.keys(v).forEach(k => eachString(v[k], fn, path + '.' + k));
    }
    function richCheck(q, label, rep) {
        const fields = { text: q.text !== undefined ? q.text : q.question, options: q.options, explanation: q.explanation, context: q.context, items: q.items, pairs: q.pairs, parts: q.parts };
        eachString(fields, (str, path) => {
            const re = /!\[[^\]\n]*\]\(([^)\s]+)/g;
            let m;
            while ((m = re.exec(str))) {
                if (!App.rich.SAFE_IMG.test(m[1])) rep.warn(label + '.' + path, 'image source is not allowed and will not be shown (use data:image/…;base64, https:// or a relative .png/.jpg/.webp/.gif/.svg path)');
                else if (m[1].length > 400000) rep.warn(label + '.' + path, 'embedded image is very large (' + Math.round(m[1].length / 1024) + ' KB) — consider shrinking it');

    }

        if (typeof exam.id !== 'string' || !/^[\w.\-]+$/.test(exam.id)) rep.error('id', 'must be a short identifier (letters, digits, "-", "_", ".")');
        if (!isLoc(exam.title)) rep.error('title', 'is required (string or {en,it})');

            const uid = q.uid !== undefined ? String(q.uid) : String(q.id);

            if (q.tags !== undefined && !(Array.isArray(q.tags) && q.tags.every(t => typeof t === 'string'))) rep.error(label + '.tags', 'must be a list of strings');

                    if (!isObj(m)) { rep.error(p, 'must be an object'); return; }

                    else if (RESERVED_MODES.includes(m.id)) rep.error(p + '.id', '"' + m.id + '" is reserved for a built-in mode');
                    else if (ids.has(m.id)) rep.error(p + '.id', 'duplicate mode id "' + m.id + '"'); else ids.add(m.id);
                    if (!isLoc(m.name)) rep.error(p + '.name', 'is required (string or {en,it})');
                    if (m.selection !== undefined && !SELECTIONS.includes(m.selection)) rep.error(p + '.selection', 'must be one of ' + SELECTIONS.join(', '));
                    if (m.count !== undefined && !(Number.isInteger(m.count) && m.count > 0)) rep.error(p + '.count', 'must be a positive integer');
                    if (m.count > qs.length) rep.warn(p + '.count', 'is larger than the number of questions (' + qs.length + ')');
                    if (m.timeSec !== undefined && !(m.timeSec >= 0)) rep.error(p + '.timeSec', 'must be >= 0');
                    if (m.passThreshold !== undefined && !(m.passThreshold >= 0 && m.passThreshold <= 100)) rep.error(p + '.passThreshold', 'must be between 0 and 100');
                    checkScoring(m.scoring, p + '.scoring', rep);

                    if (m.strictTime !== undefined && typeof m.strictTime !== 'boolean') rep.error(p + '.strictTime', 'must be true or false');

                        else {

                                if (!isObj(g) || !Array.isArray(g.topics) || !g.topics.length) { rep.error(gp + '.topics', 'must be a non-empty list of topics'); return; }
                                g.topics.forEach(t => { if (!topicsSeen.has(t)) rep.error(gp + '.topics', 'unknown topic "' + t + '"'); });
                                if (!(Number.isInteger(g.weight) && g.weight > 0)) rep.error(gp + '.weight', 'must be a positive integer'); else sum += g.weight;
                            });
                            if (m.count && sum !== m.count) rep.warn(p + '.groups', 'weights sum to ' + sum + ' but count is ' + m.count);
                        }
                    }
                });
            }
        }
        return rep;
    }

    // Fills defaults and derived fields. Input must already be valid.
    function normalize(raw, fileId) {
        const exam = App.util.clone(raw);
        exam.id = exam.id || fileId;
        exam.settings = Object.assign({ passThreshold: 70, timePerQuestionSec: 90, shuffleOptions: true }, exam.settings || {});
        Object.keys(exam.settings).forEach(k => { if (exam.settings[k] === undefined) delete exam.settings[k]; });
        exam.settings = Object.assign({ passThreshold: 70, timePerQuestionSec: 90, shuffleOptions: true }, exam.settings);
        exam.questions.forEach(q => {
            if (q.text === undefined) q.text = q.question;
            delete q.question;
            q.uid = q.uid !== undefined ? String(q.uid) : String(q.id);
            q.type = App.questionType(q);
        });
        exam.topicList = [];
        exam.questions.forEach(q => { if (!exam.topicList.includes(q.topic)) exam.topicList.push(q.topic); });
        exam.hasDifficulty = exam.questions.some(q => q.difficulty);
        if (!Array.isArray(exam.modes) || !exam.modes.length) {
            exam.modes = [{ id: 'standard', name: { en: 'Standard mock exam', it: 'Simulazione standard' }, selection: 'balanced', count: Math.min(20, exam.questions.length) }];
        }
        exam.modes.forEach(m => { m.selection = m.selection || 'random'; });
        return exam;
    }

    // Accepts v2 or legacy data. Returns {exam, report}; exam is null when invalid.
    function prepare(data, fileId) {
        let raw = data;
        if (isObj(data) && data.format === undefined && (data.config || data.questions)) raw = fromLegacy(data, fileId);
        if (isObj(raw) && raw.id === undefined && fileId) raw = Object.assign({}, raw, { id: fileId });
        const report = validate(raw);
        return { exam: report.ok() ? normalize(raw, fileId) : null, report };
    }

    // Content-quality hints for single-answer questions (used by the validator CLI).
    function lint(exam) {
        const out = [];
        const singles = exam.questions.filter(q => App.questionType(q) === 'single' && Array.isArray(q.options));
        if (singles.length >= 10) {
            const pos = [0, 0, 0, 0, 0, 0];
            let longest = 0;
            singles.forEach(q => {
                const a = Array.isArray(q.answer) ? q.answer[0] : q.answer;
                pos[a]++;
                const lens = q.options.map(o => App.loc(o).length);
                if (lens[a] === Math.max(...lens) && lens.filter(l => l === lens[a]).length === 1) longest++;
            });
            const n = singles.length;
            const worst = Math.max(...pos);
            if (worst / n > 0.4) out.push('correct answer is always in position ' + 'ABCDEF'[pos.indexOf(worst)] + ' (' + Math.round(100 * worst / n) + '%) — fine if options are shuffled at runtime');
            if (longest / n > 0.45) out.push('the correct answer is the single longest option in ' + Math.round(100 * longest / n) + '% of single-answer questions');
        }
        return out;
    }

    App.schema = { validate, fromLegacy, normalize, prepare, lint, newReport };
})();

/* Scoring rules: partial credit, negative marking, mandatory questions.
   Rules can be set per exam (settings.scoring), per mode (modes[].scoring) and, for practice modes, in the options page. */
App.scoring = (function () {
    const DEFAULTS = { partialCredit: false, wrongPenalty: 0, unansweredPenalty: 0 };

    function clean(c) {
        const out = {};
        if (!c) return out;
        if (typeof c.partialCredit === 'boolean') out.partialCredit = c.partialCredit;
        if (typeof c.wrongPenalty === 'number' && c.wrongPenalty >= 0) out.wrongPenalty = c.wrongPenalty;
        if (typeof c.unansweredPenalty === 'number' && c.unansweredPenalty >= 0) out.unansweredPenalty = c.unansweredPenalty;
        return out;
    }

    // Effective rules: built-in defaults < user preference (practice modes only) < exam settings < mode.
    function resolve(exam, modeDef, userPref) {
        const examLevel = clean(exam && exam.settings && exam.settings.scoring);
        const modeLevel = clean(modeDef && modeDef.scoring);
        const explicit = Object.keys(examLevel).length || Object.keys(modeLevel).length;
        const useUser = !(modeDef && modeDef.exam) && !explicit;      // exam-defined exam modes keep the exam's own rules
        return Object.assign({}, DEFAULTS, useUser ? clean(userPref) : {}, examLevel, modeLevel);
    }

    // Scores a list of {item, value} pairs.
    function score(items, values, cfg) {
        cfg = Object.assign({}, DEFAULTS, cfg || {});
        let got = 0, max = 0, fully = 0, partial = 0, wrong = 0, unanswered = 0;
        const mandatoryFailed = [];
        const details = items.map((item, i) => {
            const pts = typeof item.points === 'number' && item.points > 0 ? item.points : 1;
            max += pts;
            const answered = App.types[item.kind].hasAnswer(item, values[i]);
            const frac = answered ? App.fractionOf(item, values[i], cfg) : 0;
            let delta = pts * frac;
            if (!answered) { unanswered++; delta -= cfg.unansweredPenalty * pts; }
            else if (frac >= 1) fully++;
            else if (frac > 0) partial++;
            else { wrong++; delta -= cfg.wrongPenalty * pts; }
            got += delta;
            if (item.mandatory && frac < 1) mandatoryFailed.push(i);
            return { frac, points: pts, delta, answered };
        });
        const total = Math.max(0, got);
        return {
            score: Math.round(total * 100) / 100, max, pct: max ? Math.round(100 * total / max) : 0,
            fully, partial, wrong, unanswered, mandatoryFailed, details, cfg,
            custom: cfg.partialCredit || cfg.wrongPenalty > 0 || cfg.unansweredPenalty > 0 || items.some(it => typeof it.points === 'number' && it.points !== 1)
        };
    }

    return { DEFAULTS, clean, resolve, score };
})();

/* Exam-taking rules: how many pauses are allowed and whether the clock keeps running while you are away.
   Free navigation between questions is never restricted. */
App.examRules = {
    resolve(exam, modeDef, userPref) {
        const isExam = !!(modeDef && modeDef.exam);
        if (!isExam) return { pauses: null, strictTime: false };
        const pick = (k, dflt) => modeDef[k] !== undefined ? modeDef[k] : (exam.settings && exam.settings[k] !== undefined ? exam.settings[k] : (userPref && userPref[k] !== undefined ? userPref[k] : dflt));
        const pauses = pick('pauses', null);
        return { pauses: (pauses === null || pauses === undefined || pauses === '') ? null : Number(pauses), strictTime: !!pick('strictTime', false) };
    }
};

/* Versioned local storage: preferences, in-progress sessions, attempt history, per-question stats.
   Everything lives under one key ("examsim:v2") so it can be exported/imported as a single file. */
App.memoryBackend = function () {
    const m = {};
    return { getItem: k => (k in m ? m[k] : null), setItem: (k, v) => { m[k] = String(v); }, removeItem: k => { delete m[k]; } };
};

App.defaultBackend = function () {
    try {
        const ls = window.localStorage;
        const k = '__examsim_probe__';
        ls.setItem(k, '1'); ls.removeItem(k);
        return ls;
    } catch (e) { return App.memoryBackend(); }
};

App.createStorage = function (backend) {
    const KEY = 'examsim:v2';
    const MAX_ATTEMPTS = 500, MAX_SESSIONS = 10;
    let db = null;

    const empty = () => ({ v: 2, prefs: {}, exams: {} });

    function migrate(data) {
        if (!data || typeof data !== 'object') return empty();
        // Future versions: add `if (data.v < 3) {...}` steps here.
        if (!data.prefs) data.prefs = {};
        if (!data.exams) data.exams = {};
        data.v = 2;
        return data;
    }

    function load() {
        let raw = null;
        try { raw = backend.getItem(KEY); } catch (e) { raw = null; }
        try { db = migrate(raw ? JSON.parse(raw) : null); } catch (e) { db = empty(); }
        return db;
    }
    function ensure() { return db || load(); }

    function save() {
        try { backend.setItem(KEY, JSON.stringify(ensure())); return true; }
        catch (e) { App.events.emit('storageError', e); return false; }
    }

    function bucket(examId) {
        const d = ensure();
        if (!d.exams[examId]) d.exams[examId] = { attempts: [], sessions: {}, qstats: {} };
        return d.exams[examId];
    }

    const api = {
        reload: load,
        raw: () => ensure(),

        // ---- preferences (falls back to the keys used by earlier versions) ----
        getPref(k) {
            const v = ensure().prefs[k];
            if (v !== undefined) return v;
            try { const old = backend.getItem('exam_' + k); return old === null ? undefined : old; } catch (e) { return undefined; }
        },
        setPref(k, v) { ensure().prefs[k] = v; return save(); },

        // ---- sessions in progress ----
        saveSession(examId, session) {
            const b = bucket(examId);
            session.updatedAt = Date.now();
            b.sessions[session.id] = session;
            const ids = Object.keys(b.sessions).sort((x, y) => b.sessions[y].updatedAt - b.sessions[x].updatedAt);
            ids.slice(MAX_SESSIONS).forEach(id => delete b.sessions[id]);
            return save();
        },
        getSession(examId, id) { return bucket(examId).sessions[id] || null; },
        listSessions(examId) {
            const s = bucket(examId).sessions;
            return Object.keys(s).map(k => s[k]).sort((a, b) => b.updatedAt - a.updatedAt);
        },
        deleteSession(examId, id) { delete bucket(examId).sessions[id]; return save(); },

        // ---- attempts ----
        addAttempt(examId, attempt) {
            const b = bucket(examId);
            b.attempts.push(attempt);
            if (b.attempts.length > MAX_ATTEMPTS) b.attempts.splice(0, b.attempts.length - MAX_ATTEMPTS);
            return save();
        },
        listAttempts(examId) { return bucket(examId).attempts.slice(); },

        // ---- per-question stats / flags / notes ----
        getQStat(examId, uid) { return bucket(examId).qstats[uid] || null; },
        allQStats(examId) { return bucket(examId).qstats; },
        patchQStat(examId, uid, fn) {
            const b = bucket(examId);
            const cur = b.qstats[uid] || { seen: 0, correct: 0, wrong: 0, box: 0, due: 0, last: 0, lastOk: null, time: 0, flag: false, note: '' };
            const next = fn(cur) || cur;
            b.qstats[uid] = next;
            return save();
        },

        // ---- maintenance ----
        clearExam(examId) { delete ensure().exams[examId]; return save(); },
        examIds() { return Object.keys(ensure().exams); },

        exportData(examIds) {
            const d = ensure();
            const out = { app: 'examsim', v: 2, exportedAt: new Date().toISOString(), prefs: d.prefs, exams: {} };
            (examIds || Object.keys(d.exams)).forEach(id => { if (d.exams[id]) out.exams[id] = d.exams[id]; });
            return out;
        },

        // Merges an exported file into the current data. Returns {attempts, qstats} counts or throws.
        importData(obj) {
            if (!obj || obj.app !== 'examsim' || typeof obj.exams !== 'object') throw new Error('not an ExamSim export file');
            if (obj.v > 2) throw new Error('export was made by a newer version (v' + obj.v + ')');
            let attempts = 0, qstats = 0;
            Object.keys(obj.exams).forEach(id => {
                const src = obj.exams[id] || {};
                const b = bucket(id);
                const known = new Set(b.attempts.map(a => a.id));
                (src.attempts || []).forEach(a => { if (a && a.id && !known.has(a.id)) { b.attempts.push(a); attempts++; } });
                b.attempts.sort((x, y) => x.ts - y.ts);
                Object.keys(src.qstats || {}).forEach(uid => {
                    const inc = src.qstats[uid], cur = b.qstats[uid];
                    if (!cur || (inc.last || 0) > (cur.last || 0)) {
                        // keep user-authored data if the winner lacks it
                        const merged = Object.assign({}, inc);
                        if (cur) { merged.note = inc.note || cur.note || ''; merged.flag = inc.flag || cur.flag || false; }
                        b.qstats[uid] = merged; qstats++;
                    } else if (inc.note && !cur.note) { cur.note = inc.note; }
                });
                Object.keys(src.sessions || {}).forEach(sid => { if (!b.sessions[sid]) b.sessions[sid] = src.sessions[sid]; });
            });
            save();
            return { attempts, qstats };
        }
    };
    return api;
};

App.storage = App.createStorage(App.defaultBackend());

/* Study modes and spaced repetition (Leitner boxes). Pure logic, no DOM. */
(function () {
    const { shuffle } = App.util;
    const DAY = 86400000;
    const INTERVAL_DAYS = [0, 1, 3, 7, 21];   // wait before a question is due again, per box
    const MAX_BOX = INTERVAL_DAYS.length - 1;

    App.srs = {
        DAY, INTERVAL_DAYS,
        update(stat, ok, sec, now) {
            const s = Object.assign({}, stat);
            s.seen = (s.seen || 0) + 1;
            if (ok) s.correct = (s.correct || 0) + 1; else s.wrong = (s.wrong || 0) + 1;
            s.box = ok ? Math.min((s.box || 0) + 1, MAX_BOX) : 0;
            s.due = now + INTERVAL_DAYS[s.box] * DAY;
            s.last = now;
            s.lastOk = !!ok;
            s.time = (s.time || 0) + (sec || 0);
            return s;
        },
        isDue: (stat, now) => !!stat && stat.seen > 0 && (stat.due || 0) <= now,
        isMastered: stat => !!stat && (stat.box || 0) >= 3
    };

    // Records one answer in the persistent per-question stats.
    App.recordAnswer = function (examId, uid, ok, sec, storage, now) {
        storage = storage || App.storage;
        now = now || Date.now();
        storage.patchQStat(examId, uid, cur => App.srs.update(cur, ok, sec, now));
        App.events.emit('answerRecorded', { examId, uid, ok });
    };

    function byTopic(questions) {
        const m = {};
        questions.forEach(q => (m[q.topic] = m[q.topic] || []).push(q));
        return m;
    }

    function balanced(questions, count) {
        const groups = byTopic(questions);
        const pool = Object.keys(groups).map(t => shuffle(groups[t])[0]);
        const used = new Set(pool.map(q => q.uid));
        pool.push(...shuffle(questions.filter(q => !used.has(q.uid))).slice(0, Math.max(0, count - pool.length)));
        return shuffle(pool).slice(0, count);
    }

    function weighted(questions, mode) {
        const groups = byTopic(questions);
        const pool = [], used = new Set();
        mode.groups.forEach(g => {
            let remaining = g.weight;
            for (let round = 0; remaining > 0 && round < 100; round++) {
                for (const topic of shuffle(g.topics)) {
                    if (remaining <= 0) break;
                    const q = shuffle((groups[topic] || []).filter(x => !used.has(x.uid)))[0];
                    if (!q) continue;
                    used.add(q.uid); pool.push(q); remaining--;
                }
                if (!g.topics.some(t => (groups[t] || []).some(x => !used.has(x.uid)))) break;
            }
        });
        const count = mode.count || pool.length;
        if (pool.length < count) pool.push(...shuffle(questions.filter(q => !used.has(q.uid))).slice(0, count - pool.length));
        return shuffle(pool).slice(0, count);
    }

    // Lists the modes offered for an exam. `stats` = per-question stats map, used to size the practice pools.
    App.modes = {
        list(exam, stats, now) {
            now = now || Date.now();
            stats = stats || {};
            const out = [];
            exam.modes.forEach(m => out.push({
                id: m.id, group: 'exam', label: m.name, defined: m, studyDefault: !m.exam,
                count: m.count, available: exam.questions.length
            }));
            out.push({ id: 'all', group: 'practice', labelKey: 'modeAll', labelParams: { n: exam.questions.length }, studyDefault: true, available: exam.questions.length });
            exam.topicList.forEach(t => out.push({
                id: 'topic:' + t, group: 'topic', labelKey: 'modeTopic', labelParams: { t: (exam.topics && exam.topics[t]) ? exam.topics[t] : t },
                studyDefault: true, available: exam.questions.filter(q => q.topic === t).length
            }));
            const poolSize = id => App.modes.pool(exam, id, stats, now).questions.length;
            ['review', 'mistakes', 'flagged', 'unseen'].forEach(id => out.push({
                id, group: 'practice', labelKey: { review: 'modeReview', mistakes: 'modeMistakes', flagged: 'modeFlagged', unseen: 'modeUnseen' }[id],
                studyDefault: true, available: poolSize(id), defaultCount: id === 'flagged' ? undefined : 20
            }));
            if (exam.hasDifficulty) [1, 2, 3].forEach(d => out.push({
                id: 'difficulty:' + d, group: 'practice', labelKey: 'modeDifficulty', labelParams: { d: App.t(['', 'diffEasy', 'diffMedium', 'diffHard'][d]) },
                studyDefault: true, available: exam.questions.filter(q => q.difficulty === d).length
            }));
            return out;
        },

        // All questions that belong to a practice mode (before applying the count).
        pool(exam, id, stats, now) {
            now = now || Date.now();
            stats = stats || {};
            const qs = exam.questions;
            if (id === 'all') return { questions: qs.slice() };
            if (id.startsWith('topic:')) return { questions: qs.filter(q => q.topic === id.slice(6)) };
            if (id.startsWith('difficulty:')) return { questions: qs.filter(q => q.difficulty === Number(id.slice(11))) };
            if (id === 'flagged') return { questions: qs.filter(q => stats[q.uid] && stats[q.uid].flag) };
            if (id === 'unseen') return { questions: qs.filter(q => !stats[q.uid] || !stats[q.uid].seen) };
            if (id === 'mistakes') {
                return { questions: qs.filter(q => { const s = stats[q.uid]; return s && s.seen && s.lastOk === false; }) };   // latest answer was wrong
            }
            if (id === 'review') {
                const seen = qs.filter(q => stats[q.uid] && stats[q.uid].seen);
                const due = seen.filter(q => App.srs.isDue(stats[q.uid], now)).sort((a, b) => (stats[a.uid].due || 0) - (stats[b.uid].due || 0));
                if (due.length) return { questions: due };
                const weakest = seen.slice().sort((a, b) => (stats[a.uid].box || 0) - (stats[b.uid].box || 0) || (stats[a.uid].due || 0) - (stats[b.uid].due || 0));
                return { questions: weakest, fallback: true };
            }
            if (App.modeBuilders[id]) return { questions: App.modeBuilders[id](exam, stats, now) };
            return { questions: [] };
        },

        // Picks the questions for a session. opts.count caps the number of questions.
        pick(exam, id, stats, opts) {
            opts = opts || {};
            const now = opts.now || Date.now();
            const defined = exam.modes.find(m => m.id === id);
            let qs, fallback = false;
            if (defined) {
                const count = opts.count || defined.count || exam.questions.length;
                if (defined.selection === 'weighted') qs = weighted(exam.questions, Object.assign({}, defined, { count }));
                else if (defined.selection === 'balanced') qs = balanced(exam.questions, count);
                else qs = shuffle(exam.questions).slice(0, count);
            } else {
                const p = App.modes.pool(exam, id, stats, now);
                fallback = !!p.fallback;
                qs = p.questions;
                const ordered = id === 'all' || id.startsWith('topic:');
                if (id === 'review' || id === 'mistakes') qs = shuffle(qs.slice(0, opts.count || 20));
                else if (ordered && (!opts.count || opts.count >= qs.length)) qs = qs.slice();   // whole pool: keep file order
                else qs = shuffle(qs).slice(0, opts.count || qs.length);
            }
            return { questions: qs, fallback };
        }
    };
})();

/* Statistics computed from attempts and per-question stats (exam-agnostic, no DOM). */
App.stats = {
    compute(exam, storage, now) {
        storage = storage || App.storage;
        now = now || Date.now();
        const attempts = storage.listAttempts(exam.id).sort((a, b) => a.ts - b.ts);
        const qstats = storage.allQStats(exam.id);
        const byUid = {};
        exam.questions.forEach(q => { byUid[q.uid] = q; });

        let answered = 0, correct = 0, time = 0, mastered = 0, seenQuestions = 0, flagged = 0;
        const topics = {};
        exam.topicList.forEach(t => { topics[t] = { topic: t, total: exam.questions.filter(q => q.topic === t).length, seen: 0, correct: 0, wrong: 0, mastered: 0, answeredQuestions: 0 }; });
        const hard = [];

        Object.keys(qstats).forEach(uid => {
            const q = byUid[uid], s = qstats[uid];
            if (!q || !s) return;
            if (s.flag) flagged++;
            if (!s.seen) return;
            answered += s.seen; correct += s.correct || 0; time += s.time || 0;
            seenQuestions++;
            if (App.srs.isMastered(s)) mastered++;
            const t = topics[q.topic];
            t.seen += s.seen; t.correct += s.correct || 0; t.wrong += s.wrong || 0; t.answeredQuestions++;
            if (App.srs.isMastered(s)) t.mastered++;
            if ((s.wrong || 0) > 0) hard.push({ uid, topic: q.topic, text: q.text, seen: s.seen, wrong: s.wrong, rate: s.wrong / s.seen, last: s.last });
        });

        hard.sort((a, b) => b.rate - a.rate || b.wrong - a.wrong || b.seen - a.seen);
        const topicList = Object.values(topics).map(t => Object.assign(t, { pct: t.seen ? Math.round(100 * t.correct / t.seen) : null }));
        const pcts = attempts.map(a => a.pct);

        return {
            attempts, attemptCount: attempts.length,
            bestPct: pcts.length ? Math.max(...pcts) : null,
            avgPct: pcts.length ? Math.round(pcts.reduce((a, b) => a + b, 0) / pcts.length) : null,
            answered, correct, accuracy: answered ? Math.round(100 * correct / answered) : null,
            avgTimeSec: answered ? Math.round(time / answered) : null,
            seenQuestions, mastered, flagged, totalQuestions: exam.questions.length,
            topics: topicList, hardest: hard.slice(0, 10)
        };
    }
};

/* A practice session: items, answers, timers, scoring. No DOM, fully serializable. */
App.Session = (function () {
    const hint = x => x;

    class Session {
        constructor(data) { Object.assign(this, data); }

        // questions: raw question defs; options: {examId, modeId, modeLabel, studyMode, timerMode, totalSec, perQuestionSec, threshold, shuffleOptions}
        static create(questions, options) {
            const items = questions.map(q => App.prepareQuestion(q, { shuffleOptions: options.shuffleOptions !== false }));
            const timerMode = options.timerMode || 'total';
            return new Session({
                id: App.util.uid(), examId: options.examId, modeId: options.modeId, modeLabel: options.modeLabel || options.modeId,
                createdAt: Date.now(), updatedAt: Date.now(), studyMode: !!options.studyMode, threshold: options.threshold,
                scoring: App.scoring.clean(options.scoring), items, index: 0, values: {}, validated: {}, applied: {}, times: {},
                timerMode, totalSec: options.totalSec || 0, secondsLeft: options.totalSec || 0,
                perQuestionSec: options.perQuestionSec || 0, qLeft: options.perQuestionSec || 0,
                pausesAllowed: options.pauses === undefined ? null : options.pauses, pausesUsed: 0, paused: false, strictTime: !!options.strictTime
            });
        }

        static fromJSON(obj) { return new Session(App.util.clone(obj)); }
        toJSON() { return Object.assign({}, this); }

        get length() { return this.items.length; }
        item(i) { return this.items[i === undefined ? this.index : i]; }
        handler(i) { return App.types[this.item(i).kind]; }
        value(i) { return this.values[i === undefined ? this.index : i]; }
        setValue(i, v) { this.values[i] = v; }
        hasAnswer(i) { return this.handler(i).hasAnswer(this.item(i), this.values[i]); }
        isCorrect(i) { return this.hasAnswer(i) && this.handler(i).isCorrect(this.item(i), this.values[i]); }
        isChecked(i) { return this.validated[i] !== undefined; }
        answeredCount() { let n = 0; for (let i = 0; i < this.length; i++) if (this.hasAnswer(i)) n++; return n; }
        unanswered() { const out = []; for (let i = 0; i < this.length; i++) if (!this.hasAnswer(i)) out.push(i); return out; }

        goTo(i) {
            if (i < 0 || i >= this.length) return false;
            this.index = i;
            if (this.timerMode === 'perQuestion') this.qLeft = this.perQuestionSec;
            return true;
        }

        // Study mode: check one answer now (locks it and records the result in the SRS stats).
        check(i, storage) {
            if (this.isChecked(i)) return this.validated[i];
            if (!this.hasAnswer(i)) return null;
            const ok = this.isCorrect(i);
            this.validated[i] = ok;
            this._record(i, ok, storage);
            return ok;
        }

        _record(i, ok, storage) {
            if (this.applied[i]) return;
            this.applied[i] = true;
            App.recordAnswer(this.examId, this.item(i).uid, ok, this.times[i] || 0, storage);
        }

        canPause() { return this.timerMode !== 'none' && !this.paused && (this.pausesAllowed === null || this.pausesUsed < this.pausesAllowed); }
        pausesLeft() { return this.pausesAllowed === null ? null : Math.max(0, this.pausesAllowed - this.pausesUsed); }
        pause() { if (!this.canPause()) return false; this.paused = true; this.pausesUsed++; return true; }
        unpause() { this.paused = false; }

        // Strict time: the clock kept running while the session was closed.
        applyAway(now) {
            if (!this.strictTime || this.paused || this.timerMode !== 'total') return 0;
            const away = Math.max(0, Math.round(((now || Date.now()) - this.updatedAt) / 1000));
            this.secondsLeft = Math.max(0, this.secondsLeft - away);
            return away;
        }

        // Pace for a total timer: positive = ahead of schedule (answers vs. time used).
        pace() {
            if (this.timerMode !== 'total' || !this.totalSec) return null;
            const used = this.totalSec - this.secondsLeft;
            const expected = this.length * used / this.totalSec;
            return Math.round((this.answeredCount() - expected) * 10) / 10;
        }

        // Called once per second by the UI. Returns 'total' | 'question' when a timer runs out.
        tick() {
            if (this.paused) return null;
            this.times[this.index] = (this.times[this.index] || 0) + 1;
            if (this.timerMode === 'total') {
                this.secondsLeft = Math.max(0, this.secondsLeft - 1);
                if (this.secondsLeft <= 0) return 'total';
            } else if (this.timerMode === 'perQuestion') {
                this.qLeft = Math.max(0, this.qLeft - 1);
                if (this.qLeft <= 0) return 'question';
            }
            return null;
        }

        scoreNow() { return App.scoring.score(this.items, this.values, this.scoring); }
        fraction(i) { return App.fractionOf(this.item(i), this.values[i], this.scoring); }

        // Scores the session. Returns the attempt record (also emitted as 'sessionEnd').
        submit(storage, now) {
            now = now || Date.now();
            const r = this.scoreNow();
            const answers = [];
            for (let i = 0; i < this.length; i++) {
                const answered = r.details[i].answered;
                const ok = answered && this.isCorrect(i);
                if (answered && !this.applied[i]) this._record(i, ok, storage);
                answers.push([this.item(i).uid, ok ? 1 : 0, this.times[i] || 0, answered ? 1 : 0, Math.round(r.details[i].frac * 100) / 100]);
            }
            const total = this.length;
            const passed = r.pct >= this.threshold && !r.mandatoryFailed.length;
            const attempt = {
                id: App.util.uid(), ts: now, started: this.createdAt, mode: this.modeId, modeLabel: this.modeLabel,
                studyMode: this.studyMode, durationSec: Object.values(this.times).reduce((a, b) => a + b, 0),
                total, correct: r.fully, partial: r.partial, pct: r.pct, score: r.score, maxScore: r.max, threshold: this.threshold,
                passed, mandatoryFailed: r.mandatoryFailed.length, scoring: r.custom ? r.cfg : undefined, answers
            };
            App.events.emit('sessionEnd', { session: this, attempt });
            return attempt;
        }
    }
    return Session;
})();

/* Exam loading. Exam files look like:   ExamSim.register({ ...pure JSON... });
   - over http(s) the text is fetched and the JSON is parsed WITHOUT executing it;
   - from file:// (where fetch is blocked) a <script> tag is used instead;
   - legacy files (window.ExamData = {...}) still load through the script path. */
App.loader = (function () {
    let pending = null;

    class LoadError extends Error {
        constructor(code, info) { super(code); this.code = code; Object.assign(this, info || {}); }
    }

    function register(data) { pending = data; }

    // Extracts the JSON argument of ExamSim.register(...). Returns null when the text is not in that shape.
    function parseText(text) {
        const t = String(text).replace(/^﻿/, '').replace(/^(\s*(\/\/[^\n]*\n|\/\*[\s\S]*?\*\/))*/, '').trim();
        const m = t.match(/^ExamSim\.register\(([\s\S]*)\)\s*;?\s*$/);
        if (!m) {
            if (t.startsWith('{')) { try { return JSON.parse(t); } catch (e) { throw new LoadError('parse', { detail: e.message }); } }
            return null;
        }
        try { return JSON.parse(m[1]); } catch (e) { throw new LoadError('parse', { detail: e.message }); }
    }

    function finalize(data, fileId, label) {
        const { exam, report } = App.schema.prepare(data, fileId);
        if (!exam) throw new LoadError('invalid', { report, name: label || fileId });
        exam.sourceFile = fileId;
        return exam;
    }

    async function fetchText(url, name) {
        let resp;
        try { resp = await fetch(url, { cache: 'no-cache' }); } catch (e) { throw new LoadError('network', { name }); }
        if (resp.status === 404) throw new LoadError('notFound', { name });
        if (!resp.ok) throw new LoadError('network', { name });
        return resp.text();
    }

    function loadScript(url, name) {
        return new Promise((resolve, reject) => {
            const s = document.createElement('script');
            s.src = url;
            s.onload = () => { s.remove(); resolve(); };
            s.onerror = () => { s.remove(); reject(new LoadError('notFound', { name })); };
            document.head.appendChild(s);
        });
    }

    const isHttp = () => typeof location !== 'undefined' && /^https?:$/.test(location.protocol);

    async function loadByName(name) {
        const file = name + '.exam';
        let data = null;
        pending = null;
        if (isHttp()) {
            try { data = parseText(await fetchText(file, file)); }
            catch (e) { if (e.code === 'notFound' || e.code === 'parse') { if (!e.name || e.name === 'LoadError' || e.name === 'Error') e.name = file; throw e; } /* network trouble: try the script path */ }
        }
        if (!data) {
            pending = null;
            try { delete window.ExamData; } catch (e) { window.ExamData = undefined; }
            await loadScript(file, file);
            data = pending || window.ExamData;
            try { delete window.ExamData; } catch (e) { window.ExamData = undefined; }
            if (!data) throw new LoadError('noRegister', { name: file });
        }
        return finalize(data, name, file);
    }

    async function loadByUrl(url) {
        let u;
        try { u = new URL(url, location.href); } catch (e) { throw new LoadError('network', { name: url }); }
        if (!/^https?:$/.test(u.protocol)) throw new LoadError('network', { name: url });
        const data = parseText(await fetchText(u.href, url));
        if (!data) throw new LoadError('parse', { name: url, detail: 'not an ExamSim format 2 file' });
        const base = (u.pathname.split('/').pop() || 'remote').replace(/\.exam$|\.json$/g, '').replace(/[^\w.\-]/g, '_');
        return finalize(data, base || 'remote', url);
    }

    // Exam list: exams.js (generated, optional) overrides the list embedded in exam.html at build time.
    function catalog() {
        if (typeof window === 'undefined') return [];
        if (Array.isArray(window.ExamCatalog) && window.ExamCatalog.length) return window.ExamCatalog;
        return Array.isArray(window.ExamCatalogDefault) ? window.ExamCatalogDefault : [];
    }

    // Human-readable message for a load error.
    function describe(err) {
        const T = App.t;
        const name = err.name || '';
        switch (err.code) {
            case 'notFound': return [T('errNotFound', { name })];
            case 'network': return [T('errNetwork', { name })];
            case 'parse': return [T('errParse', { name: name || '', detail: err.detail || '' })];
            case 'noRegister': return [T('errNoRegister', { name })];
            case 'invalid': {
                const lines = (err.report && err.report.errors || []).slice(0, 6).map(e => '• ' + e.path + ': ' + e.message);
                return [T('errInvalid', { name, n: err.report ? err.report.errors.length : '?' })].concat(lines);
            }
            default: return [String(err && err.message || err)];
        }
    }

    return { register, parseText, finalize, loadByName, loadByUrl, catalog, describe, LoadError };
})();

    };

    // Circular progress ring (SVG). Returns {svg}; animates from empty.
    App.ui.ring = function (pct, color, size, stroke) {
        const NS = 'http://www.w3.org/2000/svg';
        const r = 52, c = 2 * Math.PI * r;
        const svg = document.createElementNS(NS, 'svg');
        svg.setAttribute('viewBox', '0 0 120 120');
        svg.setAttribute('aria-hidden', 'true');
        const mk = (cls, stk) => {
            const circ = document.createElementNS(NS, 'circle');
            circ.setAttribute('cx', 60); circ.setAttribute('cy', 60); circ.setAttribute('r', r);
            circ.setAttribute('fill', 'none'); circ.setAttribute('stroke-width', stroke || 10); circ.setAttribute('stroke-linecap', 'round');
            circ.setAttribute('class', cls); if (stk) circ.setAttribute('stroke', stk);
            return circ;
        };
        const bg = mk('ring-bg'); bg.setAttribute('stroke', 'currentColor'); bg.style.opacity = '0.18';
        const fg = mk('ring-fg', color);
        fg.setAttribute('stroke-dasharray', c); fg.setAttribute('stroke-dashoffset', c);
        svg.appendChild(bg); svg.appendChild(fg);
        requestAnimationFrame(() => requestAnimationFrame(() => fg.setAttribute('stroke-dashoffset', c * (1 - Math.max(0, Math.min(100, pct)) / 100))));
        return svg;

    App.ui.rerender = function () {

        else if (s === 'stats') App.ui.renderStats();

    // ---- export / import of progress ----
    App.ui.exportProgress = function (examIds) {
        const data = App.storage.exportData(examIds);
        const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
        const a = el('a', { href: URL.createObjectURL(blob), download: 'examsim-progress-' + new Date().toISOString().slice(0, 10) + '.json' });
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000);
        App.ui.toast(App.t('exportDone'));
    };
    App.ui.importProgress = function () { $('import-file').click(); };
    App.ui.handleImportFile = function (file) {
        const reader = new FileReader();
        reader.onload = () => {
            try {

                App.ui.rerender();

    App.ui.toolbarButtons = function (opts) {

    // Full refresh of the runtime view (also after language change)
    App.ui.refreshRuntime = function () {
        const s = S();
        if (!s) return;

        refs.check.textContent = ''; refs.check.appendChild(icon('check', 17)); refs.check.appendChild(el('span', { text: App.t('validate') }));
        refs.check.classList.toggle('hidden', !s.studyMode);
        refs.gridTitle.textContent = App.t('progress');
        refs.finish.textContent = ''; refs.finish.appendChild(icon('flag', 16)); refs.finish.appendChild(el('span', { text: App.t('endScore') }));

        refs.legend.appendChild(el('span', { class: 'lg-answered', text: App.t('legendAnswered') }));
        refs.legend.appendChild(el('span', { text: App.t('legendUnanswered') }));
        refs.legend.appendChild(el('span', { class: 'lg-flagged', text: App.t('legendFlagged') }));
        renderQuestion();

            const ev = s.tick();
            updateClock();
            if (screen === 'runtime') renderPace();
            if (ev === 'total') { App.ui.submit(true); return; }
            if (ev === 'question' && screen === 'runtime') { if (s.index < s.length - 1) go(s.index + 1); else App.ui.openReview(); return; }
            if (s.times[s.index] % 10 === 0) App.ui.persist();

        }
    });
})();

    const $ = App.ui.$;
    const S = () => App.state.session;

    const kpi = (value, label, cls) => el('div', { class: 'kpi ' + (cls || '') }, el('b', { text: String(value) }), el('span', { text: label }));
    const resume = i => { S().goTo(i); App.ui.show('runtime'); App.ui.refreshRuntime(); };

    App.ui.openReview = function () {
        App.ui.show('review');
        App.ui.renderReview();
    };

    App.ui.renderReview = function () {
        const s = S();
        const v = $('view-review');
        v.textContent = '';
        const unanswered = s.unanswered();
        const stats = App.storage.allQStats(s.examId);
        const flagged = [];
        for (let i = 0; i < s.length; i++) { const st = stats[s.item(i).uid]; if (st && st.flag) flagged.push(i); }

        const card = el('div', { class: 'card' });
        card.appendChild(el('h1', { text: App.t('reviewTitle') }));
        card.appendChild(el('p', { class: 'subtitle', text: App.t('reviewText', { a: s.length - unanswered.length, n: s.length, u: unanswered.length, f: flagged.length }) }));
        card.appendChild(el('div', { class: 'kpis' },
            kpi(s.length - unanswered.length, App.t('legendAnswered'), 'ok'),
            kpi(unanswered.length, App.t('reviewUnanswered'), unanswered.length ? 'warn' : ''),
            kpi(flagged.length, App.t('reviewFlagged'))));

        const grid = el('div', { class: 'review-grid' });
        for (let i = 0; i < s.length; i++) {
            let cls = 'nav-grid-btn' + (s.hasAnswer(i) ? ' answered' : ' unanswered-hint');
            if (flagged.includes(i)) cls += ' flagged';
            grid.appendChild(el('button', { type: 'button', class: cls, text: String(i + 1), onclick: () => resume(i), aria: { label: App.t('questionOf', { i: i + 1, n: s.length }) } }));
        }
        card.appendChild(grid);

        const pills = (title, list) => {
            if (!list.length) return;
            const box = el('div', { class: 'review-block' }, el('h2', { text: title + ' (' + list.length + ')' }));
            const pl = el('div', { class: 'pill-list' });
            list.forEach(i => pl.appendChild(el('button', { type: 'button', class: 'pill', text: '#' + (i + 1), onclick: () => resume(i) })));
            box.appendChild(pl); card.appendChild(box);
        };
        pills(App.t('reviewUnanswered'), unanswered);
        pills(App.t('reviewFlagged'), flagged);

        card.appendChild(el('div', { class: 'toolbar', style: 'margin-top:22px' },
            App.ui.btn(App.t('reviewBack'), 'back', 'btn-secondary', () => { App.ui.show('runtime'); App.ui.refreshRuntime(); }),
            App.ui.btn(App.t('reviewSubmit'), 'check', 'btn-lg', () => App.ui.submit(false), { id: 'submit-btn' })));
        v.appendChild(card);
    };

    App.ui.submit = function (auto) {
        const s = S();
        if (!s || s.submitted) return;
        s.submitted = true;
        App.ui.stopClock();
        clearTimeout(App.state.persistTimer);
        const attempt = s.submit(App.storage);
        App.storage.addAttempt(s.examId, attempt);
        App.storage.deleteSession(s.examId, s.id);
        App.state.lastResult = { attempt, session: s };
        App.state.reviewFilter = 'all';
        App.ui.show('summary');
        App.ui.renderSummary();
    };

    function topicBreakdown(s, exam) {
        const by = {};
        for (let i = 0; i < s.length; i++) {
            const t = s.item(i).topic;
            by[t] = by[t] || { total: 0, ok: 0 };
            by[t].total++; if (s.isCorrect(i)) by[t].ok++;
        }
        const keys = Object.keys(by);
        if (keys.length < 2) return null;
        const box = el('div', { class: 'stat-section' }, el('h2', { text: App.t('topicBreakdown') }));
        keys.forEach(t => {
            const pct = Math.round(100 * by[t].ok / by[t].total);
            const name = exam && exam.topics && exam.topics[t] ? App.loc(exam.topics[t]) : t;
            box.appendChild(el('div', { class: 'bar-row' },
                el('span', { text: name }),
                el('div', { class: 'bar-track' }, el('div', { class: 'bar-fill' + (pct < 50 ? ' low' : (pct < 75 ? ' mid' : '')), style: 'width:' + pct + '%' })),
                el('span', { class: 'bar-pct', text: pct + '%' })));
        });
        return box;
    }

    App.ui.renderSummary = function () {
        const r = App.state.lastResult;
        if (!r) return;
        const { attempt, session: s } = r;
        const exam = App.state.exam;
        const v = $('view-summary');
        v.textContent = '';
        const color = attempt.passed ? 'var(--success)' : 'var(--error)';
        const card = el('div', { class: 'card' });
        card.appendChild(el('div', { class: 'print-only print-head' },
            el('h2', { text: App.loc(exam.title) }),
            el('p', { text: [s.modeLabel, App.t('printedOn', { d: new Date().toLocaleString(App.lang === 'it' ? 'it-IT' : 'en-GB') }), App.t('scoreLine', { c: attempt.correct, n: attempt.total }) + ' (' + attempt.pct + '%)'].join(' · ') })));
        card.appendChild(el('h1', { text: App.t('resultsTitle') }));
        card.appendChild(el('p', { class: 'subtitle', text: App.t('resultsSubtitle') }));

        const ring = el('div', { class: 'score-ring' });
        ring.appendChild(App.ui.ring(attempt.pct, color, 168, 10));
        ring.appendChild(el('div', { class: 'score-num' }, el('span', { id: 'metric-percentage', text: attempt.pct + '%' }), el('small', { text: App.t('scoreWord') })));
        const unanswered = attempt.answers.filter(a => !a[3]).length;
        const partialN = attempt.partial || 0;
        const wrongN = attempt.total - attempt.correct - partialN - unanswered;
        card.appendChild(el('div', { class: 'score-hero', style: 'margin-top:20px' }, ring,
            el('div', { style: 'flex:1 1 260px;min-width:0' },
                el('div', { class: 'verdict ' + (attempt.passed ? 'pass' : 'fail'), id: 'exam-result-badge' }, icon(attempt.passed ? 'trophy' : 'x', 18), el('span', { text: App.t(attempt.passed ? 'pass' : 'fail', { t: attempt.threshold }).replace(/^[^\w]*\s*/, '') })),
                el('p', { id: 'metric-raw-string', style: 'font-weight:600;font-size:1.05rem', text: App.t('scoreLine', { c: attempt.correct, n: attempt.total }) }),
                attempt.scoring ? el('p', { class: 'hint', id: 'points-line', text: App.t('pointsLine', { s: attempt.score, m: attempt.maxScore }) }) : null,
                attempt.mandatoryFailed ? el('p', { class: 'hint', style: 'color:var(--error);font-weight:700', text: App.t('mandatoryFailedMsg', { n: attempt.mandatoryFailed }) }) : null,
                el('p', { class: 'hint', text: s.modeLabel }))));

        card.appendChild(el('div', { class: 'kpis' },
            kpi(attempt.correct, App.t('correctKpi'), 'ok'),
            partialN ? kpi(partialN, App.t('partialKpi'), 'warn') : null,
            kpi(wrongN, App.t('wrongKpi'), wrongN ? 'bad' : ''),
            kpi(unanswered, App.t('unansweredKpi'), unanswered ? 'warn' : ''),
            kpi(App.ui.fmtTime(attempt.durationSec), App.t('timeKpi'))));

        const tb = topicBreakdown(s, exam);
        if (tb) card.appendChild(tb);

        const wrong = [];
        for (let i = 0; i < s.length; i++) if (!s.isCorrect(i)) wrong.push(s.item(i).uid);
        const bar = el('div', { class: 'toolbar' },
            App.ui.btn(App.t('backToMenu'), 'home', '', () => { App.ui.renderDashboard(); App.ui.show('dashboard'); }, { id: 'return-btn' }));
        if (wrong.length) bar.appendChild(App.ui.btn(App.t('retryWrong') + ' (' + wrong.length + ')', 'refresh', 'btn-ghost', () => App.ui.retry(wrong)));
        bar.appendChild(App.ui.btn(App.t('statsBtn'), 'chart', 'btn-ghost', () => App.ui.openStats()));
        bar.appendChild(App.ui.btn(App.t('printBtn'), 'download', 'btn-ghost', () => window.print(), { id: 'print-btn' }));
        card.appendChild(bar);

        // filter chips + review cards
        const stats = App.storage.allQStats(s.examId);
        const filters = [['all', App.t('filterAll')], ['wrong', App.t('filterWrong')], ['unanswered', App.t('filterUnanswered')], ['flagged', App.t('filterFlagged')]];
        const chips = el('div', { class: 'filter-chips', role: 'group' });
        const box = el('div', { id: 'review-payload-box' });
        const cards = [];
        for (let i = 0; i < s.length; i++) {
            const item = s.item(i);
            const answered = s.hasAnswer(i), ok = s.isCorrect(i);
            const st = stats[item.uid];
            const frac = s.fraction(i);
            const part = answered && !ok && frac > 0;
            const cls = ok ? 'is-correct' : (part ? 'is-partial' : (answered ? 'is-incorrect' : 'is-unanswered'));
            const badge = ok ? App.t('correct') : (part ? App.t('partialBadge', { p: Math.round(frac * 100) }) : (answered ? App.t('incorrect') : App.t('unansweredBadge')));
            const meta = [item.topic, item.difficulty ? '★'.repeat(item.difficulty) : '', item.mandatory ? App.t('mandatoryChip') : '', (s.times[i] || 0) + 's'].filter(Boolean).join(' · ');
            const c = el('div', { class: 'review-item-card ' + cls },
                el('span', { class: 'review-status-badge' }, icon(ok ? 'check' : (answered ? 'x' : 'clock'), 12), el('span', { text: badge })),
                el('div', { class: 'meta', text: meta }),
                el('div', { class: 'review-q', role: 'heading', aria: { level: '3' } }, el('strong', { text: App.t('questionN', { n: i + 1, q: '' }) }), App.rich.node(App.loc(item.text))),
                App.types[item.kind].renderReview(item, s.value(i)),
                item.explanation ? el('div', { class: 'explanation-box' }, el('h4', { text: App.t('explanation') }), App.rich.node(App.loc(item.explanation))) : null);
            cards.push({ node: c, ok, answered, flagged: !!(st && st.flag) });
            box.appendChild(c);
        }
        function applyFilter(f) {
            App.state.reviewFilter = f;
            chips.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.f === f ? 'true' : 'false'));
            cards.forEach(c => {
                const show = f === 'all' || (f === 'wrong' && !c.ok && c.answered) || (f === 'unanswered' && !c.answered) || (f === 'flagged' && c.flagged);
                c.node.classList.toggle('hidden', !show);
            });
        }
        filters.forEach(([f, label]) => chips.appendChild(el('button', { type: 'button', class: 'filter-chip', text: label, dataset: { f }, onclick: () => applyFilter(f) })));
        card.appendChild(chips);
        card.appendChild(box);
        v.appendChild(card);
        applyFilter(App.state.reviewFilter || 'all');
    };

    // New study session with the questions that were wrong/unanswered
    App.ui.retry = function (uids) {
        const exam = App.state.exam;
        const set = new Set(uids);
        const qs = exam.questions.filter(q => set.has(q.uid));
        if (!qs.length) return;
        const session = App.Session.create(qs, {
            examId: exam.id, modeId: 'retry', modeLabel: App.t('retryWrong'), studyMode: true,
            timerMode: 'none', threshold: exam.settings.passThreshold, scoring: App.scoring.resolve(exam, null, App.storage.getPref('scoring')), shuffleOptions: exam.settings.shuffleOptions
        });
        App.ui.beginSession(session);
    };
})();

/* UI: statistics screen (history chart, accuracy by topic, hardest questions). */
(function () {
    const { el, icon } = App.util;
    const $ = App.ui.$;
    const SVGNS = 'http://www.w3.org/2000/svg';
    const svg = (tag, attrs) => { const n = document.createElementNS(SVGNS, tag); Object.entries(attrs || {}).forEach(([k, v]) => n.setAttribute(k, v)); return n; };

    App.ui.openStats = function () { App.ui.show('stats'); App.ui.renderStats(); };

    function historyChart(attempts, threshold) {
        const list = attempts.slice(-30);
        const W = 600, H = 180, L = 30, R = 12, T = 12, B = 22;
        const root = svg('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': App.t('statsHistory') });
        const y = pct => T + (H - T - B) * (1 - pct / 100);
        [0, 50, 100].forEach(p => {
            root.appendChild(svg('line', { x1: L, x2: W - R, y1: y(p), y2: y(p), class: 'chart-axis' }));
            const t = svg('text', { x: 4, y: y(p) + 3, class: 'chart-label' }); t.textContent = p; root.appendChild(t);
        });
        if (threshold !== null) root.appendChild(svg('line', { x1: L, x2: W - R, y1: y(threshold), y2: y(threshold), class: 'chart-thr' }));
        const x = i => list.length === 1 ? (L + W - R) / 2 : L + (W - L - R) * i / (list.length - 1);
        const pts = list.map((a, i) => x(i) + ',' + y(a.pct));
        if (list.length > 1) root.appendChild(svg('polygon', { points: x(0) + ',' + y(0) + ' ' + pts.join(' ') + ' ' + x(list.length - 1) + ',' + y(0), class: 'chart-area' }));
        root.appendChild(svg('polyline', { points: pts.join(' '), class: 'chart-line' }));
        list.forEach((a, i) => {
            const c = svg('circle', { cx: x(i), cy: y(a.pct), r: 4.5, class: 'chart-dot' + (a.passed ? '' : ' fail') });
            const title = svg('title'); title.textContent = a.pct + '% · ' + (a.modeLabel || a.mode) + ' · ' + new Date(a.ts).toLocaleDateString(); c.appendChild(title);
            root.appendChild(c);
        });
        return root;
    }

    App.ui.renderStats = function () {
        const exam = App.state.exam;
        const v = $('view-stats');
        v.textContent = '';
        const st = App.stats.compute(exam, App.storage);
        const card = el('div', { class: 'card' });
        card.appendChild(el('div', { class: 'row between', style: 'margin-bottom:6px' },
            el('div', {}, el('h1', { text: App.t('statsTitle') }), el('p', { class: 'subtitle', text: App.loc(exam.title) })),
            App.ui.btn(App.t('backBtn'), 'back', 'btn-secondary btn-sm', () => { App.ui.renderDashboard(); App.ui.show('dashboard'); })));
        v.appendChild(card);

        if (!st.attemptCount && !st.answered) { card.appendChild(el('p', { class: 'subtitle', style: 'margin-top:14px', text: App.t('statsEmpty') })); return; }

        const tile = (ic, value, label) => el('div', { class: 'tile' }, el('div', { class: 'tile-icon' }, icon(ic, 19)), el('div', {}, el('div', { class: 'tile-value', text: String(value) }), el('div', { class: 'tile-label', text: label })));
        card.appendChild(el('div', { class: 'tiles' },
            tile('layers', st.attemptCount, App.t('statsAttempts')),
            tile('target', st.accuracy === null ? '–' : st.accuracy + '%', App.t('statsAccuracy')),
            tile('trophy', st.bestPct === null ? '–' : st.bestPct + '%', App.t('statsBest')),
            tile('check', st.answered, App.t('statsAnswered')),
            tile('star', st.mastered + ' / ' + st.totalQuestions, App.t('statsMastered')),
            tile('clock', st.avgTimeSec === null ? '–' : st.avgTimeSec + ' s', App.t('statsAvgTime'))));

        if (st.attempts.length) {
            const thr = st.attempts[st.attempts.length - 1].threshold;
            card.appendChild(el('div', { class: 'stat-section chart-box' }, el('h2', { text: App.t('statsHistory') }), historyChart(st.attempts, typeof thr === 'number' ? thr : null)));
        }

        const topics = el('div', { class: 'stat-section' }, el('h2', { text: App.t('statsTopics') }));
        st.topics.forEach(t => {
            const name = exam.topics && exam.topics[t.topic] ? App.loc(exam.topics[t.topic]) : t.topic;
            const pct = t.pct === null ? 0 : t.pct;
            const cls = t.pct === null ? '' : (t.pct < 50 ? ' low' : (t.pct < 75 ? ' mid' : ''));
            topics.appendChild(el('div', { class: 'bar-row' },
                el('span', { text: name }),
                el('div', { class: 'bar-track', role: 'img', aria: { label: name + ' ' + (t.pct === null ? '–' : t.pct + '%') } }, el('div', { class: 'bar-fill' + cls, style: 'width:' + pct + '%' })),
                el('span', { class: 'bar-pct', text: t.pct === null ? '–' : t.pct + '%' })));
        });
        card.appendChild(topics);

        const hard = el('div', { class: 'stat-section' }, el('h2', { text: App.t('statsHardest') }));
        if (!st.hardest.length) hard.appendChild(el('p', { class: 'hint', text: App.t('statsNoHard') }));
        st.hardest.forEach(h => hard.appendChild(el('div', { class: 'hard-row' },
            el('div', { text: App.rich.plain(App.loc(h.text)).slice(0, 220) }),
            el('div', { class: 'hard-meta', text: h.topic + ' · ' + App.t('statsErrRate', { p: Math.round(h.rate * 100), w: h.wrong, n: h.seen }) }))));
        card.appendChild(hard);
    };
})();

/* Boot: preferences, header controls, routing (?content=NAME or ?url=ADDRESS). */
(function () {
    const $ = App.ui.$;

    function openExam(exam) {
        App.state.exam = exam;
        App.state.loadError = null;
        App.state.dash = {};
        $('logo-exam-code').textContent = exam.code || exam.id;
        $('logo-version').textContent = exam.version || '';
        document.title = App.loc(exam.title) + ' — Exam Simulator';
        App.ui.renderDashboard();
        App.ui.show('dashboard');
        App.events.emit('examLoaded', { exam });
    }
    App.ui.openExam = openExam;

    function showPicker(errorLines) {
        App.state.exam = null;
        App.state.loadError = errorLines || null;
        $('logo-exam-code').textContent = 'EXAM';
        $('logo-version').textContent = '';
        document.title = 'Exam Simulator';
        App.ui.renderPicker();
        App.ui.show('picker');
    }

    async function route() {
        const params = new URLSearchParams(window.location.search);
        const name = params.get('content');
        const url = params.get('url');
        try {
            if (name && /^[\w.\-]+$/.test(name)) {
                showLoading();
                openExam(await App.loader.loadByName(name));
            } else if (url) {
                showLoading();
                openExam(await App.loader.loadByUrl(url));
            } else showPicker();
        } catch (err) {
            if (err instanceof App.loader.LoadError) showPicker(App.loader.describe(err));
            else { console.error(err); showPicker([String(err && err.message || err)]); }
        }
    }

    function showLoading() {
        const v = $('view-picker');
        v.textContent = '';
        v.appendChild(App.util.el('p', { class: 'subtitle', text: App.t('loadingExam') }));
        App.ui.show('picker');
    }

    function boot() {
        const lang = App.storage.getPref('lang');
        App.setLang(lang === 'it' ? 'it' : 'en');
        const theme = App.storage.getPref('theme');
        if (theme === 'dark' || theme === 'light') document.documentElement.setAttribute('data-theme', theme);
        App.ui.applyStatic();
        $('lang-btn').addEventListener('click', () => App.ui.setLang(App.lang === 'en' ? 'it' : 'en'));
        $('theme-btn').addEventListener('click', () => App.ui.setTheme(App.ui.theme() === 'dark' ? 'light' : 'dark'));
        $('import-file').addEventListener('change', e => { if (e.target.files[0]) App.ui.handleImportFile(e.target.files[0]); e.target.value = ''; });
        route();
        if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
            const first = !navigator.serviceWorker.controller;
            navigator.serviceWorker.register('sw.js')
                .then(() => navigator.serviceWorker.ready)
                .then(() => { if (first) App.ui.toast(App.t('offlineReady')); })
                .catch(() => { /* offline support is optional */ });
        }
    }

    App.boot = boot;
    if (typeof document !== 'undefined' && document.getElementById('view-picker')) boot();
})();

})();

</script>
