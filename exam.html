        refs.legend = el('div', { class: 'legend' });
        refs.grid = el('div', { class: 'grid-navigation', role: 'group' });
        refs.finish = el('button', { type: 'button', class: 'btn btn-secondary btn-danger-outline', onclick: () => App.ui.openReview() });

        const main = el('div', { class: 'card', style: 'margin-bottom:0;' },
            el('div', { class: 'question-header' }, refs.topic, el('span', { class: 'question-actions' }, refs.pos, refs.flag)),
            refs.text, refs.body, refs.expl, refs.note,
            el('div', { class: 'nav-controls' }, refs.prev, refs.check, el('span', { class: 'spacer' }), refs.next),
            refs.help);
        const side = el('div', { class: 'sidebar-box' }, el('h2', { class: 'sidebar-title', id: 'progress-title' }), refs.legend, refs.grid, refs.finish);
        refs.progressTitle = side.querySelector('#progress-title');
        v.appendChild(el('div', { class: 'runtime-layout' }, main, side));
    }

    function topicName(t) {
        const ex = App.state.exam;
        return ex && ex.topics && ex.topics[t] ? App.loc(ex.topics[t]) : t;
    }

    // Full refresh of the runtime view (also after language change)
    App.ui.refreshRuntime = function () {
        const s = S();
        if (!s) return;
        refs.prev.textContent = App.t('previous');
        refs.check.textContent = App.t('validate');
        refs.check.classList.toggle('hidden', !s.studyMode);
        refs.progressTitle.textContent = App.t('progress');
        refs.finish.textContent = App.t('endScore');
        refs.help.textContent = App.t('keyboardHelp');
        refs.noteSummary.textContent = '📝 ' + App.t('note');
        refs.noteArea.placeholder = App.t('notePlaceholder');
        refs.legend.textContent = '';
        refs.legend.appendChild(el('span', { class: 'lg-answered', text: App.t('legendAnswered') }));
        refs.legend.appendChild(el('span', { text: App.t('legendUnanswered') }));
        refs.legend.appendChild(el('span', { class: 'lg-flagged', text: App.t('legendFlagged') }));
        renderQuestion();
        renderGrid();
        updateClock();
    };

    function renderQuestion() {
        const s = S();
        const i = s.index;
        const item = s.item(i);
        const h = s.handler(i);
        const checked = s.studyMode && s.isChecked(i);
        refs.topic.textContent = topicName(item.topic);
        refs.pos.textContent = App.t('questionOf', { i: i + 1, n: s.length });
        refs.text.textContent = App.loc(item.text);
        refs.text.setAttribute('aria-label', '');
        refs.body.textContent = '';
        refs.body.appendChild(h.render({
            item, value: s.value(i), locked: checked, reveal: checked, uid: 'q' + i,
            onChange: (v, o) => {
                s.setValue(i, v);
                App.events.emit('answer', { session: s, index: i, value: v });
                renderGrid();
                schedulePersist();
                if (!o || !o.silent) renderQuestion();
            }
        }));
        refs.expl.textContent = '';
        if (checked) {
            refs.expl.appendChild(el('div', { class: 'dynamic-explanation-box' },
                el('h3', { text: App.t('explanation') }),
                el('p', { text: App.loc(item.explanation) || App.t('noExplanation') })));
        }
        refs.check.disabled = !!checked;
        const last = i === s.length - 1;
        refs.next.textContent = last ? App.t('finish') : App.t('next');
        refs.next.classList.toggle('btn-final', last);
        refs.prev.disabled = i === 0;
        const st = App.storage.getQStat(s.examId, item.uid) || {};
        refs.flag.setAttribute('aria-pressed', st.flag ? 'true' : 'false');
        refs.flag.textContent = '⚑ ' + (st.flag ? App.t('unflag') : App.t('flag'));
        refs.noteArea.value = st.note || '';
        refs.note.open = !!st.note;
    }

    function renderGrid() {
        const s = S();
        const stats = App.storage.allQStats(s.examId);
        refs.grid.textContent = '';
        for (let i = 0; i < s.length; i++) {
            let cls = 'nav-grid-btn' + (i === s.index ? ' active' : '');
            if (s.studyMode && s.validated[i] === true) cls += ' answered-correct';
            else if (s.studyMode && s.validated[i] === false) cls += ' answered-wrong';
            else if (s.hasAnswer(i)) cls += ' answered';
            const st = stats[s.item(i).uid];
            if (st && st.flag) cls += ' flagged';
            const b = el('button', { type: 'button', class: cls, text: String(i + 1), onclick: () => go(i),
                aria: { label: App.t('questionOf', { i: i + 1, n: s.length }), current: i === s.index ? 'true' : 'false' } });
            refs.grid.appendChild(b);
        }
    }

    function go(i) {
        const s = S();
        if (s.goTo(i)) { renderQuestion(); renderGrid(); updateClock(); App.ui.persist(); App.events.emit('navigate', { session: s, index: i }); }
    }

    function nextQuestion() {
        const s = S();
        if (s.index === s.length - 1) App.ui.openReview(); else go(s.index + 1);
    }

    function checkAnswer() {
        const s = S();
        const r = s.check(s.index);
        if (r === null) { App.ui.toast(App.t('selectFirst')); return; }
        App.events.emit('check', { session: s, index: s.index, correct: r });
        renderQuestion(); renderGrid(); App.ui.persist();
    }

    function toggleFlag() {
        const s = S(), uid = s.item().uid;
        App.storage.patchQStat(s.examId, uid, st => { st.flag = !st.flag; return st; });
        renderQuestion(); renderGrid();
    }

    // ---- clock ----
    function updateClock() {
        const s = S();
        const box = $('runtime-timer-box');
        if (!s || App.state.screen !== 'runtime' || s.timerMode === 'none') { box.classList.add('hidden'); return; }
        box.classList.remove('hidden');
        $('timer-label').textContent = s.timerMode === 'perQuestion' ? App.t('timerQuestionLabel') : App.t('timeRemaining');
        $('runtime-clock-string').textContent = App.ui.fmtTime(s.timerMode === 'perQuestion' ? s.qLeft : s.secondsLeft);
    }
    App.ui.updateClock = updateClock;

    function startClock() {
        clearInterval(App.state.clockTimer);
        App.state.clockTimer = setInterval(() => {
            const s = S();
            if (!s || App.state.screen !== 'runtime') return;
            const ev = s.tick();
            updateClock();
            if (ev === 'total') { App.ui.submit(true); return; }
            if (ev === 'question') { if (s.index < s.length - 1) go(s.index + 1); else App.ui.openReview(); return; }
            if (s.times[s.index] % 10 === 0) App.ui.persist();
        }, 1000);
    }
    App.ui.stopClock = function () {
        clearInterval(App.state.clockTimer);
        App.state.clockTimer = null;
        $('runtime-timer-box').classList.add('hidden');
    };

    // ---- keyboard ----
    document.addEventListener('keydown', e => {
        if (App.state.screen !== 'runtime' || e.ctrlKey || e.metaKey || e.altKey) return;
        const t = e.target;
        const typing = t && (t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || (t.tagName === 'INPUT' && t.type === 'text') || (e.key.startsWith('Arrow') && t.classList && t.classList.contains('option-input')));
        if (typing) return;
        const s = S();
        const key = e.key.toLowerCase();
        const pick = idx => {
            const inputs = refs.body.querySelectorAll('.option-input');
            if (inputs[idx] && !inputs[idx].disabled) { inputs[idx].click(); e.preventDefault(); }
        };
        if (/^[1-6]$/.test(key)) pick(parseInt(key, 10) - 1);
        else if (/^[a-f]$/.test(key)) pick(key.charCodeAt(0) - 97);
        else if (key === 'arrowright') { if (s.index < s.length - 1) go(s.index + 1); e.preventDefault(); }
        else if (key === 'arrowleft') { go(s.index - 1); e.preventDefault(); }
        else if (key === 'm') { toggleFlag(); e.preventDefault(); }
        else if (key === 'enter' && t.tagName !== 'BUTTON' && t.tagName !== 'A') {
            if (s.studyMode && !s.isChecked(s.index) && s.hasAnswer(s.index)) checkAnswer(); else nextQuestion();
            e.preventDefault();
        }
    });
})();

/* UI: review before finishing, results and per-question review. */
(function () {
    const { el } = App.util;
    const $ = App.ui.$;
    const S = () => App.state.session;

    App.ui.openReview = function () {
        App.ui.show('review');
        App.ui.renderReview();
    };

    App.ui.renderReview = function () {
        const s = S();
        const v = $('view-review');
        v.textContent = '';
        const unanswered = s.unanswered();
        const stats = App.storage.allQStats(s.examId);
        const flagged = [];
        for (let i = 0; i < s.length; i++) { const st = stats[s.item(i).uid]; if (st && st.flag) flagged.push(i); }

        v.appendChild(el('h1', { text: App.t('reviewTitle') }));
        v.appendChild(el('p', { class: 'subtitle', text: App.t('reviewText', { a: s.length - unanswered.length, n: s.length, u: unanswered.length, f: flagged.length }) }));

        const grid = el('div', { class: 'review-grid' });
        for (let i = 0; i < s.length; i++) {
            let cls = 'nav-grid-btn' + (s.hasAnswer(i) ? ' answered' : ' unanswered-hint');
            if (flagged.includes(i)) cls += ' flagged';
            grid.appendChild(el('button', { type: 'button', class: cls, text: String(i + 1), onclick: () => { s.goTo(i); App.ui.show('runtime'); App.ui.refreshRuntime(); },
                aria: { label: App.t('questionOf', { i: i + 1, n: s.length }) } }));
        }
        v.appendChild(grid);

        const pills = (title, list) => {
            if (!list.length) return;
            const box = el('div', { class: 'review-block' }, el('h2', { text: title + ' (' + list.length + ')' }));
            const pl = el('div', { class: 'pill-list' });
            list.forEach(i => pl.appendChild(el('button', { type: 'button', class: 'pill', text: '#' + (i + 1), onclick: () => { s.goTo(i); App.ui.show('runtime'); App.ui.refreshRuntime(); } })));
            box.appendChild(pl); v.appendChild(box);
        };
        pills(App.t('reviewUnanswered'), unanswered);
        pills(App.t('reviewFlagged'), flagged);

        v.appendChild(el('div', { class: 'toolbar', style: 'margin-top:20px;' },
            el('button', { type: 'button', class: 'btn btn-secondary', text: App.t('reviewBack'), onclick: () => { App.ui.show('runtime'); App.ui.refreshRuntime(); } }),
            el('button', { type: 'button', class: 'btn', id: 'submit-btn', text: App.t('reviewSubmit'), onclick: () => App.ui.submit(false) })));
    };

    App.ui.submit = function (auto) {
        const s = S();
        if (!s || s.submitted) return;
        s.submitted = true;
        App.ui.stopClock();
        clearTimeout(App.state.persistTimer);
        const attempt = s.submit(App.storage);
        App.storage.addAttempt(s.examId, attempt);
        App.storage.deleteSession(s.examId, s.id);
        App.state.lastResult = { attempt, session: s };
        App.ui.show('summary');
        App.ui.renderSummary();
    };

    App.ui.renderSummary = function () {
        const r = App.state.lastResult;
        if (!r) return;
        const { attempt, session: s } = r;
        const v = $('view-summary');
        v.textContent = '';
        v.appendChild(el('h1', { text: App.t('resultsTitle') }));
        v.appendChild(el('p', { class: 'subtitle', text: App.t('resultsSubtitle') }));

        const color = attempt.passed ? 'var(--success)' : 'var(--error)';
        v.appendChild(el('div', { class: 'metrics-summary-box' },
            el('div', { class: 'score-circle', id: 'metric-percentage', style: 'border-color:' + color + ';color:' + color, text: attempt.pct + '%' }),
            el('div', {},
                el('h2', { id: 'metric-raw-string', style: 'font-size:1.3rem;font-weight:600;margin-bottom:4px;', text: App.t('scoreLine', { c: attempt.correct, n: attempt.total }) }),
                el('p', { id: 'exam-result-badge', style: 'font-size:1rem;font-weight:700;color:' + color, text: App.t(attempt.passed ? 'pass' : 'fail', { t: attempt.threshold }) }),
                el('p', { class: 'hint', text: s.modeLabel + ' · ' + App.t('resultTime', { m: App.ui.fmtTime(attempt.durationSec) }) }))));

        const wrong = [];
        for (let i = 0; i < s.length; i++) if (!s.isCorrect(i)) wrong.push(s.item(i).uid);
        const bar = el('div', { class: 'toolbar' },
            el('button', { type: 'button', class: 'btn', id: 'return-btn', text: App.t('backToMenu'), onclick: () => { App.ui.renderDashboard(); App.ui.show('dashboard'); } }));
        if (wrong.length) bar.appendChild(el('button', { type: 'button', class: 'btn btn-ghost', text: App.t('retryWrong') + ' (' + wrong.length + ')', onclick: () => App.ui.retry(wrong) }));
        bar.appendChild(el('button', { type: 'button', class: 'btn btn-ghost', text: '📊 ' + App.t('statsBtn'), onclick: () => App.ui.openStats() }));
        v.appendChild(bar);

        const box = el('div', { id: 'review-payload-box' });
        for (let i = 0; i < s.length; i++) {
            const item = s.item(i);
            const answered = s.hasAnswer(i), ok = s.isCorrect(i);
            const cls = ok ? 'is-correct' : (answered ? 'is-incorrect' : 'is-unanswered');
            const badge = ok ? App.t('correct') : (answered ? App.t('incorrect') : App.t('unansweredBadge'));
            const meta = [item.topic, item.difficulty ? '★'.repeat(item.difficulty) : '', (s.times[i] || 0) + 's'].filter(Boolean).join(' · ');
            const card = el('div', { class: 'review-item-card ' + cls },
                el('span', { class: 'review-status-badge', text: badge }),
                el('div', { class: 'meta', text: meta }),
                el('h3', { style: 'font-size:1.05rem;margin-bottom:10px;white-space:pre-line;', text: App.t('questionN', { n: i + 1, q: App.loc(item.text) }) }),
                App.types[item.kind].renderReview(item, s.value(i)),
                item.explanation ? el('div', { class: 'explanation-box', style: 'margin-top:15px;' },
                    el('h4', { style: 'font-size:0.95rem;', text: App.t('explanation') }),
                    el('p', { style: 'font-size:0.9rem;', text: App.loc(item.explanation) })) : null);
            box.appendChild(card);
        }
        v.appendChild(box);
    };

    // New study session with the questions that were wrong/unanswered
    App.ui.retry = function (uids) {
        const exam = App.state.exam;
        const set = new Set(uids);
        const qs = exam.questions.filter(q => set.has(q.uid));
        if (!qs.length) return;
        const session = App.Session.create(qs, {
            examId: exam.id, modeId: 'retry', modeLabel: App.t('retryWrong'), studyMode: true,
            timerMode: 'none', threshold: exam.settings.passThreshold, shuffleOptions: exam.settings.shuffleOptions
        });
        App.ui.beginSession(session);
    };
})();

/* UI: statistics screen (history chart, accuracy by topic, hardest questions). */
(function () {
    const { el } = App.util;
    const $ = App.ui.$;
    const SVGNS = 'http://www.w3.org/2000/svg';
    const svg = (tag, attrs) => { const n = document.createElementNS(SVGNS, tag); Object.entries(attrs || {}).forEach(([k, v]) => n.setAttribute(k, v)); return n; };

    App.ui.openStats = function () { App.ui.show('stats'); App.ui.renderStats(); };

    function historyChart(attempts, threshold) {
        const list = attempts.slice(-30);
        const W = 600, H = 170, L = 30, R = 10, T = 12, B = 22;
        const root = svg('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': App.t('statsHistory') });
        const y = pct => T + (H - T - B) * (1 - pct / 100);
        [0, 50, 100].forEach(p => {
            root.appendChild(svg('line', { x1: L, x2: W - R, y1: y(p), y2: y(p), class: 'chart-axis' }));
            const t = svg('text', { x: 4, y: y(p) + 3, class: 'chart-label' }); t.textContent = p; root.appendChild(t);
        });
        if (threshold !== null) root.appendChild(svg('line', { x1: L, x2: W - R, y1: y(threshold), y2: y(threshold), class: 'chart-thr' }));
        const x = i => list.length === 1 ? (L + W - R) / 2 : L + (W - L - R) * i / (list.length - 1);
        root.appendChild(svg('polyline', { points: list.map((a, i) => x(i) + ',' + y(a.pct)).join(' '), class: 'chart-line' }));
        list.forEach((a, i) => {
            const c = svg('circle', { cx: x(i), cy: y(a.pct), r: 4, class: 'chart-dot' + (a.passed ? '' : ' fail') });
            const title = svg('title'); title.textContent = a.pct + '% · ' + (a.modeLabel || a.mode) + ' · ' + new Date(a.ts).toLocaleDateString(); c.appendChild(title);
            root.appendChild(c);
        });
        return root;
    }

    App.ui.renderStats = function () {
        const exam = App.state.exam;
        const v = $('view-stats');
        v.textContent = '';
        const st = App.stats.compute(exam, App.storage);
        const head = el('div', { class: 'card-title-row' },
            el('h1', { text: App.t('statsTitle') + ' — ' + App.loc(exam.title) }),
            el('button', { type: 'button', class: 'btn btn-secondary btn-small', text: '← ' + App.t('backBtn'), onclick: () => { App.ui.renderDashboard(); App.ui.show('dashboard'); } }));
        v.appendChild(head);

        if (!st.attemptCount && !st.answered) { v.appendChild(el('p', { class: 'subtitle', text: App.t('statsEmpty') })); return; }

        const tile = (value, label) => el('div', { class: 'tile' }, el('div', { class: 'tile-value', text: String(value) }), el('div', { class: 'tile-label', text: label }));
        v.appendChild(el('div', { class: 'tiles' },
            tile(st.attemptCount, App.t('statsAttempts')),
            tile(st.accuracy === null ? '–' : st.accuracy + '%', App.t('statsAccuracy')),
            tile(st.bestPct === null ? '–' : st.bestPct + '%', App.t('statsBest')),
            tile(st.answered, App.t('statsAnswered')),
            tile(st.mastered + ' / ' + st.totalQuestions, App.t('statsMastered')),
            tile(st.avgTimeSec === null ? '–' : st.avgTimeSec + ' s', App.t('statsAvgTime'))));

        if (st.attempts.length) {
            const thr = st.attempts[st.attempts.length - 1].threshold;
            v.appendChild(el('div', { class: 'stat-section chart-box' }, el('h2', { text: App.t('statsHistory') }), historyChart(st.attempts, typeof thr === 'number' ? thr : null)));
        }

        const topics = el('div', { class: 'stat-section' }, el('h2', { text: App.t('statsTopics') }));
        st.topics.forEach(t => {
            const name = exam.topics && exam.topics[t.topic] ? App.loc(exam.topics[t.topic]) : t.topic;
            const pct = t.pct === null ? 0 : t.pct;
            const cls = t.pct === null ? '' : (t.pct < 50 ? ' low' : (t.pct < 75 ? ' mid' : ''));
            topics.appendChild(el('div', { class: 'bar-row' },
                el('span', { text: name }),
                el('div', { class: 'bar-track', role: 'img', aria: { label: name + ' ' + (t.pct === null ? '–' : t.pct + '%') } }, el('div', { class: 'bar-fill' + cls, style: 'width:' + pct + '%' })),
                el('span', { class: 'bar-pct', text: t.pct === null ? '–' : t.pct + '%' })));
        });
        v.appendChild(topics);

        const hard = el('div', { class: 'stat-section' }, el('h2', { text: App.t('statsHardest') }));
        if (!st.hardest.length) hard.appendChild(el('p', { class: 'hint', text: App.t('statsNoHard') }));
        st.hardest.forEach(h => hard.appendChild(el('div', { class: 'hard-row' },
            el('div', { text: App.loc(h.text).slice(0, 220) }),
            el('div', { class: 'hard-meta', text: h.topic + ' · ' + App.t('statsErrRate', { p: Math.round(h.rate * 100), w: h.wrong, n: h.seen }) }))));
        v.appendChild(hard);
    };
})();

/* Boot: preferences, header controls, routing (?content=NAME or ?url=ADDRESS). */
(function () {
    const $ = App.ui.$;

    function openExam(exam) {
        App.state.exam = exam;
        App.state.loadError = null;
        App.state.dash = {};
        $('logo-exam-code').textContent = exam.code || exam.id;
        $('logo-version').textContent = exam.version || '';
        document.title = App.loc(exam.title) + ' — Exam Simulator';
        App.ui.renderDashboard();
        App.ui.show('dashboard');
        App.events.emit('examLoaded', { exam });
    }
    App.ui.openExam = openExam;

    function showPicker(errorLines) {
        App.state.exam = null;
        App.state.loadError = errorLines || null;
        $('logo-exam-code').textContent = 'EXAM';
        $('logo-version').textContent = '';
        document.title = 'Exam Simulator';
        App.ui.renderPicker();
        App.ui.show('picker');
    }

    async function route() {
        const params = new URLSearchParams(window.location.search);
        const name = params.get('content');
        const url = params.get('url');
        try {
            if (name && /^[\w.\-]+$/.test(name)) {
                showLoading();
                openExam(await App.loader.loadByName(name));
            } else if (url) {
                showLoading();
                openExam(await App.loader.loadByUrl(url));
            } else showPicker();
        } catch (err) {
            if (err instanceof App.loader.LoadError) showPicker(App.loader.describe(err));
            else { console.error(err); showPicker([String(err && err.message || err)]); }
        }
    }

    function showLoading() {
        const v = $('view-picker');
        v.textContent = '';
        v.appendChild(App.util.el('p', { class: 'subtitle', text: App.t('loadingExam') }));
        App.ui.show('picker');
    }

    function boot() {
        const lang = App.storage.getPref('lang');
        App.setLang(lang === 'it' ? 'it' : 'en');
        const theme = App.storage.getPref('theme');
        if (theme === 'dark' || theme === 'light') document.documentElement.setAttribute('data-theme', theme);
        App.ui.applyStatic();
        $('lang-btn').addEventListener('click', () => App.ui.setLang(App.lang === 'en' ? 'it' : 'en'));
        $('theme-btn').addEventListener('click', () => App.ui.setTheme(App.ui.theme() === 'dark' ? 'light' : 'dark'));
        $('import-file').addEventListener('change', e => { if (e.target.files[0]) App.ui.handleImportFile(e.target.files[0]); e.target.value = ''; });
        route();
        if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
            const first = !navigator.serviceWorker.controller;
            navigator.serviceWorker.register('sw.js')
                .then(() => navigator.serviceWorker.ready)
                .then(() => { if (first) App.ui.toast(App.t('offlineReady')); })
                .catch(() => { /* offline support is optional */ });
        }
    }

    App.boot = boot;
    if (typeof document !== 'undefined' && document.getElementById('view-picker')) boot();
})();

})();

</script>
