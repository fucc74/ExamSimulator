            const correct = new Set(q.marked);
            let a = q.answerRaw !== undefined ? parseAnswerValue(q.answerRaw, opts.length) : null;
            let out = { id: q.n || qs.length + 1, topic: q.topic, text: q.text };
            if (opts.length >= 2) {
                if (a && a.letters) a.letters.forEach(i => correct.add(i));
                else if (a && a.text) { const i = opts.findIndex(o => o.toLowerCase() === a.text.toLowerCase()); if (i >= 0) correct.add(i); }
                else if (a && a.number !== undefined && Number.isInteger(a.number) && a.number >= 1 && a.number <= opts.length) correct.add(a.number - 1);
                const ans = Array.from(correct).filter(i => i < opts.length).sort((x, y) => x - y);
                out.type = ans.length > 1 ? 'multiple' : 'single';
                out.options = opts; out.answer = ans;
                if (!ans.length) issues.push('noAnswer');
            } else if (a && a.bool !== undefined && opts.length === 0) {
                out.type = 'truefalse'; out.answer = a.bool;
            } else if (a && a.number !== undefined && opts.length === 0) {
                out.type = 'numeric';
                out.answer = (a.tolerance || a.unit) ? Object.assign({ value: a.number }, a.tolerance ? { tolerance: a.tolerance } : {}, a.unit ? { unit: a.unit } : {}) : a.number;
            } else {
                out.type = 'single'; out.options = opts; out.answer = [];
                issues.push(opts.length ? 'fewOptions' : 'noOptions');
            }
            if (q.explanation) out.explanation = q.explanation;
            if (!out.text) issues.push('noText');
            out._issues = issues;
            qs.push(out);
        }

        const open = (n, text) => { finish(); cur = { n, text: text || '', options: [], marked: [], topic: topicKey }; field = 'text'; lastNum = n; };

        for (let li = 0; li < lines.length; li++) {
            const line = lines[li];
            if (!line.trim()) { if (cur && field === 'text' && cur.text) cur.text += '\n'; else if (cur && field === 'expl' && cur.explanation) cur.explanation += '\n'; continue; }
            let m;
            const qm = (m = line.match(RE.qWord)) || (m = line.match(RE.qNum));
            if (qm && (!cur || cur.options.length >= 2 || cur.answerRaw !== undefined || Number(m[1]) === lastNum + 1) && !(cur && field === 'expl' && Number(m[1]) !== lastNum + 1)) { open(Number(m[1]), m[2]); continue; }
            if (cur) {
                if ((m = line.match(RE.expl))) { cur.explanation = m[1]; field = 'expl'; continue; }
                if ((m = line.match(RE.answer))) { cur.answerRaw = m[1]; field = 'answer'; continue; }
                if (field !== 'expl' && field !== 'answer') {
                    let om;
                    if ((om = line.match(RE.checkbox))) { cur.options.push(om[3].replace(RE.mark, '')); if (om[1].toLowerCase() === 'x') cur.marked.push(cur.options.length - 1); field = 'opt'; continue; }
                    if ((om = line.match(RE.letter)) && LETTERS.indexOf(om[1].toUpperCase()) === cur.options.length) {
                        const mk = RE.mark.test(om[2]);
                        cur.options.push(om[2].replace(RE.mark, '')); if (mk) cur.marked.push(cur.options.length - 1); field = 'opt'; continue;
                    }
                    if (field === 'opt' && (om = line.match(RE.bullet))) { cur.options.push(om[1]); field = 'opt'; continue; }
                }
            }
            if ((m = line.match(RE.header)) && (!cur || cur.options.length || cur.answerRaw !== undefined || field === 'expl' || !cur.text.trim() || /^#/.test(line.trim()) && !line.match(/^\s*#{1,6}\s+\d/))) {
                const level = m[1] ? m[1].length : 0;
                const name = (m[2] || m[3] || m[4] || m[5] || '').trim();
                if (level === 1 && !qs.length && !cur && !meta.title) { meta.title = name; continue; }
                finish(); topicKey = addTopic(name); field = null;
                continue;
            }
            if (!cur) {
                const bq = line.match(/^\s*>\s?(.*)$/);
                if (bq && !qs.length) { meta.description = (meta.description ? meta.description + ' ' : '') + bq[1].trim(); continue; }
                if (!qs.length && !meta.title && line.trim().length < 120) { meta.title = line.trim(); continue; }
                continue;
            }
            // continuation of the current field
            const t = line.replace(/^\s+/, '');
            if (field === 'text') cur.text += (cur.text && !cur.text.endsWith('\n') ? '\n' : '') + t;
            else if (field === 'opt') cur.options[cur.options.length - 1] += ' ' + t;
            else if (field === 'expl') cur.explanation += (cur.explanation ? '\n' : '') + t;
            else if (field === 'answer') cur.answerRaw += ' ' + t;
        }
        finish();
        if (!qs.length) warnings.push('noQuestions');
        // keep only topics that are used
        const used = {};
        qs.forEach(q => { if (!topics[q.topic] && q.topic === 'general') topics.general = 'General'; });
        Object.keys(topics).forEach(k => { if (qs.some(q => q.topic === k)) used[k] = topics[k]; });
        // unique ids
        const seen = new Set();
        qs.forEach((q, i) => { if (seen.has(q.id)) q.id = i + 1 + 1000; seen.add(q.id); });
        return { meta, topics: used, questions: qs, warnings };
    }

    // Builds a complete format-2 exam from parsed pieces. Drops the transient _issues field.
    function buildExam(p) {
        const questions = p.questions.map(q => { const c = Object.assign({}, q); delete c._issues; return c; });
        const n = questions.length;
        const exam = {
            format: 2, id: p.id || slug(p.title || 'my-exam'), title: p.title || 'My exam', version: p.version || '1.0',
            settings: { passThreshold: 70, timePerQuestionSec: 90, shuffleOptions: true },
            topics: p.topics && Object.keys(p.topics).length ? p.topics : undefined,
            modes: [{ id: 'mock', name: { en: 'Mock exam', it: 'Simulazione' }, selection: 'balanced', count: Math.min(20, n), exam: true }],
            questions
        };
        if (p.description) exam.description = p.description;
        if (p.code) exam.code = p.code;
        if (!exam.topics) delete exam.topics;
        return exam;
    }

    // ---------------------------------------------------------------- Markdown export
    function toMarkdown(exam, lang) {
        const L = v => loc(v, lang);
        const out = ['# ' + L(exam.title)];
        if (exam.description) out.push('> ' + L(exam.description).replace(/\n+/g, ' '));
        out.push('');
        const skipped = [];
        let topic = null, n = 0;
        (exam.questions || []).forEach(q => {
            const type = App.questionType(q);
            if (!['single', 'multiple', 'truefalse', 'numeric'].includes(type)) { skipped.push(q.id); return; }
            if (q.topic !== topic) {
                topic = q.topic;
                out.push('## ' + L(exam.topics && exam.topics[topic] !== undefined ? exam.topics[topic] : topic), '');
            }
            n++;
            out.push('### ' + n + '. ' + L(q.text !== undefined ? q.text : q.question).replace(/\n{2,}/g, '\n'));
            if (type === 'single' || type === 'multiple') {
                const ans = Array.isArray(q.answer) ? q.answer : [q.answer];
                q.options.forEach((o, i) => out.push('- [' + (ans.includes(i) ? 'x' : ' ') + '] ' + L(o).replace(/\n/g, ' ')));
            } else if (type === 'truefalse') out.push('Answer: ' + (q.answer ? 'True' : 'False'));
            else {
                const a = q.answer && typeof q.answer === 'object' ? q.answer : { value: q.answer };
                out.push('Answer: ' + a.value + (a.tolerance ? ' ±' + a.tolerance : '') + (a.unit || q.unit ? ' ' + (a.unit || q.unit) : ''));
            }
            if (q.explanation) out.push('Explanation: ' + L(q.explanation).replace(/\n+/g, ' '));
            out.push('');
        });
        return { text: out.join('\n'), skipped };
    }

    // ---------------------------------------------------------------- CSV
    const CSV_COLUMNS = ['id', 'topic', 'type', 'difficulty', 'text', 'options', 'answer', 'explanation', 'tags', 'points'];

    function csvCell(v) { const s = v === undefined || v === null ? '' : String(v); return /[",\n\r;\t]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }

    function toCSV(exam, lang) {
        const L = v => loc(v, lang);
        const rows = [CSV_COLUMNS.join(',')], skipped = [];
        (exam.questions || []).forEach(q => {
            const type = App.questionType(q);
            if (type === 'scenario') { skipped.push(q.id); return; }
            let options = '', answer = '';
            if (type === 'single' || type === 'multiple') {
                options = q.options.map(o => L(o).replace(/\n/g, ' ')).join('\n');
                answer = (Array.isArray(q.answer) ? q.answer : [q.answer]).map(i => LETTERS[i]).join(';');
            } else if (type === 'truefalse') answer = q.answer ? 'true' : 'false';
            else if (type === 'numeric') { const a = typeof q.answer === 'object' ? q.answer : { value: q.answer }; answer = a.value + (a.tolerance ? '±' + a.tolerance : '') + (a.unit ? ' ' + a.unit : ''); }
            else if (type === 'ordering') options = q.items.map(o => L(o).replace(/\n/g, ' ')).join('\n');
            else if (type === 'matching') options = q.pairs.map(p => L(p.left).replace(/\n/g, ' ') + ' => ' + L(p.right).replace(/\n/g, ' ')).join('\n');
            rows.push([q.id, L(exam.topics && exam.topics[q.topic] !== undefined ? exam.topics[q.topic] : q.topic), type, q.difficulty || '', L(q.text !== undefined ? q.text : q.question), options, answer, L(q.explanation), (q.tags || []).join(';'), q.points || ''].map(csvCell).join(','));
        });
        return { text: '﻿' + rows.join('\r\n') + '\r\n', skipped };
    }

    function parseCSVRows(text, delim) {
        const rows = []; let row = [], cell = '', q = false;
        for (let i = 0; i < text.length; i++) {
            const c = text[i];
            if (q) {
                if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c;
            } else if (c === '"' && !cell) q = true;
            else if (c === delim) { row.push(cell); cell = ''; }
            else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); cell = ''; rows.push(row); row = []; }
            else cell += c;
        }
        if (cell || row.length) { row.push(cell); rows.push(row); }
        return rows.filter(r => r.some(c => c.trim() !== ''));
    }

    const HEAD_ALIASES = {
        id: /^(id|n|no|num|number|numero)$/, topic: /^(topic|argomento|section|sezione|category|categoria|domain|dominio)$/,
        type: /^(type|tipo)$/, difficulty: /^(difficulty|difficolta|livello|level)$/,
        text: /^(text|question|domanda|quesito|testo)$/, options: /^(options|opzioni|choices|risposte)$/,
        answer: /^(answer|answers|correct|correct answer|risposta|risposta corretta|soluzione)$/, explanation: /^(explanation|spiegazione|rationale|motivazione)$/,
        tags: /^(tags|tag)$/, points: /^(points|punti|score|punteggio)$/
    };

    function fromCSV(text) {
        text = String(text || '').replace(/^﻿/, '');
        const first = text.split(/\r?\n/, 1)[0] || '';
        const delim = [',', ';', '\t'].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
        const rows = parseCSVRows(text, delim);
        if (rows.length < 2) return { meta: {}, topics: {}, questions: [], warnings: ['noQuestions'] };
        const norm = s => s.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
        const head = rows[0].map(norm);
        const col = {}; const optCols = [];
        head.forEach((h, i) => {
            const oc = h.match(/^(?:option|opt|opzione|risposta)?[_ ]?([a-f])$/);
            if (oc && !HEAD_ALIASES.answer.test(h)) { optCols[LETTERS.indexOf(oc[1].toUpperCase())] = i; return; }
            Object.keys(HEAD_ALIASES).forEach(k => { if (col[k] === undefined && HEAD_ALIASES[k].test(h)) col[k] = i; });
        });
        const warnings = []; const topics = {}; const questions = [];
        if (col.text === undefined) return { meta: {}, topics: {}, questions: [], warnings: ['noTextColumn'] };
        rows.slice(1).forEach((r, ri) => {
            const get = k => col[k] === undefined ? '' : (r[col[k]] || '').trim();
            const out = { id: get('id') && /^\d+$/.test(get('id')) ? Number(get('id')) : (get('id') || ri + 1), text: get('text') };
            const tname = get('topic') || 'General'; const tk = slug(tname); topics[tk] = tname; out.topic = tk;
            const issues = [];
            let opts = get('options') ? get('options').split(/\n/).map(s => s.trim()).filter(Boolean) : [];
            if (!opts.length && optCols.length) opts = optCols.map(i => (r[i] || '').trim()).filter(Boolean);
            let type = get('type').toLowerCase();
            const a = get('answer');
            if (!type) type = opts.length >= 2 ? (/[;,&]/.test(a) || /^[A-Ha-h]{2,}$/.test(a) ? 'multiple' : 'single') : (/^(true|false|vero|falso)$/i.test(a) ? 'truefalse' : 'numeric');
            out.type = type;
            if (type === 'single' || type === 'multiple') {
                const pv = parseAnswerValue(a, opts.length);
                let ans = pv.letters || [];
                if (!ans.length && pv.text) { const i = opts.findIndex(o => o.toLowerCase() === pv.text.toLowerCase()); if (i >= 0) ans = [i]; }
                ans = Array.from(new Set(ans)).filter(i => i < opts.length).sort((x, y) => x - y);
                out.type = ans.length > 1 ? 'multiple' : 'single';
                out.options = opts; out.answer = ans;
                if (!ans.length) issues.push('noAnswer');
                if (opts.length < 2) issues.push('fewOptions');
            } else if (type === 'truefalse') {
                const pv = parseAnswerValue(a, 0);
                if (pv.bool === undefined) { issues.push('noAnswer'); out.answer = true; } else out.answer = pv.bool;
            } else if (type === 'numeric') {
                const pv = parseAnswerValue(a, 0);
                if (pv.number === undefined) { issues.push('noAnswer'); out.answer = 0; }
                else out.answer = (pv.tolerance || pv.unit) ? Object.assign({ value: pv.number }, pv.tolerance ? { tolerance: pv.tolerance } : {}, pv.unit ? { unit: pv.unit } : {}) : pv.number;
            } else if (type === 'ordering') {
                out.items = opts; if (opts.length < 2) issues.push('fewOptions');
            } else if (type === 'matching') {
                out.pairs = opts.map(o => { const p = o.split(/\s*(?:=>|->|=)\s*/); return { left: p[0], right: p.slice(1).join(' = ') }; });
                if (out.pairs.length < 2 || out.pairs.some(p => !p.right)) issues.push('fewOptions');
            } else issues.push('badType');
            if (get('difficulty') && [1, 2, 3].includes(Number(get('difficulty')))) out.difficulty = Number(get('difficulty'));
            if (get('explanation')) out.explanation = get('explanation');
            if (get('tags')) out.tags = get('tags').split(/[;,]/).map(s => s.trim()).filter(Boolean);
            if (get('points') && Number(get('points')) > 0) out.points = Number(get('points'));
            if (!out.text) issues.push('noText');
            out._issues = issues;
            questions.push(out);
        });
        return { meta: {}, topics, questions, warnings };
    }

    // ---------------------------------------------------------------- Anki (tab separated, HTML cards)
    const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
    function toAnki(exam, lang) {
        const L = v => App.rich && App.rich.plain ? App.rich.plain(loc(v, lang)) : loc(v, lang);
        const rows = ['#separator:tab', '#html:true', '#tags column:3'];
        const cell = s => s.replace(/\t/g, ' ').replace(/\r?\n/g, ' ');
        (exam.questions || []).forEach(q => {
            const type = App.questionType(q);
            let front = esc(L(q.text !== undefined ? q.text : q.question)), back = '';
            if (type === 'single' || type === 'multiple') {
                const ans = Array.isArray(q.answer) ? q.answer : [q.answer];
                front += '<br><br>' + q.options.map((o, i) => LETTERS[i] + ') ' + esc(L(o))).join('<br>');
                back = ans.map(i => '<b>' + LETTERS[i] + ') ' + esc(L(q.options[i])) + '</b>').join('<br>');
            } else if (type === 'truefalse') { front += '<br><i>True / False</i>'; back = '<b>' + (q.answer ? 'True' : 'False') + '</b>'; }
            else if (type === 'numeric') { const a = typeof q.answer === 'object' ? q.answer : { value: q.answer }; back = '<b>' + a.value + (a.tolerance ? ' ±' + a.tolerance : '') + (a.unit ? ' ' + esc(a.unit) : '') + '</b>'; }
            else if (type === 'ordering') back = q.items.map((o, i) => '<b>' + (i + 1) + '.</b> ' + esc(L(o))).join('<br>');
            else if (type === 'matching') { front += '<br><br>' + q.pairs.map(p => esc(L(p.left))).join('<br>'); back = q.pairs.map(p => esc(L(p.left)) + ' → <b>' + esc(L(p.right)) + '</b>').join('<br>'); }
            else if (type === 'scenario') {
                front = esc(L(q.context)) + '<br><br>' + q.parts.map((p, i) => (i + 1) + '. ' + esc(L(p.text !== undefined ? p.text : p.question))).join('<br>');
                back = q.parts.map((p, i) => {
                    const pt = App.questionType(p), ans = Array.isArray(p.answer) ? p.answer : [p.answer];
                    return (i + 1) + '. <b>' + ((pt === 'single' || pt === 'multiple') ? ans.map(k => esc(L(p.options[k]))).join(' / ') : esc(String(typeof p.answer === 'object' ? p.answer.value : p.answer))) + '</b>';
                }).join('<br>');
            }
            if (q.explanation) back += '<br><br>' + esc(L(q.explanation));
            const tags = (q.topic ? [slug(L(exam.topics && exam.topics[q.topic] !== undefined ? exam.topics[q.topic] : q.topic))] : []).concat((q.tags || []).map(slug)).join(' ');
            rows.push(cell(front) + '\t' + cell(back) + '\t' + tags);
        });
        return rows.join('\n') + '\n';
    }

    return { parseText, buildExam, toMarkdown, toCSV, fromCSV, toAnki, parseAnswerValue, slug, CSV_COLUMNS };
})();

/* Automatic question-quality detection from the answers collected on this device.
   Pure logic: works on an exam and a map of per-question stats ({seen, correct, wrong, time, picks}). */
App.quality = (function () {
    const MIN_SEEN = 5;

    // Returns a list of findings: {uid, id, kind, severity, params}.
    // kinds: tooEasy, tooHard, dubiousKey, weakDistractor, slow, difficultyMismatch
    function analyze(exam, qstats) {
        const out = [];
        qstats = qstats || {};
        exam.questions.forEach(q => {
            const s = qstats[q.uid];
            if (!s || (s.seen || 0) < MIN_SEEN) return;
            const acc = s.correct / s.seen;
            const add = (kind, severity, params) => out.push({ uid: q.uid, id: q.id, kind, severity, params: params || {} });
            const type = q.type || App.questionType(q);
            if (acc >= 0.95 && s.seen >= MIN_SEEN) add('tooEasy', 1, { pct: Math.round(acc * 100), n: s.seen });
            if (acc <= 0.25) add('tooHard', 2, { pct: Math.round(acc * 100), n: s.seen });
            if (q.difficulty === 1 && acc <= 0.4) add('difficultyMismatch', 1, { pct: Math.round(acc * 100), d: 1 });
            if (q.difficulty === 3 && acc >= 0.9) add('difficultyMismatch', 1, { pct: Math.round(acc * 100), d: 3 });
            const avg = s.time && s.seen ? s.time / s.seen : 0;
            const est = q.estimatedSec || 0;
            if (est && avg > est * 3 && s.seen >= MIN_SEEN) add('slow', 1, { avg: Math.round(avg), est });
            if ((type === 'single' || type === 'multiple') && s.picks && Array.isArray(q.options)) {
                const ans = Array.isArray(q.answer) ? q.answer : [q.answer];
                const total = Object.values(s.picks).reduce((a, b) => a + b, 0);
                const wrongPicks = q.options.map((_, i) => ans.includes(i) ? 0 : (s.picks[i] || 0));
                const wrongTotal = wrongPicks.reduce((a, b) => a + b, 0);
                // everybody who is wrong picks the same distractor, and accuracy is very low: the key may be wrong
                if (type === 'single' && s.seen >= 8 && acc <= 0.15 && wrongTotal >= 6 && Math.max(...wrongPicks) / wrongTotal >= 0.7) {
                    const top = wrongPicks.indexOf(Math.max(...wrongPicks));
                    add('dubiousKey', 3, { opt: 'ABCDEF'[top], pct: Math.round(100 * acc) });
                }
                // a distractor nobody ever picks does not distract
                if (total >= 10) {
                    const dead = q.options.map((_, i) => i).filter(i => !ans.includes(i) && !(s.picks[i] > 0));
                    if (dead.length && q.options.length - ans.length >= 2) add('weakDistractor', 1, { opts: dead.map(i => 'ABCDEF'[i]).join(', '), n: total });
                }
            }
        });
        return out.sort((a, b) => b.severity - a.severity);
    }

    // Structural checks that need no answers: very short options, duplicates, "all of the above" patterns, long option imbalance.
    function structural(exam) {
        const out = [];
        exam.questions.forEach(q => {
            const type = q.type || App.questionType(q);
            if (type !== 'single' && type !== 'multiple') return;
            const texts = q.options.map(o => App.rich.plain(App.loc(o)).trim());
            const add = (kind, params) => out.push({ uid: q.uid, id: q.id, kind, severity: 1, params: params || {} });
            if (new Set(texts.map(t => t.toLowerCase())).size < texts.length) add('duplicateOptions');
            if (texts.some(t => /^(all|none) of the above|^(tutte|nessuna) (le precedenti|delle precedenti)/i.test(t))) add('allOfAbove');
            const ans = Array.isArray(q.answer) ? q.answer : [q.answer];
            const lens = texts.map(t => t.length);
            if (type === "single" && lens.length >= 3 && lens[ans[0]] >= 12 && lens[ans[0]] > 1.8 * Math.max(...lens.filter((_, i) => i !== ans[0]))) add('correctMuchLonger');
        });
        return out;
    }

    return { analyze, structural, MIN_SEEN };
})();

/* Finding exams on disk.
   1) Folder access (File System Access API, Chromium browsers): the user picks a folder once, the browser remembers it,
      and "Check for exams" re-reads the .exam files in it — no build step. Cards come straight from the files.
   2) Folder import (any browser): pick a folder, every .exam in it is copied into the local library.
   Both share the same reader, which validates each file and reports the ones it cannot use. */
App.folder = (function () {
    const state = { name: null, access: 'none', count: 0, bad: [], at: 0 };   // access: none | granted | prompt | denied
    let handle = null, entries = [], cache = new Map();

    const supported = () => typeof window !== 'undefined' && typeof window.showDirectoryPicker === 'function';
    const baseName = n => String(n).replace(/\.exam$/i, '');

    // ---- remembered folder handle (IndexedDB, separate tiny database) ----
    function db() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open('examsim-fs', 1);
            req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains('h')) req.result.createObjectStore('h'); };
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });
    }
    async function load() { try { const d = await db(); return await new Promise(r => { const q = d.transaction('h').objectStore('h').get('dir'); q.onsuccess = () => r(q.result || null); q.onerror = () => r(null); }); } catch (e) { return null; } }
    async function store(h) {
        try { const d = await db(); await new Promise((res, rej) => { const t = d.transaction('h', 'readwrite'); if (h) t.objectStore('h').put(h, 'dir'); else t.objectStore('h').delete('dir'); t.oncomplete = res; t.onerror = t.onabort = rej; }); return true; }
        catch (e) { return false; }      // not clonable (tests) or storage blocked: the folder is then remembered for this visit only
    }

    // ---- reading ----
    // files: [{name, text}] -> {ok: [{name, key, data, exam}], bad: [{name, message}]}
    function readFiles(files) {
        const ok = [], bad = [];
        files.forEach(f => {
            const key = baseName(f.name);
            try {
                const data = App.loader.parseText(f.text);
                if (!data) throw new App.loader.LoadError('parse', { detail: 'not an ExamSim file' });
                const { exam, report } = App.schema.prepare(data, key);
                if (!exam) { bad.push({ name: f.name, message: report.errors.slice(0, 3).map(e => e.path + ': ' + e.message).join(' · ') }); return; }
                ok.push({ name: f.name, key, data, exam });
            } catch (e) {
                bad.push({ name: f.name, message: e instanceof App.loader.LoadError ? App.loader.describe(Object.assign(e, { name: f.name })).join(' ') : String(e && e.message || e) });
            }
        });
        return { ok, bad };
    }

    const entryOf = x => ({
        id: x.exam.id, file: 'disk:' + x.key, title: x.exam.title, description: x.exam.description, code: x.exam.code, version: x.exam.version,
        questionCount: x.exam.questions.length, topicCount: x.exam.topicList.length, disk: true
    });

    async function scan() {
        const files = [], unreadable = [];
        for await (const [name, h] of handle.entries()) {
            if (h.kind !== 'file' || !/\.exam$/i.test(name)) continue;
            try { files.push({ name, text: await (await h.getFile()).text() }); } catch (e) { unreadable.push({ name, message: String(e && e.message || e) }); }
        }
        files.sort((a, b) => a.name.localeCompare(b.name));
        const r = readFiles(files);
        entries = r.ok.map(entryOf);
        cache = new Map(r.ok.map(x => [x.key, x.data]));
        state.count = entries.length; state.bad = r.bad.concat(unreadable); state.at = Date.now(); state.name = handle.name;
        App.events.emit('catalogChange', { source: 'folder' });
        return { found: entries.length, bad: state.bad };
    }

    async function permission(ask) {
        if (!handle.queryPermission) return 'granted';
        const o = { mode: 'read' };
        let p = await handle.queryPermission(o);
        if (p !== 'granted' && ask && handle.requestPermission) p = await handle.requestPermission(o);
        return p;
    }

    const api = {
        supported, state,
        entries: () => entries,
        get: key => cache.get(key) || null,
        hasFolder: () => !!handle,
        readFiles,

        // At start-up: use the remembered folder when the browser still allows it without asking.
        async restore() {
            if (!supported()) return false;
            handle = await load();
            if (!handle) return false;
            state.name = handle.name;
            state.access = await permission(false).catch(() => 'prompt');
            if (state.access === 'granted') { try { await scan(); } catch (e) { state.access = 'prompt'; } }
            return state.access === 'granted';
        },
        // Uses a directory handle (also what the tests pass in). Remembers it when possible.
        async useHandle(h) {
            handle = h; state.name = h.name; state.access = 'granted';
            await store(h);
            return scan();
        },
        async choose() {
            const h = await window.showDirectoryPicker({ id: 'examsim', mode: 'read' });
            return api.useHandle(h);
        },
        // The "Check for exams" button: ask permission again if needed, then re-read the folder.
        async rescan() {
            if (!handle) return api.choose();
            state.access = await permission(true);
            if (state.access !== 'granted') { state.access = 'denied'; throw new Error('denied'); }
            return scan();
        },
        async forget() { handle = null; entries = []; cache = new Map(); state.name = null; state.access = 'none'; state.count = 0; state.bad = []; await store(null); App.events.emit('catalogChange', { source: 'folder' }); },

        // Fallback for every browser: copies the exams found in `files` into the local library.
        // Exams already bundled with the app (same id) are skipped; exams already in the library are updated.
        importFiles(files) {
            const r = readFiles(files);
            const bundled = new Set((App.loader.baseCatalog() || []).map(c => c.id || c.file));
            const out = { added: 0, updated: 0, bundled: 0, bad: r.bad.slice() };
            r.ok.forEach(x => {
                const id = x.exam.id;
                if (bundled.has(id)) { out.bundled++; return; }
                const existed = App.library.has(id);
                const raw = Object.assign({}, x.data.format === undefined ? App.schema.fromLegacy(x.data, x.key) : x.data, { id });
                const res = App.library.save(raw);
                if (res.ok) { if (existed) out.updated++; else out.added++; }
                else out.bad.push({ name: x.name, message: res.report.errors.slice(0, 2).map(e => e.path + ': ' + e.message).join(' · ') });
            });
            return out;
        }
    };
    return api;
})();

/* Study modes and spaced repetition (Leitner boxes). Pure logic, no DOM. */
(function () {
    const { shuffle } = App.util;
    const DAY = 86400000;
    const INTERVAL_DAYS = [0, 1, 3, 7, 21];   // wait before a question is due again, per box
    const MAX_BOX = INTERVAL_DAYS.length - 1;

    App.srs = {
        DAY, INTERVAL_DAYS,
        update(stat, ok, sec, now) {
            const s = Object.assign({}, stat);
            s.seen = (s.seen || 0) + 1;
            if (ok) s.correct = (s.correct || 0) + 1; else s.wrong = (s.wrong || 0) + 1;
            s.box = ok ? Math.min((s.box || 0) + 1, MAX_BOX) : 0;
            s.due = now + INTERVAL_DAYS[s.box] * DAY;
            s.last = now;
            s.lastOk = !!ok;
            s.time = (s.time || 0) + (sec || 0);
            return s;
        },
        isDue: (stat, now, q) => !!stat && stat.seen > 0 && ((stat.due || 0) <= now || !!(q && (q.rev || 1) > (stat.rev || 1))),   // a revised question comes back for review
        isMastered: stat => !!stat && (stat.box || 0) >= 3
    };

    // Records one answer in the persistent per-question stats.
    // extra: {picks: [position in the exam file of each option chosen], rev}
    App.recordAnswer = function (examId, uid, ok, sec, storage, now, extra) {
        storage = storage || App.storage;
        now = now || Date.now();
        extra = extra || {};
        storage.patchQStat(examId, uid, cur => {
            const s = App.srs.update(cur, ok, sec, now);
            if (extra.rev) s.rev = extra.rev;
            if (extra.picks && extra.picks.length) {
                s.picks = Object.assign({}, cur.picks);
                extra.picks.forEach(i => { s.picks[i] = (s.picks[i] || 0) + 1; });
            }
            return s;
        });
        App.events.emit('answerRecorded', { examId, uid, ok });
    };

    function byTopic(questions) {
        const m = {};
        questions.forEach(q => (m[q.topic] = m[q.topic] || []).push(q));
        return m;
    }

    function balanced(questions, count) {
        const groups = byTopic(questions);
        const pool = Object.keys(groups).map(t => shuffle(groups[t])[0]);
        const used = new Set(pool.map(q => q.uid));
        pool.push(...shuffle(questions.filter(q => !used.has(q.uid))).slice(0, Math.max(0, count - pool.length)));
        return shuffle(pool).slice(0, count);
    }

    function weighted(questions, mode) {
        const groups = byTopic(questions);
        const pool = [], used = new Set();
        mode.groups.forEach(g => {
            let remaining = g.weight;
            for (let round = 0; remaining > 0 && round < 100; round++) {
                for (const topic of shuffle(g.topics)) {
                    if (remaining <= 0) break;
                    const q = shuffle((groups[topic] || []).filter(x => !used.has(x.uid)))[0];
                    if (!q) continue;
                    used.add(q.uid); pool.push(q); remaining--;
                }
                if (!g.topics.some(t => (groups[t] || []).some(x => !used.has(x.uid)))) break;
            }
        });
        const count = mode.count || pool.length;
        if (pool.length < count) pool.push(...shuffle(questions.filter(q => !used.has(q.uid))).slice(0, count - pool.length));
        return shuffle(pool).slice(0, count);
    }

    // Lists the modes offered for an exam. `stats` = per-question stats map, used to size the practice pools.
    App.modes = {
        list(exam, stats, now) {
            now = now || Date.now();
            stats = stats || {};
            const out = [];
            exam.modes.forEach(m => out.push({
                id: m.id, group: 'exam', label: m.name, defined: m, studyDefault: !m.exam,
                count: m.count, available: exam.questions.length
            }));
            out.push({ id: 'all', group: 'practice', labelKey: 'modeAll', labelParams: { n: exam.questions.length }, studyDefault: true, available: exam.questions.length });
            exam.topicList.forEach(t => out.push({
                id: 'topic:' + t, group: 'topic', labelKey: 'modeTopic', labelParams: { t: (exam.topics && exam.topics[t]) ? exam.topics[t] : t },
                studyDefault: true, available: exam.questions.filter(q => q.topic === t).length
            }));
            const poolSize = id => App.modes.pool(exam, id, stats, now).questions.length;
            ['review', 'mistakes', 'flagged', 'unseen'].forEach(id => out.push({
                id, group: 'practice', labelKey: { review: 'modeReview', mistakes: 'modeMistakes', flagged: 'modeFlagged', unseen: 'modeUnseen' }[id],
                studyDefault: true, available: poolSize(id), defaultCount: id === 'flagged' ? undefined : 20
            }));
            if (exam.hasDifficulty) [1, 2, 3].forEach(d => out.push({
                id: 'difficulty:' + d, group: 'practice', labelKey: 'modeDifficulty', labelParams: { d: App.t(['', 'diffEasy', 'diffMedium', 'diffHard'][d]) },
                studyDefault: true, available: exam.questions.filter(q => q.difficulty === d).length
            }));
            return out;
        },

        // All questions that belong to a practice mode (before applying the count).
        pool(exam, id, stats, now) {
            now = now || Date.now();
            stats = stats || {};
            const qs = exam.questions;
            if (id === 'all') return { questions: qs.slice() };
            if (id.startsWith('topic:')) return { questions: qs.filter(q => q.topic === id.slice(6)) };
            if (id.startsWith('difficulty:')) return { questions: qs.filter(q => q.difficulty === Number(id.slice(11))) };
            if (id === 'flagged') return { questions: qs.filter(q => stats[q.uid] && stats[q.uid].flag) };
            if (id === 'unseen') return { questions: qs.filter(q => !stats[q.uid] || !stats[q.uid].seen) };
            if (id === 'mistakes') {
                return { questions: qs.filter(q => { const s = stats[q.uid]; return s && s.seen && s.lastOk === false; }) };   // latest answer was wrong
            }
            if (id === 'review') {
                const seen = qs.filter(q => stats[q.uid] && stats[q.uid].seen);
                const due = seen.filter(q => App.srs.isDue(stats[q.uid], now, q)).sort((a, b) => (stats[a.uid].due || 0) - (stats[b.uid].due || 0));
                if (due.length) return { questions: due };
                const weakest = seen.slice().sort((a, b) => (stats[a.uid].box || 0) - (stats[b.uid].box || 0) || (stats[a.uid].due || 0) - (stats[b.uid].due || 0));
                return { questions: weakest, fallback: true };
            }
            if (App.modeBuilders[id]) return { questions: App.modeBuilders[id](exam, stats, now) };
            return { questions: [] };
        },

        // Picks the questions for a session. opts.count caps the number of questions.
        pick(exam, id, stats, opts) {
            opts = opts || {};
            const now = opts.now || Date.now();
            const defined = exam.modes.find(m => m.id === id);
            let qs, fallback = false;
            if (defined) {
                const count = opts.count || defined.count || exam.questions.length;
                if (defined.selection === 'weighted') qs = weighted(exam.questions, Object.assign({}, defined, { count }));
                else if (defined.selection === 'balanced') qs = balanced(exam.questions, count);
                else qs = shuffle(exam.questions).slice(0, count);
            } else {
                const p = App.modes.pool(exam, id, stats, now);
                fallback = !!p.fallback;
                qs = p.questions;
                const ordered = id === 'all' || id.startsWith('topic:');
                if (id === 'review' || id === 'mistakes') qs = shuffle(qs.slice(0, opts.count || 20));
                else if (ordered && (!opts.count || opts.count >= qs.length)) qs = qs.slice();   // whole pool: keep file order
                else qs = shuffle(qs).slice(0, opts.count || qs.length);
            }
            return { questions: qs, fallback };
        }
    };
})();

/* Statistics computed from attempts and per-question stats (exam-agnostic, no DOM). */
App.stats = {
    compute(exam, storage, now) {
        storage = storage || App.storage;
        now = now || Date.now();
        const attempts = storage.listAttempts(exam.id).sort((a, b) => a.ts - b.ts);
        const qstats = storage.allQStats(exam.id);
        const byUid = {};
        exam.questions.forEach(q => { byUid[q.uid] = q; });

        let answered = 0, correct = 0, time = 0, mastered = 0, seenQuestions = 0, flagged = 0;
        const topics = {};
        exam.topicList.forEach(t => { topics[t] = { topic: t, total: exam.questions.filter(q => q.topic === t).length, seen: 0, correct: 0, wrong: 0, mastered: 0, answeredQuestions: 0 }; });
        const hard = [];

        Object.keys(qstats).forEach(uid => {
            const q = byUid[uid], s = qstats[uid];
            if (!q || !s) return;
            if (s.flag) flagged++;
            if (!s.seen) return;
            answered += s.seen; correct += s.correct || 0; time += s.time || 0;
            seenQuestions++;
            if (App.srs.isMastered(s)) mastered++;
            const t = topics[q.topic];
            t.seen += s.seen; t.correct += s.correct || 0; t.wrong += s.wrong || 0; t.answeredQuestions++;
            if (App.srs.isMastered(s)) t.mastered++;
            if ((s.wrong || 0) > 0) hard.push({ uid, topic: q.topic, text: q.text, seen: s.seen, wrong: s.wrong, rate: s.wrong / s.seen, last: s.last });
        });

        hard.sort((a, b) => b.rate - a.rate || b.wrong - a.wrong || b.seen - a.seen);
        const topicList = Object.values(topics).map(t => Object.assign(t, { pct: t.seen ? Math.round(100 * t.correct / t.seen) : null }));
        const pcts = attempts.map(a => a.pct);

        return {
            attempts, attemptCount: attempts.length,
            bestPct: pcts.length ? Math.max(...pcts) : null,
            avgPct: pcts.length ? Math.round(pcts.reduce((a, b) => a + b, 0) / pcts.length) : null,
            answered, correct, accuracy: answered ? Math.round(100 * correct / answered) : null,
            avgTimeSec: answered ? Math.round(time / answered) : null,
            seenQuestions, mastered, flagged, totalQuestions: exam.questions.length,
            topics: topicList, hardest: hard.slice(0, 10)
        };
    }
};

/* A practice session: items, answers, timers, scoring. No DOM, fully serializable. */
App.Session = (function () {
    const hint = x => x;

    class Session {
        constructor(data) { Object.assign(this, data); }

        // questions: raw question defs; options: {examId, modeId, modeLabel, studyMode, timerMode, totalSec, perQuestionSec, threshold, shuffleOptions}
        static create(questions, options) {
            const items = questions.map(q => App.prepareQuestion(q, { shuffleOptions: options.shuffleOptions !== false }));
            const timerMode = options.timerMode || 'total';
            return new Session({
                id: App.util.uid(), examId: options.examId, modeId: options.modeId, modeLabel: options.modeLabel || options.modeId,
                createdAt: Date.now(), updatedAt: Date.now(), studyMode: !!options.studyMode, threshold: options.threshold,
                scoring: App.scoring.clean(options.scoring), items, index: 0, values: {}, validated: {}, applied: {}, times: {},
                timerMode, totalSec: options.totalSec || 0, secondsLeft: options.totalSec || 0,
                perQuestionSec: options.perQuestionSec || 0, qLeft: options.perQuestionSec || 0,
                pausesAllowed: options.pauses === undefined ? null : options.pauses, pausesUsed: 0, paused: false, strictTime: !!options.strictTime
            });
        }

        static fromJSON(obj) { return new Session(App.util.clone(obj)); }
        toJSON() { return Object.assign({}, this); }

        get length() { return this.items.length; }
        item(i) { return this.items[i === undefined ? this.index : i]; }
        handler(i) { return App.types[this.item(i).kind]; }
        value(i) { return this.values[i === undefined ? this.index : i]; }
        setValue(i, v) { this.values[i] = v; }
        hasAnswer(i) { return this.handler(i).hasAnswer(this.item(i), this.values[i]); }
        isCorrect(i) { return this.hasAnswer(i) && this.handler(i).isCorrect(this.item(i), this.values[i]); }
        isChecked(i) { return this.validated[i] !== undefined; }
        answeredCount() { let n = 0; for (let i = 0; i < this.length; i++) if (this.hasAnswer(i)) n++; return n; }
        unanswered() { const out = []; for (let i = 0; i < this.length; i++) if (!this.hasAnswer(i)) out.push(i); return out; }

        goTo(i) {
            if (i < 0 || i >= this.length) return false;
            this.index = i;
            if (this.timerMode === 'perQuestion') this.qLeft = this.perQuestionSec;
            return true;
        }

        // Study mode: check one answer now (locks it and records the result in the SRS stats).
        check(i, storage) {
            if (this.isChecked(i)) return this.validated[i];
            if (!this.hasAnswer(i)) return null;
            const ok = this.isCorrect(i);
            this.validated[i] = ok;
            this._record(i, ok, storage);
            return ok;
        }

        _record(i, ok, storage) {
            if (this.applied[i]) return;
            this.applied[i] = true;
            const it = this.item(i), v = this.values[i];
            let picks;
            if ((it.kind === 'single' || it.kind === 'multiple') && it.origin && v !== undefined) picks = (Array.isArray(v) ? v : [v]).map(k => it.origin[k]).filter(k => k !== undefined);
            App.recordAnswer(this.examId, it.uid, ok, this.times[i] || 0, storage, undefined, { picks, rev: it.rev });
        }

        canPause() { return this.timerMode !== 'none' && !this.paused && (this.pausesAllowed === null || this.pausesUsed < this.pausesAllowed); }
        pausesLeft() { return this.pausesAllowed === null ? null : Math.max(0, this.pausesAllowed - this.pausesUsed); }
        pause() { if (!this.canPause()) return false; this.paused = true; this.pausesUsed++; return true; }
        unpause() { this.paused = false; }

        // Strict time: the clock kept running while the session was closed.
        applyAway(now) {
            if (!this.strictTime || this.paused || this.timerMode !== 'total') return 0;
            const away = Math.max(0, Math.round(((now || Date.now()) - this.updatedAt) / 1000));
            this.secondsLeft = Math.max(0, this.secondsLeft - away);
            return away;
        }

        // Pace for a total timer: positive = ahead of schedule (answers vs. time used).
        pace() {
            if (this.timerMode !== 'total' || !this.totalSec) return null;
            const used = this.totalSec - this.secondsLeft;
            const expected = this.length * used / this.totalSec;
            return Math.round((this.answeredCount() - expected) * 10) / 10;
        }

        // Called once per second by the UI. Returns 'total' | 'question' when a timer runs out.
        tick() {
            if (this.paused) return null;
            this.times[this.index] = (this.times[this.index] || 0) + 1;
            if (this.timerMode === 'total') {
                this.secondsLeft = Math.max(0, this.secondsLeft - 1);
                if (this.secondsLeft <= 0) return 'total';
            } else if (this.timerMode === 'perQuestion') {
                this.qLeft = Math.max(0, this.qLeft - 1);
                if (this.qLeft <= 0) return 'question';
            }
            return null;
        }

        scoreNow() { return App.scoring.score(this.items, this.values, this.scoring); }
        fraction(i) { return App.fractionOf(this.item(i), this.values[i], this.scoring); }

        // Scores the session. Returns the attempt record (also emitted as 'sessionEnd').
        submit(storage, now) {
            now = now || Date.now();
            const r = this.scoreNow();
            const answers = [];
            for (let i = 0; i < this.length; i++) {
                const answered = r.details[i].answered;
                const ok = answered && this.isCorrect(i);
                if (answered && !this.applied[i]) this._record(i, ok, storage);
                answers.push([this.item(i).uid, ok ? 1 : 0, this.times[i] || 0, answered ? 1 : 0, Math.round(r.details[i].frac * 100) / 100]);
            }
            const total = this.length;
            const passed = r.pct >= this.threshold && !r.mandatoryFailed.length;
            const attempt = {
                id: App.util.uid(), ts: now, started: this.createdAt, mode: this.modeId, modeLabel: this.modeLabel,
                studyMode: this.studyMode, durationSec: Object.values(this.times).reduce((a, b) => a + b, 0),
                total, correct: r.fully, partial: r.partial, pct: r.pct, score: r.score, maxScore: r.max, threshold: this.threshold,
                passed, mandatoryFailed: r.mandatoryFailed.length, scoring: r.custom ? r.cfg : undefined, answers
            };
            App.events.emit('sessionEnd', { session: this, attempt });
            return attempt;
        }
    }
    return Session;
})();

/* Exam loading. Exam files look like:   ExamSim.register({ ...pure JSON... });
   - over http(s) the text is fetched and the JSON is parsed WITHOUT executing it;
   - from file:// (where fetch is blocked) a <script> tag is used instead;
   - legacy files (window.ExamData = {...}) still load through the script path. */
App.loader = (function () {
    let pending = null;

    class LoadError extends Error {
        constructor(code, info) { super(code); this.code = code; Object.assign(this, info || {}); }
    }

    function register(data) { pending = data; }

    // Extracts the JSON argument of ExamSim.register(...). Returns null when the text is not in that shape.
    function parseText(text) {
        const t = String(text).replace(/^﻿/, '').replace(/^(\s*(\/\/[^\n]*\n|\/\*[\s\S]*?\*\/))*/, '').trim();
        const m = t.match(/^ExamSim\.register\(([\s\S]*)\)\s*;?\s*$/);
        if (!m) {
            if (t.startsWith('{')) { try { return JSON.parse(t); } catch (e) { throw new LoadError('parse', { detail: e.message }); } }
            return null;
        }
        try { return JSON.parse(m[1]); } catch (e) { throw new LoadError('parse', { detail: e.message }); }
    }

    function finalize(data, fileId, label) {
        const { exam, report } = App.schema.prepare(data, fileId);
        if (!exam) throw new LoadError('invalid', { report, name: label || fileId });
        exam.sourceFile = fileId;
        return exam;
    }

    async function fetchText(url, name) {
        let resp;
        try { resp = await fetch(url, { cache: 'no-cache' }); } catch (e) { throw new LoadError('network', { name }); }
        if (resp.status === 404) throw new LoadError('notFound', { name });
        if (!resp.ok) throw new LoadError('network', { name });
        return resp.text();
    }

    function loadScript(url, name) {
        return new Promise((resolve, reject) => {
            const s = document.createElement('script');
            s.src = url;
            s.onload = () => { s.remove(); resolve(); };
            s.onerror = () => { s.remove(); reject(new LoadError('notFound', { name })); };
            document.head.appendChild(s);
        });
    }

    const isHttp = () => typeof location !== 'undefined' && /^https?:$/.test(location.protocol);

    async function loadByName(name) {
        if (name.startsWith('disk:')) {
            const key = name.slice(5);
            const data = App.folder && App.folder.get(key);
            if (!data) throw new LoadError('diskAccess', { name: key + '.exam' });
            const exam = finalize(data, key, key + '.exam');
            exam.sourceFile = name; exam.disk = true;
            return exam;
        }
        if (name.startsWith('local:')) {
            const id = name.slice(6);
            const raw = App.library && App.library.get(id);
            if (!raw) throw new LoadError('notFound', { name });
            const exam = finalize(raw, id, name);
            exam.sourceFile = name; exam.local = true;
            return exam;
        }
        const file = name + '.exam';
        let data = null;
        pending = null;
        if (isHttp()) {
            try { data = parseText(await fetchText(file, file)); }
            catch (e) { if (e.code === 'notFound' || e.code === 'parse') { if (!e.name || e.name === 'LoadError' || e.name === 'Error') e.name = file; throw e; } /* network trouble: try the script path */ }
        }
        if (!data) {
            pending = null;
            try { delete window.ExamData; } catch (e) { window.ExamData = undefined; }
            await loadScript(file, file);
            data = pending || window.ExamData;
            try { delete window.ExamData; } catch (e) { window.ExamData = undefined; }
            if (!data) throw new LoadError('noRegister', { name: file });
        }
        return finalize(data, name, file);
    }

    async function loadByUrl(url) {
        let u;
        try { u = new URL(url, location.href); } catch (e) { throw new LoadError('network', { name: url }); }
        if (!/^https?:$/.test(u.protocol)) throw new LoadError('network', { name: url });
        const data = parseText(await fetchText(u.href, url));
        if (!data) throw new LoadError('parse', { name: url, detail: 'not an ExamSim format 2 file' });
        const base = (u.pathname.split('/').pop() || 'remote').replace(/\.exam$|\.json$/g, '').replace(/[^\w.\-]/g, '_');
        return finalize(data, base || 'remote', url);
    }

    // Exam list: exams.js (generated, optional) overrides the list embedded in exam.html at build time.
    function baseCatalog() {
        if (typeof window === 'undefined') return [];
        if (Array.isArray(window.ExamCatalog) && window.ExamCatalog.length) return window.ExamCatalog;
        return Array.isArray(window.ExamCatalogDefault) ? window.ExamCatalogDefault : [];
    }
    // Bundled list + the user's own exams + exams found in the chosen folder. Same id: the fresher source wins (folder > mine > bundled).
    function catalog() {
        const out = [];
        const put = item => { const id = item.id || item.file; const i = out.findIndex(x => (x.id || x.file) === id); if (i >= 0) out[i] = item; else out.push(item); };
        baseCatalog().forEach(put);
        (App.library ? App.library.list() : []).forEach(put);
        (App.folder ? App.folder.entries() : []).forEach(put);
        return out;
    }

    // Human-readable message for a load error.
    function describe(err) {
        const T = App.t;
        const name = err.name || '';
        switch (err.code) {
            case 'notFound': return [T('errNotFound', { name })];
            case 'network': return [T('errNetwork', { name })];
            case 'parse': return [T('errParse', { name: name || '', detail: err.detail || '' })];
            case 'noRegister': return [T('errNoRegister', { name })];
            case 'diskAccess': return [T('errDiskAccess', { name })];
            case 'invalid': {
                const lines = (err.report && err.report.errors || []).slice(0, 6).map(e => '• ' + e.path + ': ' + e.message);
                return [T('errInvalid', { name, n: err.report ? err.report.errors.length : '?' })].concat(lines);
            }
            default: return [String(err && err.message || err)];
        }
    }

    return { register, parseText, finalize, loadByName, loadByUrl, catalog, baseCatalog, describe, LoadError };
})();

if (typeof window !== 'undefined') window.ExamSim = { register: d => App.loader.register(d), version: App.version, App };

/* UI: shared state, view switching, toast, theme/language, header, small widgets. */
App.state = { exam: null, session: null, screen: 'picker', loadError: null, lastResult: null, dash: {}, clockTimer: null, persistTimer: null };
App.ui = {};

(function () {
    const { el, icon } = App.util;
    const $ = id => document.getElementById(id);
    App.ui.$ = $;

    const VIEWS = ['picker', 'dashboard', 'runtime', 'review', 'summary', 'stats', 'options', 'library', 'search'];
    App.ui.show = function (view) {

        document.body.dataset.view = view;

    };
    App.events.on('storageError', () => App.ui.toast(App.t('storageError'), 6000));

    App.ui.fmtTime = function (sec) {
        sec = Math.max(0, Math.round(sec));
        const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
        const mm = String(m).padStart(2, '0'), ss = String(s).padStart(2, '0');
        return h ? h + ':' + mm + ':' + ss : mm + ':' + ss;
    };

    App.ui.timeAgo = function (ts) {

        if (d < 60) return App.t('justNow');
        if (d < 3600) return App.t('minutesAgo', { n: Math.round(d / 60) });
        if (d < 86400) return App.t('hoursAgo', { n: Math.round(d / 3600) });
        return App.t('daysAgo', { n: Math.round(d / 86400) });
    };

    // Button with an icon and a text label
    App.ui.btn = function (label, iconName, cls, onclick, extra) {
        return el('button', Object.assign({ type: 'button', class: 'btn ' + (cls || ''), onclick }, extra || {}), iconName ? icon(iconName, 17) : null, label ? el('span', { text: label }) : null);
    };

    // Circular progress ring (SVG). Returns {svg}; animates from empty.
    App.ui.ring = function (pct, color, size, stroke) {
        const NS = 'http://www.w3.org/2000/svg';
        const r = 52, c = 2 * Math.PI * r;
        const svg = document.createElementNS(NS, 'svg');
        svg.setAttribute('viewBox', '0 0 120 120');
        svg.setAttribute('aria-hidden', 'true');
        const mk = (cls, stk) => {
            const circ = document.createElementNS(NS, 'circle');
            circ.setAttribute('cx', 60); circ.setAttribute('cy', 60); circ.setAttribute('r', r);
            circ.setAttribute('fill', 'none'); circ.setAttribute('stroke-width', stroke || 10); circ.setAttribute('stroke-linecap', 'round');
            circ.setAttribute('class', cls); if (stk) circ.setAttribute('stroke', stk);
            return circ;
        };
        const bg = mk('ring-bg'); bg.setAttribute('stroke', 'currentColor'); bg.style.opacity = '0.18';
        const fg = mk('ring-fg', color);
        fg.setAttribute('stroke-dasharray', c); fg.setAttribute('stroke-dashoffset', c);
        svg.appendChild(bg); svg.appendChild(fg);
        requestAnimationFrame(() => requestAnimationFrame(() => fg.setAttribute('stroke-dashoffset', c * (1 - Math.max(0, Math.min(100, pct)) / 100))));
        return svg;
    };

    // ---- language / theme are per device: stored outside the profile data ----
    const UI_KEY = 'examsim:ui';
    const rawBackend = () => App.backend || App.defaultBackend();
    // Language and theme are also mirrored in localStorage: it is synchronous, so the choice survives even a reload right after the click.
    App.ui.getGlobal = function (k) {
        try { const m = localStorage.getItem('examsim:ui:' + k); if (m) return m; } catch (e) { /* storage blocked */ }
        try { const o = JSON.parse(rawBackend().getItem(UI_KEY)) || {}; if (o[k] !== undefined) return o[k]; } catch (e) { /* fall through */ }
        return App.storage.getPref(k);
    };
    App.ui.setGlobal = function (k, v) {
        let o = {};
        try { o = JSON.parse(rawBackend().getItem(UI_KEY)) || {}; } catch (e) { o = {}; }
        o[k] = v;
        try { localStorage.setItem('examsim:ui:' + k, v); } catch (e) { /* mirror is optional */ }
        try { rawBackend().setItem(UI_KEY, JSON.stringify(o)); if (rawBackend().flush) rawBackend().flush(); } catch (e) { App.events.emit('storageError', e); }
    };

    // ---- modal dialog ----
    // App.ui.modal({title, body: Node, actions: [{label, cls, onclick, close:true}], wide}) -> {close, root}
    App.ui.modal = function (opts) {
        const prev = document.activeElement;
        const titleId = 'modal-title-' + App.util.uid();
        const root = el('div', { class: 'modal-backdrop', onclick: e => { if (e.target === root) close(); } });
        const card = el('div', { class: 'modal-card' + (opts.wide ? ' wide' : ''), role: 'dialog', aria: { modal: 'true', labelledby: titleId } });
        card.appendChild(el('div', { class: 'modal-head' }, el('h2', { id: titleId, text: opts.title || '' }),
            el('button', { type: 'button', class: 'icon-btn', 'aria-label': App.t('closeBtn'), onclick: () => close() }, icon('x', 18))));
        const body = el('div', { class: 'modal-body' }, opts.body);
        card.appendChild(body);
        if (opts.actions && opts.actions.length) {
            const bar = el('div', { class: 'modal-actions' });
            opts.actions.forEach(a => bar.appendChild(App.ui.btn(a.label, a.icon, a.cls || '', () => { if (a.onclick) { if (a.onclick() === false) return; } if (a.close !== false) close(); })));
            card.appendChild(bar);
        }
        root.appendChild(card);
        document.body.appendChild(root);
        function onKey(e) {
            if (e.key === 'Escape') { e.stopPropagation(); close(); return; }
            if (e.key === 'Tab') {      // keep focus inside the dialog
                const f = Array.from(card.querySelectorAll('button:not(:disabled), input:not(:disabled), select, textarea, a[href], [tabindex]:not([tabindex="-1"])')).filter(n => n.offsetParent !== null);
                if (!f.length) return;
                const first = f[0], last = f[f.length - 1];
                if (e.shiftKey && document.activeElement === first) { last.focus(); e.preventDefault(); }
                else if (!e.shiftKey && document.activeElement === last) { first.focus(); e.preventDefault(); }
            }
        }
        document.addEventListener('keydown', onKey, true);
        function close() {
            document.removeEventListener('keydown', onKey, true);
            root.remove();
            if (prev && prev.focus) { try { prev.focus(); } catch (e) { /* element gone */ } }
            if (opts.onclose) opts.onclose();
        }
        const firstField = card.querySelector('input, textarea, select') || card.querySelector('.modal-actions button, .modal-head button');
        if (firstField) setTimeout(() => firstField.focus(), 0);
        return { close, root, card };
    };
    App.ui.modalOpen = () => !!document.querySelector('.modal-backdrop');

    // Downloads text as a file
    App.ui.download = function (name, text, mime) {
        const blob = new Blob([text], { type: mime || 'text/plain' });
        const a = el('a', { href: URL.createObjectURL(blob), download: name });
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000);

    App.ui.resumeSession = function (session) {

            App.ui.toast(App.t('strictExpired'), 5000);

    function buildSkeleton() {

        refs.clear = el('button', { type: 'button', class: 'chip-btn', id: 'clear-btn', onclick: () => clearAnswer() });

        refs.noteArea.addEventListener('input', () => {
            const s = S(), uid = s.item().uid;

        refs.note = el('details', { class: 'note-box' }, refs.noteSummary, refs.noteArea);

        refs.check = el('button', { type: 'button', class: 'btn btn-dark', id: 'validate-btn', onclick: () => checkAnswer() });
        refs.next = el('button', { type: 'button', class: 'btn', id: 'session-action-trigger', onclick: () => nextQuestion() });
        refs.help = el('p', { class: 'kbd-help' });
        refs.legend = el('div', { class: 'legend' });
        refs.grid = el('div', { class: 'grid-navigation', role: 'group' });
        refs.gridTitle = el('span', {});
        refs.gridCount = el('span', { class: 'count' });
        refs.finish = el('button', { type: 'button', class: 'btn btn-danger btn-block', id: 'finish-btn', style: 'margin-top:12px', onclick: () => App.ui.openReview() });

        const main = el('div', { class: 'card q-card' },
            el('div', { class: 'q-bar' }, refs.bar),
            el('div', { class: 'q-top' }, refs.topic, el('div', { class: 'q-meta' }, refs.pace, refs.pos, refs.pause, refs.clear, refs.report, refs.flag)),
            refs.text, refs.body, refs.expl, refs.note,
            el('div', { class: 'actionbar' }, refs.prev, refs.check, el('span', { class: 'spacer' }), refs.next),
            refs.help);
        const panel = el('details', { class: 'panel', id: 'grid-panel' },
            el('summary', { class: 'panel-title' }, refs.gridTitle, el('span', { class: 'row', style: 'gap:8px' }, refs.gridCount, icon('chevron', 16))),

        const side = el('aside', { class: 'run-side' }, panel, refs.finish);

    function doPause() {
        const s = S();
        if (!s.pause()) return;

        renderPause();
    }
    function doUnpause() {
        const s = S();
        s.unpause();
        App.ui.persist();
        renderPause();
        App.events.emit('unpause', { session: s });
    }
    function renderPause() {
        const s = S();
        refs.overlay.classList.toggle('hidden', !s.paused);
        refs.overlay.textContent = '';
        if (s.paused) {
            refs.overlay.appendChild(el('div', { class: 'pause-card' },

                App.ui.btn(App.t('resumeExam'), 'play', 'btn-lg', () => doUnpause(), { id: 'unpause-btn' })));
            const b = refs.overlay.querySelector('button'); if (b) b.focus();
        }

        refs.pause.appendChild(el('span', { text: left === null ? App.t('pauseBtn') : (left > 0 ? App.t('pauseLeft', { n: left }) : App.t('pauseNone')) }));
    }
    function renderPace() {
        const s = S();
        const d = s.pace();
        if (d === null || s.studyMode) { refs.pace.classList.add('hidden'); return; }
        refs.pace.classList.remove('hidden', 'ok', 'warn', 'bad');
        const txt = d >= 1 ? App.t('paceAhead', { n: Math.floor(d) }) : (d <= -2 ? App.t('paceBehind', { n: Math.ceil(-d) }) : App.t('paceOn'));
        refs.pace.textContent = txt;
        refs.pace.classList.add(d >= 1 ? 'ok' : (d <= -2 ? 'bad' : 'warn'));
        refs.pace.classList.toggle('warn', d > -2 && d < 1);

    function topicName(t) {
        const ex = App.state.exam;
        return ex && ex.topics && ex.topics[t] ? App.loc(ex.topics[t]) : t;
    }

    // Full refresh of the runtime view (also after language change)
    App.ui.refreshRuntime = function () {
        const s = S();
        if (!s) return;
        refs.prev.textContent = ''; refs.prev.appendChild(icon('back', 17)); refs.prev.appendChild(el('span', { text: App.t('previous') }));
        refs.check.textContent = ''; refs.check.appendChild(icon('check', 17)); refs.check.appendChild(el('span', { text: App.t('validate') }));
        refs.check.classList.toggle('hidden', !s.studyMode);
        refs.gridTitle.textContent = App.t('progress');
        refs.finish.textContent = ''; refs.finish.appendChild(icon('flag', 16)); refs.finish.appendChild(el('span', { text: App.t('endScore') }));
        refs.help.textContent = App.t('keyboardHelp');
        refs.noteSummary.textContent = ''; refs.noteSummary.appendChild(icon('note', 15)); refs.noteSummary.appendChild(el('span', { text: App.t('note') }));
        refs.noteArea.placeholder = App.t('notePlaceholder');
        refs.legend.textContent = '';
        refs.legend.appendChild(el('span', { class: 'lg-answered', text: App.t('legendAnswered') }));
        refs.legend.appendChild(el('span', { text: App.t('legendUnanswered') }));
        refs.legend.appendChild(el('span', { class: 'lg-flagged', text: App.t('legendFlagged') }));
        renderQuestion();
        renderGrid();
        updateClock();
        renderPause();
        renderPace();

    function renderQuestion() {
        const s = S();
        const i = s.index;
        const item = s.item(i);
        const h = s.handler(i);
        const checked = s.studyMode && s.isChecked(i);
        refs.topic.textContent = topicName(item.topic);
        refs.pos.textContent = App.t('questionOf', { i: i + 1, n: s.length });
        refs.text.textContent = '';
        refs.text.appendChild(App.rich.node(App.loc(item.text)));
        refs.body.textContent = '';
        refs.body.appendChild(h.render({
            item, value: s.value(i), locked: checked, reveal: checked, uid: 'q' + i,
            onChange: (v, o) => {
                s.setValue(i, v);
                App.events.emit('answer', { session: s, index: i, value: v });
                renderGrid();
                paintClear();
                schedulePersist();
                if (!o || !o.silent) renderQuestion();
            }
        }));
        refs.expl.textContent = '';
        if (checked) {
            refs.expl.appendChild(el('div', { class: 'dynamic-explanation-box' }, el('div', {},
                el('h3', { text: App.t('explanation') }),
                item.explanation ? App.rich.node(App.loc(item.explanation)) : el('p', { text: App.t('noExplanation') }))));
        }
        refs.check.disabled = !!checked;
        const last = i === s.length - 1;
        refs.next.textContent = '';
        refs.next.appendChild(el('span', { text: last ? App.t('finish') : App.t('next') }));
        refs.next.appendChild(icon(last ? 'flag' : 'next', 17));
        refs.prev.disabled = i === 0;
        const st = App.storage.getQStat(s.examId, item.uid) || {};
        refs.flag.setAttribute('aria-pressed', st.flag ? 'true' : 'false');
        refs.flag.textContent = ''; refs.flag.appendChild(icon('flag', 14)); refs.flag.appendChild(el('span', { text: st.flag ? App.t('unflag') : App.t('flag') }));
        refs.noteArea.value = st.note || '';
        refs.note.open = !!st.note;
        paintClear();
        refs.clear.textContent = ''; refs.clear.appendChild(icon('x', 14)); refs.clear.appendChild(el('span', { text: App.t('clearBtn') }));
        refs.report.textContent = ''; refs.report.appendChild(icon('flag', 14)); refs.report.appendChild(el('span', { text: App.t('reportBtn') }));
    }

    function paintClear() {
        const s = S(), i = s.index;
        refs.clear.disabled = s.isChecked(i) && s.studyMode || !s.hasAnswer(i);
    }

    function clearAnswer() {
        const s = S(), i = s.index;
        if (s.isChecked(i) || !s.hasAnswer(i)) return;
        s.setValue(i, undefined);
        App.events.emit('answer', { session: s, index: i, value: undefined });
        renderQuestion(); renderGrid(); App.ui.persist();
    }

    function renderGrid() {
        const s = S();
        const stats = App.storage.allQStats(s.examId);
        refs.grid.textContent = '';
        for (let i = 0; i < s.length; i++) {
            let cls = 'nav-grid-btn' + (i === s.index ? ' active' : '');
            if (s.studyMode && s.validated[i] === true) cls += ' answered-correct';
            else if (s.studyMode && s.validated[i] === false) cls += ' answered-wrong';
            else if (s.hasAnswer(i)) cls += ' answered';
            const st = stats[s.item(i).uid];
            if (st && st.flag) cls += ' flagged';
            refs.grid.appendChild(el('button', { type: 'button', class: cls, text: String(i + 1), onclick: () => go(i),
                aria: { label: App.t('questionOf', { i: i + 1, n: s.length }), current: i === s.index ? 'true' : 'false' } }));
        }
        const answered = s.answeredCount();
        refs.gridCount.textContent = App.t('answeredOf', { a: answered, n: s.length });
        refs.bar.style.width = (s.length ? Math.round(100 * answered / s.length) : 0) + '%';
    }

    function go(i) {
        const s = S();
        if (s.goTo(i)) { renderQuestion(); renderGrid(); updateClock(); App.ui.persist(); App.events.emit('navigate', { session: s, index: i }); }
    }

    function nextQuestion() {
        const s = S();
        if (s.index === s.length - 1) App.ui.openReview(); else go(s.index + 1);
    }

    function checkAnswer() {
        const s = S();
        const r = s.check(s.index);
        if (r === null) { App.ui.toast(App.t('selectFirst')); return; }
        App.events.emit('check', { session: s, index: s.index, correct: r });
        renderQuestion(); renderGrid(); App.ui.persist();
    }

    function toggleFlag() {
        const s = S(), uid = s.item().uid;
        App.storage.patchQStat(s.examId, uid, st => { st.flag = !st.flag; return st; });
        renderQuestion(); renderGrid();
    }

    // ---- clock ----
    function updateClock() {
        const s = S();
        const box = $('runtime-timer-box');
        const live = App.state.screen === 'runtime' || (App.state.screen === 'review' && s && s.timerMode === 'total');
        if (!s || !live || s.timerMode === 'none') { box.classList.add('hidden'); return; }
        box.classList.remove('hidden');
        const per = s.timerMode === 'perQuestion';
        const left = per ? s.qLeft : s.secondsLeft;
        $('timer-label').textContent = per ? App.t('timerQuestionLabel') : App.t('timeRemaining');
        $('runtime-clock-string').textContent = App.ui.fmtTime(left);
        const warn = per ? 10 : 60, danger = per ? 5 : 15;
        box.classList.toggle('warn', left <= warn && left > danger);
        box.classList.toggle('danger', left <= danger);
    }
    App.ui.updateClock = updateClock;

    function startClock() {
        clearInterval(App.state.clockTimer);
        App.state.clockTimer = setInterval(() => {
            const s = S();
            const screen = App.state.screen;
            // the total timer keeps running on the review screen; per-question timers pause there
            if (!s || s.paused || !(screen === 'runtime' || (screen === 'review' && s.timerMode === 'total'))) return;
            const ev = s.tick();
            updateClock();
            if (screen === 'runtime') renderPace();
            if (ev === 'total') { App.ui.submit(true); return; }
            if (ev === 'question' && screen === 'runtime') { if (s.index < s.length - 1) go(s.index + 1); else App.ui.openReview(); return; }
            if (s.times[s.index] % 10 === 0) App.ui.persist();
        }, 1000);
    }
    App.ui.stopClock = function () {
        clearInterval(App.state.clockTimer);
        App.state.clockTimer = null;
        const box = $('runtime-timer-box');
        box.classList.add('hidden'); box.classList.remove('warn', 'danger');
    };

    // ---- keyboard ----
    document.addEventListener('keydown', e => {
        if (App.state.screen !== 'runtime' || e.ctrlKey || e.metaKey || e.altKey) return;
        if (S() && S().paused && e.key.toLowerCase() !== 'p') return;
        const t = e.target;
        const typing = t && (t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || (t.tagName === 'INPUT' && t.type === 'text') || (e.key.startsWith('Arrow') && t.classList && t.classList.contains('option-input')));
        if (typing) return;
        const s = S();
        const key = e.key.toLowerCase();
        const pick = idx => {
            const inputs = refs.body.querySelectorAll('.option-input');
            if (inputs[idx] && !inputs[idx].disabled) { inputs[idx].click(); e.preventDefault(); }
        };
        if (/^[1-6]$/.test(key)) pick(parseInt(key, 10) - 1);
        else if (/^[a-f]$/.test(key)) pick(key.charCodeAt(0) - 97);
        else if (key === 'arrowright') { if (s.index < s.length - 1) go(s.index + 1); e.preventDefault(); }
        else if (key === 'arrowleft') { go(s.index - 1); e.preventDefault(); }
        else if (key === 'm') { toggleFlag(); e.preventDefault(); }
        else if (key === 'r') { App.ui.reportQuestion(s.item()); e.preventDefault(); }
        else if (key === 'x') { clearAnswer(); e.preventDefault(); }
        else if (key === 'p') { if (s.paused) doUnpause(); else doPause(); e.preventDefault(); }
        else if (key === 'enter' && t.tagName !== 'BUTTON' && t.tagName !== 'A' && t.tagName !== 'SUMMARY') {
            if (s.studyMode && !s.isChecked(s.index) && s.hasAnswer(s.index)) checkAnswer(); else nextQuestion();
            e.preventDefault();
        }
    });
})();

/* UI: statistics screen (history chart, accuracy by topic, hardest questions). */
(function () {
    const { el, icon } = App.util;
    const $ = App.ui.$;
    const SVGNS = 'http://www.w3.org/2000/svg';
    const svg = (tag, attrs) => { const n = document.createElementNS(SVGNS, tag); Object.entries(attrs || {}).forEach(([k, v]) => n.setAttribute(k, v)); return n; };

    App.ui.openStats = function () { App.ui.show('stats'); App.ui.renderStats(); };

    function historyChart(attempts, threshold) {
        const list = attempts.slice(-30);
        const W = 600, H = 180, L = 30, R = 12, T = 12, B = 22;
        const root = svg('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': App.t('statsHistory') });
        const y = pct => T + (H - T - B) * (1 - pct / 100);
        [0, 50, 100].forEach(p => {
            root.appendChild(svg('line', { x1: L, x2: W - R, y1: y(p), y2: y(p), class: 'chart-axis' }));
            const t = svg('text', { x: 4, y: y(p) + 3, class: 'chart-label' }); t.textContent = p; root.appendChild(t);
        });
        if (threshold !== null) root.appendChild(svg('line', { x1: L, x2: W - R, y1: y(threshold), y2: y(threshold), class: 'chart-thr' }));
        const x = i => list.length === 1 ? (L + W - R) / 2 : L + (W - L - R) * i / (list.length - 1);
        const pts = list.map((a, i) => x(i) + ',' + y(a.pct));
        if (list.length > 1) root.appendChild(svg('polygon', { points: x(0) + ',' + y(0) + ' ' + pts.join(' ') + ' ' + x(list.length - 1) + ',' + y(0), class: 'chart-area' }));
        root.appendChild(svg('polyline', { points: pts.join(' '), class: 'chart-line' }));
        list.forEach((a, i) => {
            const c = svg('circle', { cx: x(i), cy: y(a.pct), r: 4.5, class: 'chart-dot' + (a.passed ? '' : ' fail') });
            const title = svg('title'); title.textContent = a.pct + '% · ' + (a.modeLabel || a.mode) + ' · ' + new Date(a.ts).toLocaleDateString(); c.appendChild(title);
            root.appendChild(c);
        });
        return root;
    }

    App.ui.renderStats = function () {
        const exam = App.state.exam;
        const v = $('view-stats');
        v.textContent = '';
        const st = App.stats.compute(exam, App.storage);
        const card = el('div', { class: 'card' });
        card.appendChild(el('div', { class: 'row between', style: 'margin-bottom:6px' },
            el('div', {}, el('h1', { text: App.t('statsTitle') }), el('p', { class: 'subtitle', text: App.loc(exam.title) })),
            App.ui.btn(App.t('backBtn'), 'back', 'btn-secondary btn-sm', () => { App.ui.renderDashboard(); App.ui.show('dashboard'); })));
        v.appendChild(card);

        if (!st.attemptCount && !st.answered) { card.appendChild(el('p', { class: 'subtitle', style: 'margin-top:14px', text: App.t('statsEmpty') })); return; }

        const tile = (ic, value, label) => el('div', { class: 'tile' }, el('div', { class: 'tile-icon' }, icon(ic, 19)), el('div', {}, el('div', { class: 'tile-value', text: String(value) }), el('div', { class: 'tile-label', text: label })));
        card.appendChild(el('div', { class: 'tiles' },
            tile('layers', st.attemptCount, App.t('statsAttempts')),
            tile('target', st.accuracy === null ? '–' : st.accuracy + '%', App.t('statsAccuracy')),
            tile('trophy', st.bestPct === null ? '–' : st.bestPct + '%', App.t('statsBest')),
            tile('check', st.answered, App.t('statsAnswered')),
            tile('star', st.mastered + ' / ' + st.totalQuestions, App.t('statsMastered')),
            tile('clock', st.avgTimeSec === null ? '–' : st.avgTimeSec + ' s', App.t('statsAvgTime'))));

        if (st.attempts.length) {
            const thr = st.attempts[st.attempts.length - 1].threshold;
            card.appendChild(el('div', { class: 'stat-section chart-box' }, el('h2', { text: App.t('statsHistory') }), historyChart(st.attempts, typeof thr === 'number' ? thr : null)));
        }

        const topics = el('div', { class: 'stat-section' }, el('h2', { text: App.t('statsTopics') }));
        st.topics.forEach(t => {
            const name = exam.topics && exam.topics[t.topic] ? App.loc(exam.topics[t.topic]) : t.topic;
            const pct = t.pct === null ? 0 : t.pct;
            const cls = t.pct === null ? '' : (t.pct < 50 ? ' low' : (t.pct < 75 ? ' mid' : ''));
            topics.appendChild(el('div', { class: 'bar-row' },
                el('span', { text: name }),
                el('div', { class: 'bar-track', role: 'img', aria: { label: name + ' ' + (t.pct === null ? '–' : t.pct + '%') } }, el('div', { class: 'bar-fill' + cls, style: 'width:' + pct + '%' })),
                el('span', { class: 'bar-pct', text: t.pct === null ? '–' : t.pct + '%' })));
        });
        card.appendChild(topics);

        const hard = el('div', { class: 'stat-section' }, el('h2', { text: App.t('statsHardest') }));
        if (!st.hardest.length) hard.appendChild(el('p', { class: 'hint', text: App.t('statsNoHard') }));
        st.hardest.forEach(h => hard.appendChild(el('div', { class: 'hard-row' },

            el('div', { class: 'hard-meta', text: h.topic + ' · ' + App.t('statsErrRate', { p: Math.round(h.rate * 100), w: h.wrong, n: h.seen }) }))));
        card.appendChild(hard);
        v.appendChild(App.ui.qualityPanel(exam));
    };
})();

            } else {

                const setA = patch => upd(() => { const cur = typeof q.answer === 'object' && q.answer !== null ? q.answer : { value: q.answer }; const n = Object.assign({}, cur, patch); Object.keys(n).forEach(k => { if (n[k] === '' || n[k] === undefined || (k === 'tolerance' && !n[k])) delete n[k]; }); q.answer = (Object.keys(n).length === 1 && 'value' in n) ? n.value : n; });

                    el('div', { class: 'field' }, el('label', { for: val.id, text: App.t('edValue') }), val),
                    el('div', { class: 'field' }, el('label', { text: App.t('edTolerance') }), tol),
